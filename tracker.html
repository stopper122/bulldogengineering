<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student CSV Uploader</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; }

    .layout {
      display:flex;
      height:100vh;
    }

    .main {
      flex:1;
      overflow:auto;
      padding:20px;
    }

    .sidebar {
      width:400px;
      background:#111827;
      color:white;
      overflow:auto;
      transition: transform 0.3s ease;
    }

    .sidebar.hidden {
      transform: translateX(100%);
    }

    .sidebar h3 { margin-top:0; }

    .container { max-width:1200px; margin:auto; }
    .card { background:white; padding:20px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.1); margin-bottom:20px; }

    .tabs button { margin-right:5px; margin-bottom:5px; padding:8px 12px; border:none; border-radius:6px; background:#ddd; cursor:pointer; }
    .tabs button.active { background:#2563eb; color:white; }
    .tabs button.current { background:#16a34a; color:white; }

    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:6px; font-size:14px; }

    .log-table-wrap { max-height:90vh; overflow:auto; }

    .timer-live { color:#10b981; }
    .timer-overdue { color:#ef4444; font-weight:bold; }

    .toggle-btn {
      position:fixed;
      right:10px;
      top:10px;
      z-index:1000;
      padding:10px;
    }
  </style>
</head>
<body>

<button class="toggle-btn" onclick="toggleMasterLog()">Toggle Log</button>

<div class="layout">

  <div class="main">
    <div class="container">

      <div class="card">
        <h2>Upload CSV</h2>
        <input type="file" id="fileInput" accept=".csv" />
        <p id="status"></p>
      </div>

      <div class="card">
        <h3>Add Student</h3>
        <input id="newId" placeholder="Student ID" />
        <input id="newFirst" placeholder="First Name" />
        <input id="newLast" placeholder="Last Name" />
        <input id="newPeriod" placeholder="Period" />
        <button id="addBtn">Add</button>
      </div>

      <div class="card" id="results" style="display:none;">
        <div class="tabs" id="tabs"></div>
        <div id="tableContainer"></div>
      </div>

    </div>
  </div>

  <div class="sidebar hidden" id="masterLogSidebar">
    <div style="padding:20px;">
      <h3>Master Log</h3>
      <div id="masterLogContainer"></div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({ projectId: "rrtracker-de70e" });
  const db = getFirestore(app);

  const tabsEl = document.getElementById("tabs");
  const tableContainer = document.getElementById("tableContainer");
  const sidebar = document.getElementById("masterLogSidebar");

  let grouped = {};
  let allDocs = [];

  window.toggleMasterLog = () => {
    sidebar.classList.toggle("hidden");
  };

  function renderTabs() {
    tabsEl.innerHTML = "";
    Object.keys(grouped).forEach(period => {
      const btn = document.createElement("button");
      btn.textContent = "Period " + period;
      btn.onclick = () => renderTable(period);
      tabsEl.appendChild(btn);
    });
  }

  function renderTable(period) {
    const students = grouped[period];
    let html = "<table><tr><th>Name</th></tr>";
    students.forEach(s => {
      html += `<tr><td>${s.lastName}, ${s.firstName}</td></tr>`;
    });
    html += "</table>";
    tableContainer.innerHTML = html;
  }

  function renderLog() {
    let html = "<table><tr><th>Student</th><th>Event</th></tr>";
    allDocs.forEach(s => {
      (s.behaviorLog || []).forEach(e => {
        html += `<tr><td>${s.lastName}</td><td>${e.type}</td></tr>`;
      });
    });
    html += "</table>";
    document.getElementById("masterLogContainer").innerHTML = html;
  }

  async function load() {
    const snap = await getDocs(collection(db, "students"));
    grouped = {};
    allDocs = [];

    snap.forEach(d => {
      const s = d.data();
      allDocs.push(s);
      if (!grouped[s.period]) grouped[s.period] = [];
      grouped[s.period].push(s);
    });

    renderTabs();
    renderLog();
  }

  onSnapshot(collection(db, "students"), load);

</script>

</body>
</html>
