<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Management Tracker v1.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.3.2/papaparse.min.js"></script>
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 1);
        }
        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #1d4ed8;
        }
        body {
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-white shadow-sm px-4 py-3 flex justify-between items-center">
        <div class="flex items-baseline gap-2">
            <h1 class="font-bold text-xl text-slate-800">Classroom Manager</h1>
            <span class="text-[10px] font-mono bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">v1.2</span>
        </div>
        <div class="flex gap-1 sm:gap-2">
            <button onclick="switchTab('roster')" class="nav-btn px-2 sm:px-3 py-1 text-sm font-medium rounded-md transition hover:bg-slate-100">Roster</button>
            <button onclick="switchTab('tracker')" class="nav-btn px-2 sm:px-3 py-1 text-sm font-medium rounded-md transition hover:bg-slate-100">Tracker</button>
            <button onclick="switchTab('logs')" class="nav-btn px-2 sm:px-3 py-1 text-sm font-medium rounded-md transition hover:bg-slate-100">Logs</button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-4">

        <!-- SETUP / ROSTER TAB -->
        <section id="tab-roster" class="tab-content">
            <div class="glass-card rounded-xl p-6 shadow-sm mb-6 border-l-4 border-l-blue-500">
                <h2 class="text-lg font-semibold mb-2">Upload Roster</h2>
                <p class="text-xs text-slate-500 mb-4 font-mono uppercase tracking-wider">Required Columns: period, firstName, lastName, studentId</p>
                <input type="file" id="csv-file" accept=".csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4">
                <button id="import-btn" onclick="handleFileUpload()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed">Import Students</button>
                <p id="import-status" class="text-center text-xs mt-2 hidden text-blue-600 font-medium"></p>
            </div>

            <div class="glass-card rounded-xl p-6 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">Current Roster</h2>
                    <select id="period-filter-roster" onchange="renderRoster()" class="border rounded-lg px-2 py-1 text-sm bg-white">
                        <option value="all">All Periods</option>
                    </select>
                </div>
                <div id="roster-list" class="space-y-2 max-h-[400px] overflow-y-auto pr-2">
                    <p class="text-slate-400 text-center italic py-10">No students imported yet.</p>
                </div>
            </div>
        </section>

        <!-- LIVE TRACKER TAB -->
        <section id="tab-tracker" class="tab-content hidden">
            <div id="active-passes" class="mb-6 hidden">
                <h2 class="text-sm font-bold text-blue-600 uppercase tracking-widest mb-3">Live Out-of-Class Passes</h2>
                <div id="active-passes-list" class="grid gap-3 grid-cols-1 sm:grid-cols-2">
                    <!-- Active passes cards -->
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">Log Action</h2>
                <select id="period-filter-tracker" onchange="renderTracker()" class="border rounded-lg px-2 py-1 text-sm bg-white shadow-sm">
                    <option value="all">Filter: All</option>
                </select>
            </div>
            
            <div id="tracker-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                <!-- Quick tap student buttons -->
            </div>
        </section>

        <!-- LOGS / EXPORT TAB -->
        <section id="tab-logs" class="tab-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-semibold">Incident History</h2>
                <button onclick="exportToCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm hover:bg-green-700 active:scale-[0.98] transition">Export CSV</button>
            </div>
            <div id="history-list" class="space-y-2">
                <!-- History items -->
            </div>
        </section>

    </div>

    <!-- Modals -->
    <div id="student-modal" class="fixed inset-0 bg-slate-900/60 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl">
            <div class="text-center mb-6">
                <h3 id="modal-student-name" class="text-xl font-bold text-slate-800">Student Name</h3>
                <p id="modal-student-info" class="text-xs text-slate-400 uppercase tracking-widest mt-1">Period 1 • ID: 12345</p>
            </div>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="logIncident('Phone')" class="bg-orange-50 text-orange-700 p-4 rounded-2xl font-bold border-2 border-orange-100 flex items-center justify-between hover:bg-orange-100 active:scale-95 transition">
                    <span>📱 Phone Use</span>
                    <span class="text-orange-300">→</span>
                </button>
                <button onclick="logIncident('Eating')" class="bg-yellow-50 text-yellow-700 p-4 rounded-2xl font-bold border-2 border-yellow-100 flex items-center justify-between hover:bg-yellow-100 active:scale-95 transition">
                    <span>🍕 Eating/Drinking</span>
                    <span class="text-yellow-300">→</span>
                </button>
                <button onclick="logIncident('Disruptive')" class="bg-red-50 text-red-700 p-4 rounded-2xl font-bold border-2 border-red-100 flex items-center justify-between hover:bg-red-100 active:scale-95 transition">
                    <span>🗣️ Disruptive</span>
                    <span class="text-red-300">→</span>
                </button>
                <div class="h-px bg-slate-100 my-2"></div>
                <button onclick="startPass()" class="bg-blue-600 text-white p-4 rounded-2xl font-bold shadow-lg shadow-blue-200 flex items-center justify-between hover:bg-blue-700 active:scale-95 transition">
                    <span>🚪 Start Pass</span>
                    <span class="text-blue-300">+</span>
                </button>
                <button onclick="closeModal()" class="mt-4 text-slate-400 text-sm font-semibold py-2">Close</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'classroom-tracker';
        const APP_VERSION = "v1.2";
        
        // INITIALIZE FIREBASE
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // STATE
        let students = [];
        let logs = [];
        let activePasses = [];
        let selectedStudent = null;
        let currentUser = null;

        // AUTHENTICATION
        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await auth.signInWithCustomToken(__initial_auth_token);
                } else {
                    await auth.signInAnonymously();
                }
            } catch (e) {
                console.error("Auth failed:", e);
            }
            
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    setupListeners();
                }
            });
            
            // Set initial tab UI
            switchTab('tracker');
        }

        // LISTENERS
        function setupListeners() {
            if (!currentUser) return;
            const studentPath = `/artifacts/${appId}/users/${currentUser.uid}/students`;
            const logPath = `/artifacts/${appId}/users/${currentUser.uid}/logs`;

            db.collection(studentPath).onSnapshot(snapshot => {
                students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updatePeriodFilters();
                renderRoster();
                renderTracker();
            });

            db.collection(logPath).onSnapshot(snapshot => {
                logs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                        .sort((a, b) => {
                            const timeA = a.timestamp?.toMillis() || 0;
                            const timeB = b.timestamp?.toMillis() || 0;
                            return timeB - timeA;
                        });
                
                activePasses = logs.filter(l => l.type === 'Pass' && !l.returnTimestamp);
                renderActivePasses();
                renderLogs();
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        // NAVIGATION
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('tab-active', 'bg-blue-50', 'text-blue-700'));
            
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            
            const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.textContent.toLowerCase() === tabId);
            if (activeBtn) activeBtn.classList.add('tab-active', 'bg-blue-50', 'text-blue-700');
        }

        // ROSTER MANAGEMENT
        async function handleFileUpload() {
            const fileInput = document.getElementById('csv-file');
            const importBtn = document.getElementById('import-btn');
            const statusMsg = document.getElementById('import-status');

            if (!fileInput.files.length) {
                alert("Please select a CSV file first.");
                return;
            }

            if (!currentUser) {
                alert("Auth error. Please wait for the app to initialize.");
                return;
            }

            importBtn.disabled = true;
            statusMsg.textContent = "Processing...";
            statusMsg.classList.remove('hidden');

            Papa.parse(fileInput.files[0], {
                header: true,
                skipEmptyLines: true,
                complete: async (results) => {
                    try {
                        const batch = db.batch();
                        const path = `/artifacts/${appId}/users/${currentUser.uid}/students`;
                        
                        let count = 0;
                        results.data.forEach(row => {
                            // Check for header mapping variations
                            const period = row.period || row.Period || '1';
                            const fName = (row.firstName || row.first || row['First Name'] || '').trim();
                            const lName = (row.lastName || row.last || row['Last Name'] || '').trim();
                            const sId = (row.studentId || row.id || row['Student ID'] || '').trim();

                            if (fName || lName) {
                                const docRef = db.collection(path).doc();
                                batch.set(docRef, {
                                    period: period,
                                    firstName: fName,
                                    lastName: lName,
                                    studentId: sId || docRef.id,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                count++;
                            }
                        });

                        if (count > 0) {
                            await batch.commit();
                            alert(`Success! Imported ${count} students.`);
                        } else {
                            alert("No valid student data found in CSV. Please check headers: period, firstName, lastName, studentId.");
                        }
                    } catch (err) {
                        console.error("Import Error:", err);
                        alert("Error saving students to database. Please try again.");
                    } finally {
                        importBtn.disabled = false;
                        statusMsg.classList.add('hidden');
                        fileInput.value = "";
                    }
                },
                error: (err) => {
                    console.error("CSV Parse Error:", err);
                    alert("Error reading CSV file.");
                    importBtn.disabled = false;
                    statusMsg.classList.add('hidden');
                }
            });
        }

        function updatePeriodFilters() {
            const periods = [...new Set(students.map(s => s.period))].sort((a,b) => String(a).localeCompare(String(b), undefined, {numeric: true}));
            ['period-filter-roster', 'period-filter-tracker'].forEach(id => {
                const select = document.getElementById(id);
                const currentVal = select.value;
                select.innerHTML = id.includes('tracker') ? '<option value="all">Filter: All</option>' : '<option value="all">All Periods</option>';
                periods.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = `Period ${p}`;
                    select.appendChild(opt);
                });
                select.value = currentVal;
            });
        }

        function renderRoster() {
            const list = document.getElementById('roster-list');
            const filter = document.getElementById('period-filter-roster').value;
            const filtered = filter === 'all' ? students : students.filter(s => s.period == filter);
            
            if (filtered.length === 0) {
                list.innerHTML = `<p class="text-slate-400 text-center italic py-8">No students found.</p>`;
                return;
            }

            list.innerHTML = filtered.sort((a,b) => a.lastName.localeCompare(b.lastName)).map(s => `
                <div class="flex justify-between items-center p-3 bg-white border border-slate-100 rounded-lg shadow-sm">
                    <div>
                        <div class="font-bold text-slate-700">${s.lastName}, ${s.firstName}</div>
                        <div class="text-[10px] text-slate-400 uppercase font-mono">ID: ${s.studentId} • Per: ${s.period}</div>
                    </div>
                    <button onclick="deleteStudent('${s.id}')" class="p-2 text-slate-300 hover:text-red-500 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                </div>
            `).join('');
        }

        async function deleteStudent(id) {
            if (!confirm("Remove student from roster? Logs will be preserved.")) return;
            await db.collection(`/artifacts/${appId}/users/${currentUser.uid}/students`).doc(id).delete();
        }

        // TRACKER LOGIC
        function renderTracker() {
            const grid = document.getElementById('tracker-grid');
            const filter = document.getElementById('period-filter-tracker').value;
            const filtered = filter === 'all' ? students : students.filter(s => s.period == filter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-10 text-center text-slate-400 italic">Import your roster to start tracking.</div>`;
                return;
            }

            grid.innerHTML = filtered.sort((a,b) => a.lastName.localeCompare(b.lastName)).map(s => `
                <button onclick="openStudentActions('${s.id}')" class="p-4 bg-white border-b-4 border-slate-200 rounded-2xl shadow-sm hover:border-blue-400 active:translate-y-1 transition-all text-center">
                    <div class="font-bold text-slate-800 truncate">${s.firstName} ${s.lastName[0]}.</div>
                    <div class="text-[10px] text-slate-400 mt-1 uppercase font-bold tracking-tighter">Period ${s.period}</div>
                </button>
            `).join('');
        }

        function openStudentActions(id) {
            selectedStudent = students.find(s => s.id === id);
            document.getElementById('modal-student-name').textContent = `${selectedStudent.firstName} ${selectedStudent.lastName}`;
            document.getElementById('modal-student-info').textContent = `Period ${selectedStudent.period} • ID: ${selectedStudent.studentId}`;
            document.getElementById('student-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('student-modal').classList.add('hidden');
            selectedStudent = null;
        }

        async function logIncident(category) {
            if (!currentUser) return;
            const path = `/artifacts/${appId}/users/${currentUser.uid}/logs`;
            await db.collection(path).add({
                type: 'Behavior',
                category: category,
                studentId: selectedStudent.studentId,
                name: `${selectedStudent.firstName} ${selectedStudent.lastName}`,
                period: selectedStudent.period,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            closeModal();
        }

        async function startPass() {
            if (!currentUser) return;
            const path = `/artifacts/${appId}/users/${currentUser.uid}/logs`;
            await db.collection(path).add({
                type: 'Pass',
                category: 'Out of Class',
                studentId: selectedStudent.studentId,
                name: `${selectedStudent.firstName} ${selectedStudent.lastName}`,
                period: selectedStudent.period,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                returnTimestamp: null
            });
            closeModal();
        }

        async function endPass(logId) {
            if (!currentUser) return;
            const path = `/artifacts/${appId}/users/${currentUser.uid}/logs`;
            await db.collection(path).doc(logId).update({
                returnTimestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function renderActivePasses() {
            const list = document.getElementById('active-passes-list');
            const container = document.getElementById('active-passes');
            
            if (activePasses.length === 0) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');

            list.innerHTML = activePasses.map(p => {
                const start = p.timestamp?.toMillis() || Date.now();
                const mins = Math.floor((Date.now() - start) / 60000);
                return `
                    <div class="bg-blue-600 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center ring-4 ring-blue-100">
                        <div>
                            <div class="font-bold text-lg leading-tight">${p.name}</div>
                            <div class="text-xs opacity-80 font-mono">Out for ${mins}m • Per ${p.period}</div>
                        </div>
                        <button onclick="endPass('${p.id}')" class="bg-white text-blue-600 px-5 py-2 rounded-full text-sm font-black shadow-inner active:scale-90 transition">BACK</button>
                    </div>
                `;
            }).join('');
        }

        function renderLogs() {
            const list = document.getElementById('history-list');
            if (logs.length === 0) {
                list.innerHTML = `<p class="text-slate-400 text-center italic py-20">No incidents logged yet.</p>`;
                return;
            }
            
            list.innerHTML = logs.map(l => {
                const date = l.timestamp?.toDate().toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) || 'Saving...';
                let durationStr = "";
                if (l.type === 'Pass' && l.returnTimestamp) {
                    const diff = Math.floor((l.returnTimestamp.toMillis() - l.timestamp.toMillis()) / 60000);
                    durationStr = ` • Return: ${l.returnTimestamp.toDate().toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'})} (${diff}m)`;
                }

                const colorClass = l.type === 'Pass' ? 'bg-blue-50 text-blue-700 border-blue-100' : 'bg-orange-50 text-orange-700 border-orange-100';

                return `
                    <div class="p-4 bg-white border border-slate-100 rounded-xl shadow-sm flex items-start gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${colorClass} border">
                            ${l.type === 'Pass' ? '🚪' : '⚠️'}
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <span class="font-bold text-slate-800">${l.name}</span>
                                <span class="px-2 py-0.5 rounded-full text-[9px] uppercase font-black tracking-widest ${colorClass} border">
                                    ${l.category}
                                </span>
                            </div>
                            <div class="text-[11px] text-slate-400 mt-0.5 font-medium uppercase tracking-tight">
                                Period ${l.period} • ${date}${durationStr}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function exportToCSV() {
            const csvRows = [
                ["Date", "Time", "Student Name", "Period", "Type", "Incident/Pass", "Duration (mins)"]
            ];

            logs.forEach(l => {
                let duration = "";
                if (l.type === 'Pass' && l.returnTimestamp) {
                    duration = Math.floor((l.returnTimestamp.toMillis() - l.timestamp.toMillis()) / 60000);
                }
                const dateObj = l.timestamp?.toDate();
                csvRows.push([
                    dateObj?.toLocaleDateString() || "",
                    dateObj?.toLocaleTimeString() || "",
                    l.name,
                    l.period,
                    l.type,
                    l.category,
                    duration
                ]);
            });

            const csvContent = "data:text/csv;charset=utf-8," 
                + csvRows.map(e => e.map(cell => `"${cell}"`).join(",")).join("\n");

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Classroom_Export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // INIT
        window.onload = initApp;

        // Auto-refresh timer for active passes display
        setInterval(() => renderActivePasses(), 30000);

    </script>
</body>
</html>
