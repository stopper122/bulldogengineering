<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Student Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-black text-slate-900">Roster Parser</h1>
            <p class="text-slate-500">Upload a CSV to view students sorted by period.</p>
        </header>

        <!-- Upload Box -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border-2 border-dashed border-slate-300 mb-8 transition-all hover:border-blue-400">
            <input type="file" id="csvFile" accept=".csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </div>

        <!-- Filter Bar -->
        <div id="controls" class="hidden mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <label class="font-bold text-slate-700">Filter Period:</label>
                <select id="periodFilter" onchange="displayStudents()" class="bg-white border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">All Periods</option>
                </select>
            </div>
            <div id="stats" class="text-sm font-medium text-slate-500"></div>
        </div>

        <!-- Roster Table -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-200">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th class="px-6 py-4 text-xs font-black uppercase text-slate-400 tracking-wider">Period</th>
                        <th class="px-6 py-4 text-xs font-black uppercase text-slate-400 tracking-wider">Last Name</th>
                        <th class="px-6 py-4 text-xs font-black uppercase text-slate-400 tracking-wider">First Name</th>
                        <th class="px-6 py-4 text-xs font-black uppercase text-slate-400 tracking-wider">Student ID</th>
                    </tr>
                </thead>
                <tbody id="rosterBody" class="divide-y divide-slate-100">
                    <tr>
                        <td colspan="4" class="px-6 py-12 text-center text-slate-400 italic">No data uploaded yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allStudents = [];

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Use PapaParse with the most basic settings to avoid over-engineering the header detection
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    console.log("Raw Results:", results);
                    processData(results.data);
                },
                error: function(err) {
                    alert("Error reading file: " + err.message);
                }
            });
        });

        function processData(rawData) {
            allStudents = rawData.map(row => {
                // Try to find the values regardless of capitalization in headers
                const findVal = (keys) => {
                    const match = Object.keys(row).find(k => 
                        keys.some(key => k.toLowerCase().trim() === key.toLowerCase())
                    );
                    return match ? row[match] : "";
                };

                return {
                    period: findVal(['period', 'per', 'class', 'pd']),
                    firstName: findVal(['first name', 'first', 'fname', 'given name']),
                    lastName: findVal(['last name', 'last', 'lname', 'surname']),
                    id: findVal(['student id', 'id', 'id number', 'student number', 'sid'])
                };
            }).filter(s => s.firstName || s.lastName); // Only keep rows that have a name

            // Sort by period (numeric) then last name
            allStudents.sort((a, b) => {
                const perA = parseInt(a.period) || 0;
                const perB = parseInt(b.period) || 0;
                if (perA !== perB) return perA - perB;
                return a.lastName.localeCompare(b.lastName);
            });

            // Setup filters
            setupFilters();
            
            // Show controls and display
            document.getElementById('controls').classList.remove('hidden');
            displayStudents();
        }

        function setupFilters() {
            const select = document.getElementById('periodFilter');
            const periods = [...new Set(allStudents.map(s => s.period))].filter(p => p).sort((a, b) => a - b);
            
            select.innerHTML = '<option value="all">All Periods</option>';
            periods.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = `Period ${p}`;
                select.appendChild(opt);
            });
        }

        function displayStudents() {
            const filter = document.getElementById('periodFilter').value;
            const tbody = document.getElementById('rosterBody');
            const stats = document.getElementById('stats');
            
            const filtered = filter === 'all' 
                ? allStudents 
                : allStudents.filter(s => s.period === filter);

            stats.textContent = `Showing ${filtered.length} students`;

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-slate-400 italic">No matching students found.</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(s => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap"><span class="bg-slate-100 text-slate-700 font-bold px-2 py-1 rounded text-sm">${s.period || '?'}</span></td>
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-slate-900">${s.lastName}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-slate-600">${s.firstName}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-slate-400 font-mono text-sm">${s.id}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
