<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student CSV Uploader</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#f3f4f6; }
    .container { max-width:900px; margin:40px auto; padding:20px; }
    .card { background:white; padding:20px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.1); margin-bottom:20px; }
    .tabs button { margin-right:5px; padding:8px 12px; border:none; border-radius:6px; background:#ddd; cursor:pointer; }
    .tabs button.active { background:#2563eb; color:white; }
    .tabs button.current { background:#16a34a; color:white; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:6px; }
    .actions button { margin-right:5px; }
    input { margin:4px 0; padding:5px; }
    .controls button { margin-right:5px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>Upload CSV</h2>
    <input type="file" id="fileInput" accept=".csv" />
    <p id="status"></p>
  </div>

  <div class="card">
    <h3>Add Student</h3>
    <input id="newId" placeholder="Student ID" />
    <input id="newFirst" placeholder="First Name" />
    <input id="newLast" placeholder="Last Name" />
    <input id="newPeriod" placeholder="Period" />
    <button id="addBtn">Add</button>
  </div>

  <div class="card controls">
    <h3>Controls</h3>
    <button onclick="setSort('first')">Sort by First Name</button>
    <button onclick="setSort('last')">Sort by Last Name</button>
    <input id="currentPeriodInput" placeholder="Current Period" />
    <button onclick="setCurrentPeriod()">Set Current Period</button>
  </div>

  <div class="card" id="results" style="display:none;">
    <div class="tabs" id="tabs"></div>
    <div id="tableContainer"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
    authDomain: "rrtracker-de70e.firebaseapp.com",
    projectId: "rrtracker-de70e",
    storageBucket: "rrtracker-de70e.firebasestorage.app",
    messagingSenderId: "1057987490614",
    appId: "1:1057987490614:web:7c37f2e0a9aa4e735a3997",
    measurementId: "G-X31008YT0P"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const fileInput = document.getElementById("fileInput");
  const statusEl = document.getElementById("status");
  const tabsEl = document.getElementById("tabs");
  const tableContainer = document.getElementById("tableContainer");
  const resultsDiv = document.getElementById("results");

  const addBtn = document.getElementById("addBtn");

  let grouped = {};
  let allDocs = [];
  let sortMode = null;
  let currentPeriod = null;

  async function loadFromFirebase() {
    const snapshot = await getDocs(collection(db, "students"));
    grouped = {};
    allDocs = [];

    snapshot.forEach(d => {
      const s = d.data();
      s._id = d.id;
      allDocs.push(s);
      if (!grouped[s.period]) grouped[s.period] = [];
      grouped[s.period].push(s);
    });

    renderTabs();
    const firstPeriod = Object.keys(grouped)[0];
    if (firstPeriod) {
      resultsDiv.style.display = "block";
      renderTable(firstPeriod);
    }
  }

  onSnapshot(collection(db, "students"), loadFromFirebase);

  function renderTabs() {
    tabsEl.innerHTML = "";
    Object.keys(grouped).sort().forEach(period => {
      const btn = document.createElement("button");
      btn.textContent = "Period " + period;
      if (period == currentPeriod) btn.classList.add("current");
      btn.onclick = () => renderTable(period);
      tabsEl.appendChild(btn);
    });
  }

  function renderTable(period) {
    let students = [...grouped[period]];

    if (sortMode === "first") {
      students.sort((a,b) => a.firstName.localeCompare(b.firstName));
    }
    if (sortMode === "last") {
      students.sort((a,b) => a.lastName.localeCompare(b.lastName));
    }

    document.querySelectorAll(".tabs button").forEach(btn => btn.classList.remove("active"));
    const activeBtn = [...tabsEl.children].find(b => b.textContent.includes(period));
    if (activeBtn) activeBtn.classList.add("active");

    let html = "<table><tr><th>ID</th><th>Name</th><th>Actions</th></tr>";
    students.forEach(s => {
      html += `<tr>
        <td>${s.studentId}</td>
        <td>${s.firstName} ${s.lastName}</td>
        <td class="actions">
          <button onclick="editStudent('${s._id}')">Edit</button>
          <button onclick="deleteStudent('${s._id}')">Delete</button>
        </td>
      </tr>`;
    });
    html += "</table>";

    tableContainer.innerHTML = html;
  }

  window.setSort = (mode) => {
    sortMode = mode;
    const active = document.querySelector('.tabs button.active');
    if (active) renderTable(active.textContent.split(' ')[1]);
  };

  window.setCurrentPeriod = () => {
    currentPeriod = document.getElementById("currentPeriodInput").value;
    renderTabs();
  };

  window.deleteStudent = async (id) => {
    await deleteDoc(doc(db, "students", id));
  };

  window.editStudent = async (id) => {
    const student = allDocs.find(s => s._id === id);
    const firstName = prompt("First Name:", student.firstName);
    const lastName = prompt("Last Name:", student.lastName);
    const period = prompt("Period:", student.period);

    await updateDoc(doc(db, "students", id), {
      firstName,
      lastName,
      period
    });
  };

  addBtn.onclick = async () => {
    const studentId = document.getElementById("newId").value;
    const firstName = document.getElementById("newFirst").value;
    const lastName = document.getElementById("newLast").value;
    const period = document.getElementById("newPeriod").value;

    if (!studentId || !period) return alert("Missing required fields");

    await addDoc(collection(db, "students"), {
      studentId,
      firstName,
      lastName,
      period
    });
  };

  loadFromFirebase();

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    statusEl.textContent = "Parsing CSV...";

    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: async (results) => {
        try {
          statusEl.textContent = "Uploading...";

          for (const student of results.data) {
            const normalized = {};
            Object.keys(student).forEach(k => {
              normalized[k.toLowerCase().trim()] = student[k];
            });

            const studentId = normalized["student id"];
            const period = normalized["period"];
            const firstName = normalized["first name"] || "";
            const lastName = normalized["last name"] || "";

            if (!studentId || !period) continue;

            await addDoc(collection(db, "students"), {
              studentId,
              firstName,
              lastName,
              period
            });
          }

          statusEl.textContent = "Upload complete";

        } catch (err) {
          console.error(err);
          statusEl.textContent = "Error uploading";
        }
      }
    });
  });
</script>

</body>
</html>
