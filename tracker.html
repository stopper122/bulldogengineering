<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student CSV Uploader</title>

  <!-- Firebase (v9 modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Make Firebase available globally
    window.initFirebase = () => {
      const firebaseConfig = {
        apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
        authDomain: "rrtracker-de70e.firebaseapp.com",
        projectId: "rrtracker-de70e",
        storageBucket: "rrtracker-de70e.firebasestorage.app",
        messagingSenderId: "1057987490614",
        appId: "1:1057987490614:web:7c37f2e0a9aa4e735a3997",
        measurementId: "G-X31008YT0P"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      return { db, collection, addDoc };
    };
  </script>

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h1 {
      text-align: center;
      margin-bottom: 16px;
    }

    .status {
      margin-top: 10px;
      color: #2563eb;
      font-weight: bold;
    }

    pre {
      background: #eee;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Student CSV Uploader</h1>

    <input type="file" id="fileInput" accept=".csv" />

    <p id="fileName"></p>
    <p id="status" class="status"></p>

    <div>
      <p>CSV format:</p>
      <pre>
studentId,period
12345,1
67890,2
      </pre>
    </div>
  </div>

  <script type="module">
    const { db, collection, addDoc } = window.initFirebase();

    const fileInput = document.getElementById("fileInput");
    const fileNameEl = document.getElementById("fileName");
    const statusEl = document.getElementById("status");

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileNameEl.textContent = "File: " + file.name;
      statusEl.textContent = "Parsing CSV...";

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: async (results) => {
          try {
            statusEl.textContent = "Uploading to Firebase...";

            for (const student of results.data) {
              // Handle different possible column names
              const studentId = student.studentId || student["student id"] || student.id;
              const period = student.period;
              const firstName = student["first name"] || student.firstName;
              const lastName = student["last name"] || student.lastName;

              // Skip rows with missing required data
              if (!studentId || !period) {
                console.warn("Skipping invalid row:", student);
                continue;
              }

              await addDoc(collection(db, "students"), {
                studentId,
                period,
                firstName: firstName || "",
                lastName: lastName || "",
                timestamp: new Date()
              });
            });
            }

            statusEl.textContent = "Upload complete!";
          } catch (err) {
            console.error(err);
            statusEl.textContent = "Error uploading data";
          }
        }
      });
    });
  </script>

</body>
</html>
