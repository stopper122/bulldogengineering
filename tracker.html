<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student CSV Uploader</title>

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .tabs button {
      margin-right: 5px;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #ddd;
      cursor: pointer;
    }

    .tabs button.active {
      background: #2563eb;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>Upload CSV</h2>
    <input type="file" id="fileInput" accept=".csv" />
    <p id="status"></p>
  </div>

  <div class="card" id="results" style="display:none;">
    <div class="tabs" id="tabs"></div>
    <div id="tableContainer"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Firebase setup
  const firebaseConfig = {
    apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
    authDomain: "rrtracker-de70e.firebaseapp.com",
    projectId: "rrtracker-de70e",
    storageBucket: "rrtracker-de70e.firebasestorage.app",
    messagingSenderId: "1057987490614",
    appId: "1:1057987490614:web:7c37f2e0a9aa4e735a3997",
    measurementId: "G-X31008YT0P"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const fileInput = document.getElementById("fileInput");
  const statusEl = document.getElementById("status");
  const tabsEl = document.getElementById("tabs");
  const tableContainer = document.getElementById("tableContainer");
  const resultsDiv = document.getElementById("results");

  let grouped = {};

// Load data from Firebase and sync in real-time
async function loadFromFirebase() {
  const snapshot = await getDocs(collection(db, "students"));
  grouped = {};

  snapshot.forEach(doc => {
    const s = doc.data();
    if (!grouped[s.period]) grouped[s.period] = [];
    grouped[s.period].push(s);
  });

  renderTabs();
  const firstPeriod = Object.keys(grouped)[0];
  if (firstPeriod) {
    resultsDiv.style.display = "block";
    renderTable(firstPeriod);
  }
}

// Real-time listener
onSnapshot(collection(db, "students"), () => {
  loadFromFirebase();
});

  function renderTabs() {
    tabsEl.innerHTML = "";
    Object.keys(grouped).sort().forEach(period => {
      const btn = document.createElement("button");
      btn.textContent = "Period " + period;
      btn.onclick = () => renderTable(period);
      tabsEl.appendChild(btn);
    });
  }

  function renderTable(period) {
    const students = grouped[period];

    document.querySelectorAll(".tabs button").forEach(btn => btn.classList.remove("active"));

    const activeBtn = [...tabsEl.children].find(b => b.textContent.includes(period));
    if (activeBtn) activeBtn.classList.add("active");

    let html = "<table><tr><th>ID</th><th>Name</th></tr>";
    students.forEach(s => {
      html += `<tr><td>${s.studentId}</td><td>${s.firstName} ${s.lastName}</td></tr>`;
    });
    html += "</table>";

    tableContainer.innerHTML = html;
  }

  // Initial load
loadFromFirebase();

fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    statusEl.textContent = "Parsing CSV...";

    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: async (results) => {
        grouped = {};

        try {
          statusEl.textContent = "Uploading...";

          for (const student of results.data) {
            // Normalize keys (case-insensitive + trim)
            const normalized = {};
            Object.keys(student).forEach(k => {
              normalized[k.toLowerCase().trim()] = student[k];
            });

            const studentId = normalized["student id"] || normalized["studentid"] || normalized["id"];
            const period = normalized["period"];
            const firstName = normalized["first name"] || "";
            const lastName = normalized["last name"] || "";

            if (!studentId || !period) {
              console.warn("Skipping row:", student);
              continue;
            }

            if (!grouped[period]) grouped[period] = [];

            const obj = { studentId, period, firstName, lastName };
            grouped[period].push(obj);

            await addDoc(collection(db, "students"), obj);
          }

          console.log("Grouped data:", grouped);

          // Render results AFTER loop
          console.log("Grouped data:", grouped);

          statusEl.textContent = "Upload complete";
          resultsDiv.style.display = "block";

          renderTabs();
          const firstPeriod = Object.keys(grouped)[0];
          if (firstPeriod) renderTable(firstPeriod);

        } catch (err) {
          console.error(err);
          statusEl.textContent = "Error uploading";
        }
      }
    });
  });
</script>

</body>
</html>
