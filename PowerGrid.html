<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Grid Competition Manager</title>
<style>
body { font-family: Arial; margin:0; padding:15px; background:#0f172a; color:white; }
h1 { text-align:center; }
.section { margin-bottom:20px; padding:15px; background:#1e293b; border-radius:10px; }
button { padding:8px 12px; margin:5px; border:none; border-radius:6px; cursor:pointer; }
.primary { background:#3b82f6; color:white; }
.secondary { background:#475569; color:white; }
.danger { background:#b91c1c; color:white; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { border:1px solid #334155; padding:6px; text-align:center; }
th { background:#1e293b; }
.flex { display:flex; gap:20px; flex-wrap:wrap; }
.teamBox { flex:1; min-width:320px; background:#111827; padding:10px; border-radius:8px; }
h3 { margin-bottom:5px; }
.liveScore { font-size:22px; font-weight:bold; color:#22c55e; }
select { padding:4px; margin-left:5px; }
.labelRow { margin:4px 0; }
</style>
</head>
<body>

<h1>POWER GRID – Competition Manager</h1>

<div class="section">
<h2>1. Enter Team Names (9 Teams)</h2>
<div id="teamInputs"></div>
<button class="primary" onclick="generateSchedule()">Generate Schedule</button>
<button class="danger" onclick="fullReset()">FULL RESET EVENT</button>
<br><br>
<strong>Restore From Backup CSV:</strong>
<input type="file" accept=".csv" onchange="importCSV(event)">
</div>

<div class="section">
<h2>2. Select Match</h2>
<select id="matchSelect"></select>
<div><strong id="matchLabel"></strong></div>
</div>

<div class="section">
<h2>3. Detailed Scoring Sheet (Live Scoring)</h2>
<div class="flex">

<div class="teamBox">
<h3 id="teamAName">Team A</h3>
<div id="a_fields"></div>
<h3 class="liveScore">Total: <span id="scoreA">0</span></h3>
</div>

<div class="teamBox">
<h3 id="teamBName">Team B</h3>
<div id="b_fields"></div>
<h3 class="liveScore">Total: <span id="scoreB">0</span></h3>
</div>

</div>

<button class="primary" onclick="saveMatch()">Save Match Score</button>
<button class="secondary" onclick="resetScoring()">Reset Current Match</button>
<button class="secondary" onclick="exportCSV()">Export Full Backup CSV</button>
</div>

<div class="section">
<h2>4. Results Table</h2>
<table id="resultsTable">
<thead><tr><th>Match</th><th>Team A</th><th>Score</th><th>Team B</th><th>Winner</th></tr></thead>
<tbody></tbody>
</table>
</div>

<script>
let teams=[];
let schedule=[];

const scoringItems = [
 {id:'leave', label:'Leave Tile (10)', type:'bool', pts:10},
 {id:'small_auto', label:'Small Cubes Auto (8)', type:'count', pts:8, max:10},
 {id:'large_auto', label:'Large Cubes Auto (12)', type:'count', pts:12, max:10},
 {id:'plush_auto', label:'Plush Auto (20)', type:'count', pts:20, max:5},
 {id:'ultra_auto', label:'Ultra Auto (35)', type:'bool', pts:35},
 {id:'plush', label:'Plush Driver (15)', type:'count', pts:15, max:5},
 {id:'ultra', label:'Ultra Driver (25)', type:'bool', pts:25},
 {id:'small', label:'Small Cubes Driver (3)', type:'count', pts:3, max:20},
 {id:'large_tower', label:'Large Tower (5)', type:'count', pts:5, max:20},
 {id:'ultra_end', label:'Ultra End (35)', type:'bool', pts:35},
 {id:'park', label:'Park (10)', type:'bool', pts:10},
 {id:'tower_intact', label:'Tower Intact (10)', type:'bool', pts:10}
];

function createFields(prefix){
 const container=document.getElementById(prefix+'_fields');
 container.innerHTML='';
 scoringItems.forEach(item=>{
   const row=document.createElement('div');
   row.className='labelRow';
   if(item.type==='bool'){
     row.innerHTML=`${item.label} <input type='checkbox' id='${prefix}_${item.id}'>`;
   } else {
     let select=`<select id='${prefix}_${item.id}'>`;
     for(let i=0;i<=item.max;i++){
       select+=`<option value='${i}'>${i}</option>`;
     }
     select+='</select>';
     row.innerHTML=`${item.label} ${select}`;
   }
   container.appendChild(row);
 });
}

window.onload=function(){
 createFields('a');
 createFields('b');
 addLiveListeners();
 const saved=localStorage.getItem('powerGridData');
 if(saved){
   const data=JSON.parse(saved);
   teams=data.teams||[];
   schedule=data.schedule||[];
 }
 renderTeamInputs();
 populateMatchSelect();
 renderTable();
};

function calculateScore(prefix){
 let total=0;
 scoringItems.forEach(item=>{
   const el=document.getElementById(prefix+'_'+item.id);
   if(item.type==='bool'){
     if(el.checked) total+=item.pts;
   } else {
     total+=Number(el.value)*item.pts;
   }
 });
 return total;
}

function updateLiveScore(){
 document.getElementById('scoreA').innerText=calculateScore('a');
 document.getElementById('scoreB').innerText=calculateScore('b');
}

function addLiveListeners(){
 document.addEventListener('change',updateLiveScore);
}

function renderTeamInputs(){
 const container=document.getElementById('teamInputs');
 container.innerHTML='';
 for(let i=0;i<9;i++){
   const value=teams[i]||'';
   container.innerHTML+=`Team ${i+1}: <input id='team${i}' value="${value}"><br>`;
 }
}

function generateSchedule(){
 teams=[];
 for(let i=0;i<9;i++){
   teams.push(document.getElementById('team'+i).value||`Team ${i+1}`);
 }
 schedule=[];
 let temp=[...teams];
 if(temp.length%2!==0) temp.push("BYE");
 let n=temp.length;
 for(let r=0;r<n-1;r++){
   for(let i=0;i<n/2;i++){
     let A=temp[i]; let B=temp[n-1-i];
     if(A!="BYE"&&B!="BYE"){
       schedule.push({match:schedule.length+1,teamA:A,teamB:B,scoreA:0,scoreB:0,winner:''});
     }
   }
   temp.splice(1,0,temp.pop());
 }
 saveToStorage();
 populateMatchSelect();
 renderTable();
}

function populateMatchSelect(){
 let sel=document.getElementById('matchSelect');
 sel.innerHTML='';
 schedule.forEach(m=>{
   let opt=document.createElement('option');
   opt.value=m.match;
   opt.text=`Match ${m.match}: ${m.teamA} vs ${m.teamB}`;
   sel.appendChild(opt);
 });
 sel.onchange=loadMatch;
 loadMatch();
}

function loadMatch(){
 let m=schedule.find(x=>x.match==document.getElementById('matchSelect').value);
 if(!m) return;
 document.getElementById('matchLabel').innerText=`${m.teamA} vs ${m.teamB}`;
 document.getElementById('teamAName').innerText=m.teamA;
 document.getElementById('teamBName').innerText=m.teamB;
 updateLiveScore();
}

function saveMatch(){
 let m=schedule.find(x=>x.match==document.getElementById('matchSelect').value);
 if(!m) return;
 m.scoreA=calculateScore('a');
 m.scoreB=calculateScore('b');
 m.winner=m.scoreA>m.scoreB?m.teamA:m.scoreB>m.scoreA?m.teamB:'Tie';
 saveToStorage();
 renderTable();
}

function renderTable(){
 let tb=document.querySelector('#resultsTable tbody');
 tb.innerHTML='';
 schedule.forEach(m=>{
   tb.innerHTML+=`<tr><td>${m.match}</td><td>${m.teamA}</td><td>${m.scoreA} - ${m.scoreB}</td><td>${m.teamB}</td><td>${m.winner}</td></tr>`;
 });
}

function resetScoring(){
 scoringItems.forEach(item=>{
   document.getElementById('a_'+item.id).value=0;
   document.getElementById('b_'+item.id).value=0;
   if(item.type==='bool'){
     document.getElementById('a_'+item.id).checked=false;
     document.getElementById('b_'+item.id).checked=false;
   }
 });
 updateLiveScore();
}

function exportCSV(){
 let csv='Match,Team A,Score A,Team B,Score B,Winner\n';
 schedule.forEach(m=>{
   csv+=`${m.match},${m.teamA},${m.scoreA},${m.teamB},${m.scoreB},${m.winner}\n`;
 });
 let blob=new Blob([csv],{type:'text/csv'});
 let url=URL.createObjectURL(blob);
 let a=document.createElement('a');
 a.href=url;
 a.download='power_grid_backup.csv';
 a.click();
}

function importCSV(event){
 const file=event.target.files[0];
 if(!file) return;
 const reader=new FileReader();
 reader.onload=function(e){
   const lines=e.target.result.split('\n').slice(1);
   schedule=[];
   lines.forEach(line=>{
     if(!line.trim()) return;
     const [match,teamA,scoreA,teamB,scoreB,winner]=line.split(',');
     schedule.push({match:Number(match),teamA,scoreA:Number(scoreA),teamB,scoreB:Number(scoreB),winner});
   });
   teams=[...new Set(schedule.flatMap(m=>[m.teamA,m.teamB]))];
   saveToStorage();
   renderTeamInputs();
   populateMatchSelect();
   renderTable();
 };
 reader.readAsText(file);
}

function saveToStorage(){
 localStorage.setItem('powerGridData',JSON.stringify({teams,schedule}));
}

function fullReset(){
 if(confirm('Erase entire event?')){
   localStorage.removeItem('powerGridData');
   location.reload();
 }
}
</script>

</body>
</html>
