<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>General Safety Drag-and-Drop Quiz</title>
<style>
  :root{ --border:#9aa4b2; --focus:#2563eb; --light:#eef4ff; --ok:#15803d; --bad:#b91c1c; }
  body { font-family: Arial, sans-serif; margin: 20px; background: #f7f7f8; color: #111827; }
  .container { max-width: 980px; margin: auto; background: white; padding: 24px; border-radius: 14px; box-shadow: 0 3px 16px rgba(0,0,0,.08); }
  h1 { margin-top: 0; }
  .student-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  label { font-weight: bold; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
  .instructions { background: #f1f5f9; border-left: 5px solid #64748b; padding: 12px 14px; border-radius: 8px; margin: 12px 0 18px; }
  .word-bank-title { font-weight: bold; margin: 18px 0 8px; }
  .word-bank { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; min-height: 70px; background: #f8fafc; border: 2px solid #d1d5db; border-radius: 12px; margin-bottom: 22px; position: sticky; top: 0; z-index: 2; }
  .word { padding: 10px 14px; background: #e5e7eb; border: 1px solid #9ca3af; border-radius: 999px; cursor: grab; user-select: none; font-size: 16px; box-shadow: 0 2px 4px rgba(0,0,0,.08); }
  .word:active { cursor: grabbing; }
  .question { line-height: 2.35; font-size: 18px; margin-bottom: 18px; padding: 14px; border: 1px solid #e5e7eb; border-radius: 12px; background: #ffffff; }
  .blank { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; min-width: 170px; min-height: 46px; margin: 0 6px; padding: 4px 10px; border: 3px dashed var(--border); border-radius: 10px; background: #f9fafb; color: #374151; font-weight: bold; box-sizing: border-box; transition: all .15s ease; }
  .blank:empty::before { content: "Drop here"; color: #6b7280; font-size: 14px; font-weight: normal; }
  .blank.drag-over { background: var(--light); border-color: var(--focus); transform: scale(1.04); box-shadow: 0 0 0 4px rgba(37,99,235,.16); }
  .blank.filled { border-style: solid; border-color: #64748b; background: #f8fafc; }
  .blank.correct { border-color: var(--ok); background: #ecfdf5; color: var(--ok); }
  .blank.incorrect { border-color: var(--bad); background: #fef2f2; color: var(--bad); }
  .buttons { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
  button { padding: 12px 18px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
  #gradeBtn { background: #2563eb; color: white; }
  #retryBtn { background: #e5e7eb; color: #111827; }
  #result { font-size: 20px; font-weight: bold; margin-top: 18px; }
  .feedback-list { margin-top: 8px; padding-left: 0; list-style: none; }
  .feedback-list li { padding: 6px 0; }
  @media (max-width: 700px) { .student-info { grid-template-columns: 1fr; } .blank { min-width: 145px; } }
</style>
</head>
<body>
<div class="container">
  <h1>General Safety Quiz</h1>
  <div class="student-info">
    <label>Name<input type="text" id="studentName" autocomplete="name" required></label>
    <label>Email<input type="email" id="studentEmail" autocomplete="email" required></label>
  </div>
  <div class="instructions">
    Drag each word or phrase from the word bank into a <strong>Drop here</strong> box. You can replace an answer by dragging another word onto the same box.
  </div>
  <div id="quiz"></div>
  <div class="buttons">
    <button id="gradeBtn" onclick="grade()">Grade Test</button>
    <button id="retryBtn" onclick="buildQuiz()">Retry / Shuffle Again</button>
  </div>
  <div id="result"></div>
  <ul id="feedback" class="feedback-list"></ul>
</div>

<script>
const questions = [
  {q: "It is vital to your general safety that you ____ and ____ all safety rules.", a:["learn","obey"]},
  {q: "Remember, a machine can be very unforgiving of ____ on the part of the operator.", a:["error"]},
  {q: "Only work approved by the ____ is to be done in the lab.", a:["teacher"]},
  {q: "All injuries, no matter how small, must be reported to the ____ immediately.", a:["teacher"]},
  {q: "Loose fitting ____ is a hazard.", a:["clothing"]},
  {q: "Roll up ____ above the elbow.", a:["sleeves"]},
  {q: "Remove all ____ before working in the shop.", a:["jewelry"]},
  {q: "Caution anyone you observe ____ a safety rule.", a:["breaking"]},
  {q: "The floor, aisles, and passageways should be kept ____ of parts, tools, and materials.", a:["clear"]},
  {q: "Prevent tools and materials from ____ over the edges of tables and benches.", a:["hanging"]},
  {q: "____ leave vise jaws tightened together when not in use.", a:["Never"]},
  {q: "Vise handles are to be left in a ____ position.", a:["vertical"]},
  {q: "Tools, equipment, materials, and projects are to be stored in ____ locations.", a:["designated"]},
  {q: "Clean up all spills ____.", a:["immediately"]},
  {q: "Exercise ____ in handling large and long pieces. Obtain help when needed, ____ attempt to lift large or heavy objects on your own.", a:["caution","never"]},
  {q: "When using ____ air, direct the ____ away from yourself and other people.", a:["compressed","nozzle"]},
  {q: "Long loose locks of ____ can easily be caught in revolving machinery.", a:["hair"]},
  {q: "Testing the sharpness of a tool should be done on scrap material and NOT your ____.", a:["skin"]},
  {q: "Keep your ____ parts clear of the blade.", a:["body"]},
  {q: "Keep ____ tight and in good condition on all tools.", a:["handles"]},
  {q: "Use ____ only for their intended purpose. DO NOT PLAY!", a:["tools"]},
  {q: "Do not ____ anything in class.", a:["throw"]},
  {q: "____ must be worn while in the lab.", a:["Safety glasses"]},
  {q: "Arrange ____ so that they are not a tripping hazard.", a:["power cords"]},
  {q: "Be aware of your ____ at all times when in the lab.", a:["surroundings"]},
  {q: "While operating the drill press, material must be clamped securely or in a ____.", a:["vise"]},
  {q: "____ immediately when finished working.", a:["Clean up"]}
];

let currentQuestions = [];

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildQuiz() {
  document.getElementById("result").innerHTML = "";
  document.getElementById("feedback").innerHTML = "";
  const quizDiv = document.getElementById("quiz");
  quizDiv.innerHTML = "";

  currentQuestions = shuffle(questions);
  const wordBank = [];
  currentQuestions.forEach(item => item.a.forEach(ans => wordBank.push(ans)));

  const title = document.createElement("div");
  title.className = "word-bank-title";
  title.textContent = "Word Bank";

  const bankDiv = document.createElement("div");
  bankDiv.className = "word-bank";
  bankDiv.id = "wordBank";

  shuffle(wordBank).forEach((word, index) => {
    const span = document.createElement("span");
    span.className = "word";
    span.draggable = true;
    span.textContent = word;
    span.id = "word-" + index + "-" + Math.random().toString(16).slice(2);
    span.addEventListener("dragstart", drag);
    bankDiv.appendChild(span);
  });

  quizDiv.appendChild(title);
  quizDiv.appendChild(bankDiv);

  currentQuestions.forEach((item, qIndex) => {
    const div = document.createElement("div");
    div.className = "question";
    const parts = item.q.split("____");

    parts.forEach((part, blankIndex) => {
      div.appendChild(document.createTextNode(part));
      if (blankIndex < parts.length - 1) {
        const blank = document.createElement("span");
        blank.className = "blank";
        blank.dataset.answer = item.a[blankIndex].toLowerCase();
        blank.dataset.questionIndex = qIndex;
        blank.dataset.blankIndex = blankIndex;
        blank.addEventListener("dragover", allowDrop);
        blank.addEventListener("dragenter", dragEnter);
        blank.addEventListener("dragleave", dragLeave);
        blank.addEventListener("drop", drop);
        div.appendChild(blank);
      }
    });

    quizDiv.appendChild(div);
  });
}

function allowDrop(event) { event.preventDefault(); }
function dragEnter(event) {
  const target = event.target.closest(".blank");
  if (target) target.classList.add("drag-over");
}
function dragLeave(event) {
  const target = event.target.closest(".blank");
  if (target) target.classList.remove("drag-over");
}
function drag(event) { event.dataTransfer.setData("text/plain", event.target.textContent); }
function drop(event) {
  event.preventDefault();
  const target = event.target.closest(".blank");
  if (!target) return;
  const text = event.dataTransfer.getData("text/plain");
  target.textContent = text;
  target.classList.add("filled");
  target.classList.remove("drag-over", "correct", "incorrect");
}

function grade() {
  const name = document.getElementById("studentName").value.trim();
  const email = document.getElementById("studentEmail").value.trim();
  if (!name || !email) {
    alert("Please enter your name and email before grading.");
    return;
  }

  const blanks = document.querySelectorAll(".blank");
  let correct = 0;
  const feedback = document.getElementById("feedback");
  feedback.innerHTML = "";

  document.querySelectorAll(".question").forEach((questionDiv) => {
    const questionBlanks = questionDiv.querySelectorAll(".blank");
    let questionCorrect = true;
    questionBlanks.forEach(blank => {
      const studentAnswer = blank.textContent.trim().toLowerCase();
      const correctAnswer = blank.dataset.answer.trim().toLowerCase();
      if (studentAnswer === correctAnswer) {
        blank.classList.add("correct");
        blank.classList.remove("incorrect");
        correct++;
      } else {
        blank.classList.add("incorrect");
        blank.classList.remove("correct");
        questionCorrect = false;
      }
    });
    const item = document.createElement("li");
    item.textContent = questionCorrect ? "Correct" : "Incorrect";
    item.style.color = questionCorrect ? "var(--ok)" : "var(--bad)";
    feedback.appendChild(item);
  });

  const score = Math.round((correct / blanks.length) * 100);
  document.getElementById("result").innerHTML = score === 100
    ? "Score: 100% — Passed!"
    : "Score: " + score + "% — Retry until you reach 100%.";
}

buildQuiz();
</script>
</body>
</html>
