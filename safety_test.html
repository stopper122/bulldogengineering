
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Safety Quiz</title>
<style>
body { font-family: Arial; margin: 20px; }
.container { max-width: 900px; margin: auto; }
.word-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.word { padding: 6px 10px; background: #ddd; border-radius: 4px; cursor: grab; }
.blank { display: inline-block; min-width: 120px; border-bottom: 2px solid #000; margin: 0 5px; }
.correct { color: green; }
.incorrect { color: red; }
.question { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
<h2>General Safety Quiz</h2>

<label>Name: <input type="text" id="name"></label><br><br>
<label>Email: <input type="email" id="email"></label><br><br>

<div id="quiz"></div>

<button onclick="grade()">Grade Test</button>
<button onclick="buildQuiz()">Retry</button>

<p id="result"></p>
</div>

<script>
const questions = [
{q: "It is vital to your general safety that you ____ and ____ all safety rules.", a:["learn","obey"]},
{q: "Remember, a machine can be very unforgiving of ____ on the part of the operator.", a:["error"]},
{q: "Only work approved by the ____ is to be done in the lab.", a:["teacher"]},
{q: "All injuries must be reported to the ____ immediately.", a:["teacher"]},
{q: "Loose fitting ____ is a hazard.", a:["clothing"]},
{q: "Roll up ____ above the elbow.", a:["sleeves"]},
{q: "Remove all ____ before working in the shop.", a:["jewelry"]},
{q: "Caution anyone you observe ____ a safety rule.", a:["breaking"]},
{q: "Keep areas ____ of parts and tools.", a:["clear"]},
{q: "Prevent tools from ____ over edges.", a:["hanging"]},
{q: "____ leave vise jaws tightened.", a:["Never"]},
{q: "Vise handles left in a ____ position.", a:["vertical"]},
{q: "Store items in ____ locations.", a:["designated"]},
{q: "Clean spills ____.", a:["immediately"]},
{q: "Exercise ____ and ____ attempt heavy lifts.", a:["caution","never"]},
{q: "When using ____ air, direct the ____ away.", a:["compressed","nozzle"]},
{q: "Loose ____ can get caught.", a:["hair"]},
{q: "Test sharpness on scrap, not your ____.", a:["skin"]},
{q: "Keep your ____ parts clear.", a:["body"]},
{q: "Keep ____ tight.", a:["handles"]},
{q: "Use ____ only for intended purpose.", a:["tools"]},
{q: "Do not ____ anything in class.", a:["throw"]},
{q: "____ ____ must be worn.", a:["Safety glasses"]},
{q: "Arrange ____ ____ safely.", a:["power cords"]},
{q: "Be aware of your ____.", a:["surroundings"]},
{q: "Clamp material in a ____.", a:["vise"]},
{q: "____ ____ when finished.", a:["Clean up"]}
];

let currentQuestions = [];

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

function buildQuiz(){
  document.getElementById("result").innerText="";
  let quizDiv=document.getElementById("quiz");
  quizDiv.innerHTML="";

  currentQuestions = shuffle([...questions]);

  let wordBank=[];
  currentQuestions.forEach(q=> q.a.forEach(a=>wordBank.push(a)));

  let bankDiv=document.createElement("div");
  bankDiv.className="word-bank";

  shuffle(wordBank).forEach(w=>{
    let span=document.createElement("span");
    span.className="word";
    span.draggable=true;
    span.innerText=w;
    span.ondragstart=drag;
    bankDiv.appendChild(span);
  });

  quizDiv.appendChild(bankDiv);

  currentQuestions.forEach((q,i)=>{
    let div=document.createElement("div");
    div.className="question";

    let parts=q.q.split("____");
    let html="";
    parts.forEach((p,idx)=>{
      html+=p;
      if(idx < parts.length-1){
        html+= '<span class="blank" data-answer="'+q.a[idx]+'" ondrop="drop(event)" ondragover="allowDrop(event)"></span>';
      }
    });

    div.innerHTML=html;
    quizDiv.appendChild(div);
  });
}

function allowDrop(ev){ev.preventDefault();}
function drag(ev){ev.dataTransfer.setData("text", ev.target.innerText);}
function drop(ev){
  ev.preventDefault();
  ev.target.innerText=ev.dataTransfer.getData("text");
}

function grade(){
  let blanks=document.querySelectorAll(".blank");
  let correct=0;

  blanks.forEach(b=>{
    if(b.innerText.trim().toLowerCase() === b.dataset.answer.toLowerCase()){
      b.classList.add("correct");
      b.classList.remove("incorrect");
      correct++;
    } else {
      b.classList.add("incorrect");
      b.classList.remove("correct");
    }
  });

  let score=Math.round((correct/blanks.length)*100);
  document.getElementById("result").innerText="Score: "+score+"%";
}

buildQuiz();
</script>
</body>
</html>
