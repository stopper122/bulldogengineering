<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>General Safety Drag-and-Drop Quiz</title>
<style>
:root{ --border:#9aa4b2; --focus:#2563eb; --light:#eef4ff; --ok:#15803d; --bad:#b91c1c; }
body { font-family: Arial; margin:20px; background:#f7f7f8;}
.container{max-width:980px;margin:auto;background:white;padding:24px;border-radius:14px;}
.word-bank{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border:2px solid #ccc;border-radius:12px;margin-bottom:20px;position:sticky;top:0;background:#fff;}
.word{padding:8px 12px;background:#e5e7eb;border-radius:20px;cursor:grab;}
.blank{display:inline-flex;min-width:150px;min-height:40px;border:2px dashed #999;margin:0 5px;align-items:center;justify-content:center;}
.blank:empty::before{content:"Drop here";color:#777;font-size:12px;}
.correct{background:#d1fae5;}
.incorrect{background:#fee2e2;}
</style>
</head>
<body>
<div class="container">
<h2>General Safety Quiz</h2>

Name: <input id="name"><br><br>
Email: <input id="email"><br><br>

<div id="quiz"></div>

<button onclick="grade()">Grade Test</button>
<button onclick="buildQuiz()">Retry</button>

<p id="result"></p>

<script>
const questions = [
{q:"It is vital to your general safety that you ____ and ____ all safety rules.",a:["learn","obey"]},
{q:"Remember, a machine can be very unforgiving of ____.",a:["error"]},
{q:"Only work approved by the ____ is to be done.",a:["teacher"]},
{q:"All injuries must be reported to the ____.",a:["teacher"]}
];

let locked=false;

function shuffle(arr){return arr.sort(()=>Math.random()-0.5);}

function buildQuiz(){
locked=false;
let quiz=document.getElementById("quiz");
quiz.innerHTML="";
let qlist=shuffle([...questions]);

let bank=[];
qlist.forEach(q=>q.a.forEach(a=>bank.push(a)));

// ALPHABETICAL WORD BANK
bank.sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));

let bankDiv=document.createElement("div");
bankDiv.className="word-bank";

bank.forEach(w=>{
let span=document.createElement("span");
span.className="word";
span.draggable=true;
span.innerText=w;
span.ondragstart=e=>e.dataTransfer.setData("text",w);
bankDiv.appendChild(span);
});

quiz.appendChild(bankDiv);

qlist.forEach(q=>{
let div=document.createElement("div");
let parts=q.q.split("____");

parts.forEach((p,i)=>{
div.appendChild(document.createTextNode(p));
if(i<parts.length-1){
let b=document.createElement("span");
b.className="blank";
b.dataset.answer=q.a[i];
b.ondragover=e=>{if(!locked)e.preventDefault();}
b.ondrop=e=>{
if(locked)return;
e.preventDefault();
b.innerText=e.dataTransfer.getData("text");
};
div.appendChild(b);
}
});
quiz.appendChild(div);
});
}

function grade(){
locked=true;
let blanks=document.querySelectorAll(".blank");
let correct=0;

blanks.forEach(b=>{
if(b.innerText.toLowerCase()===b.dataset.answer.toLowerCase()){
b.classList.add("correct");
correct++;
}else{
b.classList.add("incorrect");
}
});

let score=Math.round(correct/blanks.length*100);
document.getElementById("result").innerText="Score: "+score+"%";
}

buildQuiz();
</script>
</div>
</body>
</html>
