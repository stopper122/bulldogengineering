
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Safety Quiz</title>
<style>
body { font-family: Arial; margin: 20px; }
.container { max-width: 900px; margin: auto; }
.word-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.word { padding: 6px 10px; background: #ddd; border-radius: 4px; cursor: grab; }
.blank { display: inline-block; min-width: 120px; border-bottom: 2px solid #000; margin: 0 5px; }
.correct { color: green; }
.incorrect { color: red; }
</style>
</head>
<body>
<div class="container">
<h2>General Safety Quiz</h2>

<label>Name: <input type="text" id="name"></label><br><br>
<label>Email: <input type="email" id="email"></label><br><br>

<div id="quiz"></div>

<button onclick="grade()">Grade Test</button>
<button onclick="buildQuiz()">Retry</button>

<p id="result"></p>

</div>

<script>
const questions = [
["learn","obey"],
["error"],
["teacher"],
["teacher"],
["clothing"],
["sleeves"],
["jewelry"],
["breaking"],
["clear"],
["hanging"],
["Never"],
["vertical"],
["designated"],
["immediately"],
["caution","never"],
["compressed","nozzle"],
["hair"],
["skin"],
["body"],
["handles"],
["tools"],
["throw"],
["Safety glasses"],
["power cords"],
["surroundings"],
["vise"],
["Clean up"]
];

let wordBank = [];

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

function buildQuiz(){
  document.getElementById("result").innerText = "";
  wordBank = [];
  let quizDiv = document.getElementById("quiz");
  quizDiv.innerHTML = "";

  let qCopy = JSON.parse(JSON.stringify(questions));
  shuffle(qCopy);

  qCopy.forEach((q,i)=>{
    let div = document.createElement("div");
    div.innerHTML = q.map(()=>'<span class="blank" ondrop="drop(event)" ondragover="allowDrop(event)"></span>').join(" ");
    quizDiv.appendChild(div);
    q.forEach(w=>wordBank.push(w));
  });

  let bankDiv = document.createElement("div");
  bankDiv.className="word-bank";

  shuffle(wordBank).forEach(w=>{
    let span = document.createElement("span");
    span.className="word";
    span.draggable=true;
    span.innerText=w;
    span.ondragstart=drag;
    bankDiv.appendChild(span);
  });

  quizDiv.prepend(bankDiv);
}

function allowDrop(ev){ ev.preventDefault(); }
function drag(ev){ ev.dataTransfer.setData("text", ev.target.innerText); }

function drop(ev){
  ev.preventDefault();
  let data = ev.dataTransfer.getData("text");
  ev.target.innerText = data;
}

function grade(){
  let blanks = document.querySelectorAll(".blank");
  let allAnswers = questions.flat();
  let correct = 0;

  blanks.forEach((b,i)=>{
    if(allAnswers.includes(b.innerText)){
      b.classList.add("correct");
      correct++;
    } else {
      b.classList.add("incorrect");
    }
  });

  let score = Math.round((correct/blanks.length)*100);
  document.getElementById("result").innerText = "Score: " + score + "%";
}

buildQuiz();
</script>

</body>
</html>
