<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stacker's Summit Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        .text-game-yellow { color: #facc15; }
        .text-game-rocker { color: #22c55e; }
        .text-game-tennis { color: #bef264; }
        .text-game-botguy { color: #ef4444; }
        .text-game-scrap { color: #64748b; }

        .bullseye-icon {
            display: inline-block; width: 14px; height: 14px; border-radius: 50%;
            background: radial-gradient(circle, #facc15 20%, #ef4444 21%, #ef4444 50%, #3b82f6 51%, #3b82f6 100%);
        }
        
        .active-btn { transform: scale(0.95); transition: transform 0.1s; }
        .timer-warning { color: #ef4444; animation: pulse 0.5s infinite; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- Header -->
    <header class="bg-slate-900 px-4 py-3 shadow-xl flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                <i data-lucide="mountain" class="w-5 h-5"></i>
            </div>
            <div class="hidden sm:block">
                <h1 class="text-white font-black italic text-lg leading-none uppercase tracking-tighter">Stacker's Summit</h1>
                <span class="text-blue-400 text-[8px] font-bold tracking-[0.3em] uppercase opacity-70">Voice Countdown Enabled</span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button onclick="toggleMute()" id="mute-btn" class="p-2 bg-slate-800 text-slate-400 rounded-lg hover:text-white transition-colors">
                <i data-lucide="volume-2" class="w-4 h-4"></i>
            </button>

            <div class="flex flex-col items-center">
                <span class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Match</span>
                <input type="number" id="match-number" value="1" class="w-12 bg-slate-800 border border-slate-700 text-white font-black py-0.5 rounded text-center outline-none focus:border-blue-500">
            </div>
            <div id="phase-badge" class="px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse">
                AUTO
            </div>
            <div id="timer-display" class="text-white text-3xl font-mono font-black tabular-nums tracking-tighter w-20 text-center">
                2:00
            </div>
            <div class="flex gap-1.5">
                <button onclick="toggleTimer()" id="timer-btn" class="p-2.5 bg-green-500 text-white rounded-full shadow-lg active:scale-90 transition-all">
                    <i data-lucide="play" class="w-5 h-5"></i>
                </button>
                <button onclick="resetMatch()" class="p-2.5 bg-slate-700 text-white rounded-full hover:bg-slate-600 active:rotate-180 transition-all">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row p-2 gap-2 overflow-hidden">
        <div class="flex-1 flex flex-col rounded-2xl border-2 border-red-200 bg-red-50 overflow-hidden shadow-sm">
            <div class="bg-red-600 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-sm font-black uppercase italic tracking-wider">Red</h2>
                <div id="red-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-4 custom-scrollbar" id="red-controls"></div>
        </div>

        <div class="flex-1 flex flex-col rounded-2xl border-2 border-blue-200 bg-blue-50 overflow-hidden shadow-sm">
            <div class="bg-blue-700 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-sm font-black uppercase italic tracking-wider">Blue</h2>
                <div id="blue-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-4 custom-scrollbar" id="blue-controls"></div>
        </div>

        <div class="w-full md:w-72 flex flex-col rounded-2xl border-2 border-slate-200 bg-white overflow-hidden shadow-sm">
            <div class="bg-slate-800 p-3 text-white flex justify-between items-center">
                <h2 class="text-[10px] font-black uppercase tracking-widest flex items-center gap-2">
                    <i data-lucide="list" class="w-3 h-3"></i> Match Log
                </h2>
                <button onclick="exportFullJSON()" class="p-1.5 bg-blue-600 hover:bg-blue-500 rounded text-[10px] font-bold uppercase flex items-center gap-1">
                    <i data-lucide="download" class="w-3 h-3"></i> Export
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-2 custom-scrollbar space-y-2 bg-slate-50" id="match-log"></div>
            <div class="p-2 border-t border-slate-100 bg-white">
                <button id="save-btn" onclick="saveMatch()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black uppercase tracking-widest text-[10px] shadow-lg active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Commit Result
                </button>
            </div>
        </div>
    </main>

    <div id="overlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl text-center max-w-sm w-full">
            <h3 class="text-3xl font-black text-slate-900 mb-2 italic uppercase tracking-tighter">New Match</h3>
            <p class="text-slate-400 text-[10px] font-bold mb-8 uppercase tracking-[0.2em]">Ready for 30s Autonomous</p>
            <button onclick="toggleTimer()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl uppercase tracking-widest text-sm hover:bg-blue-500 transition-colors">
                Start Scoring
            </button>
        </div>
    </div>

    <script>
        // API CONFIG
        const apiKey = "";
        let isMuted = false;

        // --- AUDIO HELPERS ---
        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) {
                view.setInt16(44 + i * 2, pcmData[i], true);
            }
            return buffer;
        }

        async function speak(text) {
            if (isMuted) return;
            let retries = 0;
            const delay = (ms) => new Promise(res => setTimeout(res, ms));

            while (retries < 5) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                            }
                        })
                    });
                    const result = await response.json();
                    const audioData = result.candidates[0].content.parts[0].inlineData;
                    const pcmBuffer = new Int16Array(Uint8Array.from(atob(audioData.data), c => c.charCodeAt(0)).buffer);
                    const wavBuffer = pcmToWav(pcmBuffer, 24000);
                    const blob = new Blob([wavBuffer], { type: 'audio/wav' });
                    const audio = new Audio(URL.createObjectURL(blob));
                    audio.play();
                    return;
                } catch (e) {
                    retries++;
                    await delay(Math.pow(2, retries) * 1000);
                }
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mute-btn').innerHTML = isMuted ? `<i data-lucide="volume-x"></i>` : `<i data-lucide="volume-2"></i>`;
            lucide.createIcons();
        }

        // --- APP LOGIC ---
        let timeLeft = 120;
        let isRunning = false;
        let phase = 'AUTO';
        let timerInterval;
        let matchLog = [];
        let autoOverride = false;

        const initialState = () => ({
            yellowBase: 0, ringBase: 0, botguyUpBase: 0, botguyTipBase: 0, ballBase: 0, rockerBase: 0,
            scout: 0, autoStacks: [],
            yellowZone: 0, ringZone: 0, botguyUpZone: 0, botguyTipZone: 0, ballZone: 0,
            scrapZone: 0, scrapBase: 0, hazard: 0,
            pickle: false, ultimate: false, autoWinner: false,
            autoLockedScore: 0
        });

        let red = initialState();
        let blue = initialState();

        function calculateAuto(alliance) {
            let baseScore = (alliance.yellowBase + alliance.ringBase) * 10;
            baseScore += (alliance.ballBase + alliance.rockerBase) * 20;
            baseScore += (alliance.botguyUpBase * 30) + (alliance.botguyTipBase * 15);
            let stackBonus = 0;
            if (alliance.autoStacks.length > 0) {
                const itemCount = alliance.yellowBase + alliance.ringBase + alliance.ballBase + alliance.rockerBase + alliance.botguyUpBase + alliance.botguyTipBase;
                const avgVal = itemCount > 0 ? baseScore / itemCount : 0;
                alliance.autoStacks.forEach(h => {
                    let mult = h === 2 ? 3 : h === 3 ? 4 : 5;
                    stackBonus += (avgVal * h * mult * 2) - (avgVal * h); 
                });
            }
            return Math.max(0, Math.round((baseScore * 2) + stackBonus + ((alliance.ballBase + alliance.rockerBase) * 50) + (alliance.scout === 1 ? 10 : alliance.scout === 2 ? 25 : 0)));
        }

        function calculate(alliance) {
            if (phase === 'AUTO') return calculateAuto(alliance);
            let total = alliance.autoLockedScore;
            total += (alliance.yellowZone + alliance.ringZone) * 2;
            total += (alliance.botguyUpZone * 10) + (alliance.botguyTipZone * 5) + (alliance.ballZone * 5);
            if (alliance.ultimate) total += 100;
            if (alliance.autoWinner) total += 50;
            if (alliance.pickle) total += 100;
            if (!alliance.pickle) {
                total -= (alliance.scrapZone * 2) + (alliance.scrapBase * 10);
            }
            total -= (alliance.hazard * 15);
            return Math.max(0, Math.round(total));
        }

        function renderControls(alliance, side) {
            const container = document.getElementById(`${side}-controls`);
            const isAutoActive = phase === 'AUTO' || autoOverride;
            container.innerHTML = `
                <div class="space-y-3 p-3 bg-white rounded-xl border-2 ${autoOverride ? 'border-blue-400 ring-2 ring-blue-100' : 'border-slate-100'}">
                    <div class="flex justify-between items-center">
                        <span class="text-[9px] font-black text-slate-400 uppercase">Autonomous</span>
                        ${phase === 'TELEOP' ? `<button onclick="toggleAutoOverride()" class="px-2 py-0.5 rounded bg-blue-600 text-white text-[7px] font-bold">${autoOverride ? 'LOCK' : 'EDIT'}</button>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-1.5 ${!isAutoActive ? 'opacity-50 pointer-events-none' : ''}">
                        ${renderCounter('Cubes', 'box', alliance.yellowBase, side, 'yellowBase', 'text-game-yellow')}
                        ${renderCounter('Rings', 'bullseye', alliance.ringBase, side, 'ringBase')}
                        ${renderCounter('Rocker', 'layers', alliance.rockerBase, side, 'rockerBase', 'text-game-rocker')}
                        ${renderCounter('Summit', 'circle', alliance.ballBase, side, 'ballBase', 'text-game-tennis')}
                        ${renderCounter('Bot', 'bot', alliance.botguyUpBase, side, 'botguyUpBase', 'text-game-botguy')}
                    </div>
                    <div class="p-2 bg-slate-50 rounded-lg border border-dashed border-slate-200 ${!isAutoActive ? 'opacity-50 pointer-events-none' : ''}">
                        <div class="flex flex-wrap gap-1">
                            <button onclick="addStack('${side}', 2)" class="px-2 py-0.5 bg-slate-800 text-white text-[8px] rounded">+2 Stack</button>
                            ${alliance.autoStacks.map((s, i) => `<div class="bg-white px-1 py-0.5 rounded text-[8px] border flex items-center gap-1">${s}T <i data-lucide="x" class="w-2.5 h-2.5 text-red-500" onclick="removeStack('${side}', ${i})"></i></div>`).join('')}
                        </div>
                    </div>
                </div>
                <div class="space-y-3 p-3 bg-white rounded-xl border border-slate-100 ${phase === 'AUTO' && !autoOverride ? 'opacity-30 pointer-events-none' : ''}">
                    <span class="text-[9px] font-black text-slate-400 uppercase">Teleop</span>
                    <div class="grid grid-cols-2 gap-1.5">
                        ${renderCounter('Cubes (Z)', 'square', alliance.yellowZone, side, 'yellowZone', 'text-game-yellow')}
                        ${renderCounter('Rings (Z)', 'bullseye', alliance.ringZone, side, 'ringZone')}
                        ${renderCounter('Bot (Z)', 'smile', alliance.botguyUpZone, side, 'botguyUpZone', 'text-game-botguy')}
                    </div>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="toggleBool('${side}', 'autoWinner')" class="p-2 rounded border text-[8px] font-black uppercase ${alliance.autoWinner ? 'bg-amber-500 text-white' : 'bg-white text-slate-400'}">Win</button>
                        <button onclick="toggleBool('${side}', 'ultimate')" class="p-2 rounded border text-[8px] font-black uppercase ${alliance.ultimate ? 'bg-indigo-600 text-white' : 'bg-white text-slate-400'}">Ult</button>
                        <button onclick="toggleBool('${side}', 'pickle')" class="p-2 rounded border text-[8px] font-black uppercase ${alliance.pickle ? 'bg-green-500 text-white' : 'bg-white text-slate-400'}">Pickle</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderCounter(label, icon, val, side, key, colorClass = 'text-slate-400') {
            return `
                <div class="flex items-center justify-between p-1.5 bg-white rounded border border-slate-100 shadow-sm">
                    <span class="text-[8px] font-bold text-slate-500 uppercase truncate">${label}</span>
                    <div class="flex items-center gap-1">
                        <button onclick="changeVal('${side}', '${key}', -1)" class="p-0.5 text-slate-300"><i data-lucide="minus" class="w-2.5 h-2.5"></i></button>
                        <span class="text-[10px] font-black w-3 text-center">${val}</span>
                        <button onclick="changeVal('${side}', '${key}', 1)" class="p-0.5 text-slate-900"><i data-lucide="plus" class="w-2.5 h-2.5"></i></button>
                    </div>
                </div>
            `;
        }

        function update() {
            if (autoOverride) {
                red.autoLockedScore = calculateAuto(red);
                blue.autoLockedScore = calculateAuto(blue);
            }
            document.getElementById('red-total').innerText = calculate(red);
            document.getElementById('blue-total').innerText = calculate(blue);
            renderControls(red, 'red');
            renderControls(blue, 'blue');
        }

        window.toggleAutoOverride = () => { autoOverride = !autoOverride; update(); };
        window.changeVal = (side, key, delta) => {
            const obj = side === 'red' ? red : blue;
            obj[key] = Math.max(0, obj[key] + delta);
            update();
        };
        window.toggleBool = (side, key) => {
            const obj = side === 'red' ? red : blue;
            obj[key] = !obj[key];
            update();
        };
        window.addStack = (side, h) => {
            (side === 'red' ? red : blue).autoStacks.push(h);
            update();
        };
        window.removeStack = (side, i) => {
            (side === 'red' ? red : blue).autoStacks.splice(i, 1);
            update();
        };

        window.toggleTimer = () => {
            isRunning = !isRunning;
            document.getElementById('timer-btn').innerHTML = isRunning ? `<i data-lucide="pause"></i>` : `<i data-lucide="play"></i>`;
            document.getElementById('overlay').classList.add('hidden');
            lucide.createIcons();
            
            if (isRunning) {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    
                    // Countdown Triggers
                    if (timeLeft === 95) speak("Say clearly: Five, four, three, two, one, Teleop!");
                    if (timeLeft === 5) speak("Say in a deep voice: Five, four, three, two, one, Game Over!");

                    if (timeLeft === 90) {
                        red.autoLockedScore = calculateAuto(red);
                        blue.autoLockedScore = calculateAuto(blue);
                        phase = 'TELEOP';
                        document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] bg-blue-600 text-white";
                        document.getElementById('phase-badge').innerText = "TELEOP";
                    }

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        timeLeft = 0;
                    }

                    const m = Math.floor(timeLeft / 60);
                    const s = timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    if (timeLeft <= 5) document.getElementById('timer-display').classList.add('timer-warning');
                    else document.getElementById('timer-display').classList.remove('timer-warning');
                    update();
                }, 1000);
            } else {
                clearInterval(timerInterval);
            }
        };

        window.resetMatch = () => {
            clearInterval(timerInterval);
            timeLeft = 120;
            isRunning = false;
            phase = 'AUTO';
            autoOverride = false;
            red = initialState();
            blue = initialState();
            document.getElementById('timer-display').innerText = "2:00";
            document.getElementById('phase-badge').innerText = "AUTO";
            document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] bg-amber-500 text-amber-950 pulse";
            document.getElementById('overlay').classList.remove('hidden');
            update();
        };

        window.saveMatch = () => {
            const m = document.getElementById('match-number').value;
            matchLog.unshift({ match: m, timestamp: new Date().toLocaleTimeString(), redScore: calculate(red), blueScore: calculate(blue), winner: calculate(red) > calculate(blue) ? 'RED' : 'BLUE' });
            renderLog();
            document.getElementById('match-number').value = parseInt(m) + 1;
        };

        function renderLog() {
            document.getElementById('match-log').innerHTML = matchLog.map(m => `
                <div class="p-2 bg-white border rounded shadow-sm flex justify-between items-center">
                    <span class="text-[8px] font-black">M${m.match}</span>
                    <span class="text-[10px] font-black">${m.redScore} - ${m.blueScore}</span>
                    <span class="text-[7px] font-bold text-slate-400 uppercase">${m.winner}</span>
                </div>
            `).join('');
        }

        window.onload = () => { update(); lucide.createIcons(); };
    </script>
</body>
</html>
