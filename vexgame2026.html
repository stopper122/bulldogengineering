<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Summit Climb Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            background-color: #f8fafc;
        }

        .no-select {
            -webkit-user-select: none;
            user-select: none;
        }

        /* Optimization for Tablet aspect ratios */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .stepper-btn {
            transition: transform 0.1s active;
            -webkit-tap-highlight-color: transparent;
        }

        .stepper-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="app" class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="text-center sm:text-left mb-4 sm:mb-0">
                <h1 class="text-3xl font-bold text-slate-900 leading-tight">Summit Climb</h1>
                <p class="text-slate-500 font-medium">Match Scorer • S6 Lite Optimized</p>
            </div>
            <div class="bg-indigo-600 text-white px-8 py-4 rounded-2xl text-center min-w-[160px]">
                <div class="text-xs uppercase tracking-widest font-bold opacity-80">Total Score</div>
                <div id="total-score" class="text-4xl font-black">0</div>
            </div>
        </header>

        <div class="grid-container">
            <!-- Autonomous Section -->
            <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-6 flex items-center text-indigo-700">
                    <span class="mr-2">🤖</span> Autonomous
                </h2>
                
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-bold text-slate-800">Auto High</p>
                            <p class="text-xs text-slate-500">15 pts each</p>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button onclick="changeValue('autoHigh', -1)" class="stepper-btn w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-2xl font-bold text-slate-600">-</button>
                            <span id="autoHigh-val" class="text-xl font-bold w-6 text-center">0</span>
                            <button onclick="changeValue('autoHigh', 1)" class="stepper-btn w-12 h-12 rounded-xl bg-indigo-100 flex items-center justify-center text-2xl font-bold text-indigo-600">+</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between border-t pt-4">
                        <div>
                            <p class="font-bold text-slate-800">Auto Low</p>
                            <p class="text-xs text-slate-500">8 pts each</p>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button onclick="changeValue('autoLow', -1)" class="stepper-btn w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-2xl font-bold text-slate-600">-</button>
                            <span id="autoLow-val" class="text-xl font-bold w-6 text-center">0</span>
                            <button onclick="changeValue('autoLow', 1)" class="stepper-btn w-12 h-12 rounded-xl bg-indigo-100 flex items-center justify-center text-2xl font-bold text-indigo-600">+</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Teleop Section -->
            <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-6 flex items-center text-emerald-700">
                    <span class="mr-2">🕹️</span> Teleop & Endgame
                </h2>
                
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-bold text-slate-800">Standard Score</p>
                            <p class="text-xs text-slate-500">5 pts each</p>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button onclick="changeValue('teleop', -1)" class="stepper-btn w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-2xl font-bold text-slate-600">-</button>
                            <span id="teleop-val" class="text-xl font-bold w-6 text-center">0</span>
                            <button onclick="changeValue('teleop', 1)" class="stepper-btn w-12 h-12 rounded-xl bg-emerald-100 flex items-center justify-center text-2xl font-bold text-emerald-600">+</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between border-t pt-4">
                        <div>
                            <p class="font-bold text-slate-800">Summit Bonus</p>
                            <p class="text-xs text-slate-500">25 pts</p>
                        </div>
                        <button id="summit-btn" onclick="toggleValue('summit')" class="w-24 h-12 rounded-xl font-bold transition-all bg-slate-100 text-slate-400">OFF</button>
                    </div>

                    <div class="flex items-center justify-between border-t pt-4">
                        <div>
                            <p class="font-bold text-slate-800 italic">ULTIMATE</p>
                            <p class="text-xs text-slate-500">100 pts bonus</p>
                        </div>
                        <button id="ultimate-btn" onclick="toggleValue('ultimate')" class="w-24 h-12 rounded-xl font-bold transition-all bg-slate-100 text-slate-400">OFF</button>
                    </div>
                </div>
            </section>
        </div>

        <!-- Action Bar -->
        <footer class="mt-8 flex flex-col sm:flex-row gap-4">
            <button onclick="resetData()" class="flex-1 py-5 rounded-2xl bg-white border-2 border-rose-100 text-rose-600 font-bold text-lg hover:bg-rose-50 transition-colors">
                Reset Scorer
            </button>
            <button onclick="exportData()" class="flex-[2] py-5 rounded-2xl bg-slate-900 text-white font-bold text-lg shadow-lg hover:bg-slate-800 transition-transform active:scale-[0.98]">
                Export Detailed Breakdown
            </button>
        </footer>

        <!-- Toast Notification Area -->
        <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-800 text-white rounded-full opacity-0 pointer-events-none transition-opacity duration-300 font-medium text-sm shadow-xl">
            Copied to clipboard!
        </div>
    </div>

    <script>
        const state = {
            autoHigh: 0,
            autoLow: 0,
            teleop: 0,
            summit: false,
            ultimate: false
        };

        const config = {
            autoHigh: 15,
            autoLow: 8,
            teleop: 5,
            summit: 25,
            ultimate: 100
        };

        function updateUI() {
            // Numbers
            document.getElementById('autoHigh-val').textContent = state.autoHigh;
            document.getElementById('autoLow-val').textContent = state.autoLow;
            document.getElementById('teleop-val').textContent = state.teleop;

            // Toggles
            const summitBtn = document.getElementById('summit-btn');
            summitBtn.textContent = state.summit ? 'ON' : 'OFF';
            summitBtn.className = `w-24 h-12 rounded-xl font-bold transition-all ${state.summit ? 'bg-emerald-500 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`;

            const ultimateBtn = document.getElementById('ultimate-btn');
            ultimateBtn.textContent = state.ultimate ? 'ON' : 'OFF';
            ultimateBtn.className = `w-24 h-12 rounded-xl font-bold transition-all ${state.ultimate ? 'bg-indigo-600 text-white shadow-lg border-2 border-indigo-400 scale-105' : 'bg-slate-100 text-slate-400'}`;

            // Total
            const total = (state.autoHigh * config.autoHigh) + 
                          (state.autoLow * config.autoLow) + 
                          (state.teleop * config.teleop) + 
                          (state.summit ? config.summit : 0) + 
                          (state.ultimate ? config.ultimate : 0);
            
            document.getElementById('total-score').textContent = total;
        }

        function changeValue(key, delta) {
            state[key] = Math.max(0, state[key] + delta);
            updateUI();
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        }

        function toggleValue(key) {
            state[key] = !state[key];
            updateUI();
            if (window.navigator.vibrate) window.navigator.vibrate(20);
        }

        function resetData() {
            state.autoHigh = 0;
            state.autoLow = 0;
            state.teleop = 0;
            state.summit = false;
            state.ultimate = false;
            updateUI();
        }

        function exportData() {
            const date = new Date().toLocaleString();
            const total = document.getElementById('total-score').textContent;
            
            const breakdown = [
                `SUMMIT CLIMB MATCH REPORT`,
                `Timestamp: ${date}`,
                `--------------------------`,
                `AUTO HIGH:   ${state.autoHigh} x ${config.autoHigh} = ${state.autoHigh * config.autoHigh} pts`,
                `AUTO LOW:    ${state.autoLow} x ${config.autoLow} = ${state.autoLow * config.autoLow} pts`,
                `TELEOP:      ${state.teleop} x ${config.teleop} = ${state.teleop * config.teleop} pts`,
                `SUMMIT:      ${state.summit ? 'YES (' + config.summit + ' pts)' : 'NO'}`,
                `ULTIMATE:    ${state.ultimate ? 'YES (' + config.ultimate + ' pts)' : 'NO'}`,
                `--------------------------`,
                `TOTAL SCORE: ${total} pts`
            ].join('\n');

            // Copy to clipboard
            const textArea = document.createElement("textarea");
            textArea.value = breakdown;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            // Show Toast
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        // Initialize UI
        updateUI();
    </script>
</body>
</html>
