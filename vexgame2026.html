<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacker's Summit Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-200 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 p-4 shadow-xl flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-4">
            <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                <i data-lucide="target"></i>
            </div>
            <div>
                <h1 class="text-white font-black italic text-xl leading-none uppercase tracking-tighter">Stacker's Summit</h1>
                <span class="text-blue-400 text-[10px] font-bold tracking-[0.3em] uppercase opacity-70">Official Scorer</span>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="flex flex-col items-end">
                <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Match #</span>
                <input type="number" id="match-number" value="1" class="w-16 bg-slate-800 border border-slate-700 text-white font-black px-2 py-1 rounded text-center outline-none focus:border-blue-500 transition-colors">
            </div>
            <div id="phase-badge" class="px-4 py-2 rounded-full font-black text-xs tracking-widest bg-amber-500 text-amber-950 pulse">
                AUTO
            </div>
            <div id="timer-display" class="text-white text-4xl font-mono font-black tabular-nums tracking-tighter">
                2:00
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTimer()" id="timer-btn" class="p-3 bg-green-500 text-white rounded-full shadow-lg active:scale-95 transition-all">
                    <i data-lucide="play"></i>
                </button>
                <button onclick="resetMatch()" class="p-3 bg-slate-700 text-white rounded-full hover:bg-slate-600 shadow-lg active:rotate-180 transition-all">
                    <i data-lucide="rotate-ccw"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex p-3 gap-3 overflow-hidden relative">
        
        <!-- Red Alliance -->
        <div class="w-1/3 flex flex-col rounded-2xl border-2 border-red-200 bg-red-50 overflow-hidden shadow-md">
            <div class="bg-red-600 p-4 text-white flex justify-between items-start">
                <div>
                    <h2 class="text-lg font-black uppercase italic tracking-tighter">Red Alliance</h2>
                    <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest">Live Points</p>
                </div>
                <div id="red-total" class="text-4xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-4 custom-scrollbar" id="red-controls"></div>
        </div>

        <!-- Blue Alliance -->
        <div class="w-1/3 flex flex-col rounded-2xl border-2 border-blue-200 bg-blue-50 overflow-hidden shadow-md">
            <div class="bg-blue-700 p-4 text-white flex justify-between items-start">
                <div>
                    <h2 class="text-lg font-black uppercase italic tracking-tighter">Blue Alliance</h2>
                    <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest">Live Points</p>
                </div>
                <div id="blue-total" class="text-4xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-4 custom-scrollbar" id="blue-controls"></div>
        </div>

        <!-- History Log -->
        <div class="w-1/3 flex flex-col rounded-2xl border-2 border-slate-300 bg-white overflow-hidden shadow-md">
            <div class="bg-slate-800 p-4 text-white flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-black uppercase italic tracking-tighter">Match Log</h2>
                    <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest">Recorded Stats</p>
                </div>
                <button onclick="exportLog()" class="flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-[10px] font-black uppercase transition-colors">
                    <i data-lucide="download" class="w-3 h-3"></i> Export
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-3 custom-scrollbar space-y-2" id="match-log"></div>

            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <button onclick="saveMatch()" class="w-full bg-slate-900 hover:bg-black text-white py-3 rounded-xl font-black uppercase tracking-widest text-sm shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="save"></i> Save Match
                </button>
            </div>
        </div>

        <!-- Overlay -->
        <div id="overlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-8">
            <div class="bg-white p-8 rounded-[2rem] shadow-2xl text-center max-w-md">
                <h3 class="text-3xl font-black text-slate-900 mb-2 italic uppercase">Match Ready</h3>
                <p class="text-slate-500 text-sm font-bold mb-8 uppercase tracking-wide">30s Autonomous Phase Begins Now</p>
                <button onclick="toggleTimer()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl uppercase tracking-widest text-lg">
                    Begin Match
                </button>
            </div>
        </div>
    </main>

    <script>
        let timeLeft = 120;
        let isRunning = false;
        let phase = 'AUTO';
        let timerInterval;
        let matchLog = [];

        const initialState = () => ({
            yellowBase: 0, ringBase: 0, plushUpBase: 0, plushTipBase: 0, ballBase: 0, rockerBase: 0,
            yellowZone: 0, ringZone: 0, plushUpZone: 0, plushTipZone: 0, ballZone: 0,
            scrapZone: 0, scrapBase: 0, hazard: 0,
            pickle: false, stacks: [], ultimate: false, autoWinner: false, scout: 0
        });

        let red = initialState();
        let blue = initialState();

        function calculate(alliance) {
            let total = 0;
            const isAuto = phase === 'AUTO';

            // 1. BASE SCORING
            // Standard Items: Cubes/Rings (10pt), Ball/Rocker (20pt)
            let rawBaseValue = (alliance.yellowBase + alliance.ringBase) * 10;
            rawBaseValue += (alliance.ballBase + alliance.rockerBase) * 20;
            rawBaseValue += (alliance.plushUpBase * 30) + (alliance.plushTipBase * 15);

            // 2. STACK MULTIPLIERS (Only apply to Home Base items)
            let stackBonus = 0;
            if (alliance.stacks.length > 0) {
                const itemCount = alliance.yellowBase + alliance.ringBase + alliance.ballBase + alliance.rockerBase + alliance.plushUpBase + alliance.plushTipBase;
                const avgItemValue = itemCount > 0 ? rawBaseValue / itemCount : 0;
                
                alliance.stacks.forEach(height => {
                    let multiplier = height === 2 ? 3 : height === 3 ? 4 : 5;
                    // Add the multiplier bonus (Multiplier * AvgValue * Height) minus the value already counted in rawBase
                    stackBonus += (avgItemValue * height * multiplier) - (avgItemValue * height);
                });
            }

            // 3. APPLY AUTO MULTIPLIER (Rule 6: 2x Final Value for items on Base)
            let baseFinal = rawBaseValue + stackBonus;
            if (isAuto) {
                total += (baseFinal * 2);
            } else {
                total += baseFinal;
            }

            // 4. ZONE SCORING (Only Teleop per Rule 3)
            if (!isAuto) {
                total += (alliance.yellowZone + alliance.ringZone) * 2;
                total += (alliance.plushUpZone * 10) + (alliance.plushTipZone * 5);
                total += (alliance.ballZone * 5);
            }

            // 5. MISSIONS & BONUSES
            if (isAuto) {
                if (alliance.pickle) total += 100; // VIP Retrieval
                total += (alliance.ballBase + alliance.rockerBase) * 50; // Tech Specialist
                total += alliance.scout === 1 ? 10 : alliance.scout === 2 ? 25 : 0; // Scout
            }
            
            if (alliance.ultimate) total += 100; // Ultimate Sequence
            if (alliance.autoWinner) total += 50; // Auto Winner Bonus

            // 6. PENALTIES
            // The Neutralizer: Pickle ball ignores scrap penalties
            if (!alliance.pickle) {
                total -= (alliance.scrapZone * 2);
                total -= (alliance.scrapBase * 10);
            }
            total -= (alliance.hazard * 15);

            return Math.max(0, Math.round(total));
        }

        function renderControls(alliance, side) {
            const container = document.getElementById(`${side}-controls`);
            container.innerHTML = `
                <section class="space-y-2">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase flex items-center gap-1.5">Home Base</h3>
                    <div class="grid grid-cols-2 gap-2">
                        ${renderCounter('Cubes', alliance.yellowBase, side, 'yellowBase')}
                        ${renderCounter('Rings', alliance.ringBase, side, 'ringBase')}
                        ${renderCounter('Rocker', alliance.rockerBase, side, 'rockerBase')}
                        ${renderCounter('Summit Ball', alliance.ballBase, side, 'ballBase')}
                        ${renderCounter('Plush Up', alliance.plushUpBase, side, 'plushUpBase')}
                        ${renderCounter('Plush Tip', alliance.plushTipBase, side, 'plushTipBase')}
                    </div>
                    <div class="p-2 bg-white/60 rounded-xl border border-dashed border-slate-300">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[9px] font-black text-slate-400 uppercase">Stacks</span>
                            <div class="flex gap-1">
                                <button onclick="addStack('${side}', 2)" class="px-2 py-1 bg-slate-800 text-white text-[9px] rounded">+2T</button>
                                <button onclick="addStack('${side}', 3)" class="px-2 py-1 bg-slate-800 text-white text-[9px] rounded">+3T</button>
                                <button onclick="addStack('${side}', 4)" class="px-2 py-1 bg-slate-800 text-white text-[9px] rounded">+4T</button>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-1">
                            ${alliance.stacks.map((s, i) => `<div class="bg-white px-2 py-1 rounded text-[10px] font-bold border flex items-center gap-1">${s}T <i data-lucide="x" class="w-3 h-3 text-red-500 cursor-pointer" onclick="removeStack('${side}', ${i})"></i></div>`).join('')}
                        </div>
                    </div>
                </section>

                <section class="space-y-2 ${phase === 'AUTO' ? 'opacity-20 pointer-events-none' : ''}">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase">Zone Floor (Teleop Only)</h3>
                    <div class="grid grid-cols-2 gap-2">
                        ${renderCounter('Standard', alliance.yellowZone, side, 'yellowZone')}
                        ${renderCounter('Ball', alliance.ballZone, side, 'ballZone')}
                        ${renderCounter('Plush Up', alliance.plushUpZone, side, 'plushUpZone')}
                        ${renderCounter('Scrap', alliance.scrapZone, side, 'scrapZone')}
                    </div>
                </section>

                <section class="pt-2 border-t border-slate-200 grid grid-cols-2 gap-2">
                    <button onclick="toggleBool('${side}', 'autoWinner')" class="flex flex-col items-center p-2 rounded-xl border-2 ${alliance.autoWinner ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-400 border-slate-200'}">
                        <i data-lucide="trophy" class="w-4 h-4 mb-1"></i><span class="text-[8px] font-black uppercase">Auto Win</span>
                    </button>
                    <button onclick="toggleBool('${side}', 'ultimate')" class="flex flex-col items-center p-2 rounded-xl border-2 ${alliance.ultimate ? 'bg-purple-600 text-white border-purple-700' : 'bg-white text-slate-400 border-slate-200'}">
                        <i data-lucide="star" class="w-4 h-4 mb-1"></i><span class="text-[8px] font-black uppercase">Ultimate</span>
                    </button>
                    <button onclick="toggleBool('${side}', 'pickle')" class="p-2 rounded-lg text-[10px] font-bold border ${alliance.pickle ? 'bg-green-100 border-green-400 text-green-800' : 'bg-slate-50 border-slate-200 text-slate-400'}">Pickle Ball</button>
                    <div class="flex gap-1">
                        ${[0, 1, 2].map(v => `<button onclick="setScout('${side}', ${v})" class="flex-1 py-1 rounded text-[8px] font-black border ${alliance.scout === v ? 'bg-blue-600 text-white' : 'bg-slate-50 text-slate-400'}">${v === 0 ? 'X' : v === 1 ? 'N' : 'I'}</button>`).join('')}
                    </div>
                </section>
                ${renderCounter('Hazard Pen', alliance.hazard, side, 'hazard')}
            `;
            lucide.createIcons();
        }

        function renderCounter(label, val, side, key) {
            return `
                <div class="flex items-center justify-between p-2 bg-white rounded-lg shadow-sm border border-slate-200">
                    <span class="text-[9px] font-bold text-slate-500 uppercase truncate">${label}</span>
                    <div class="flex items-center gap-1.5">
                        <button onclick="changeVal('${side}', '${key}', -1)" class="p-1 hover:bg-slate-100 rounded text-slate-300"><i data-lucide="minus" class="w-3 h-3"></i></button>
                        <span class="text-xs font-black w-4 text-center tabular-nums">${val}</span>
                        <button onclick="changeVal('${side}', '${key}', 1)" class="p-1 hover:bg-slate-100 rounded text-slate-900"><i data-lucide="plus" class="w-3 h-3"></i></button>
                    </div>
                </div>
            `;
        }

        function update() {
            document.getElementById('red-total').innerText = calculate(red);
            document.getElementById('blue-total').innerText = calculate(blue);
            renderControls(red, 'red');
            renderControls(blue, 'blue');
        }

        window.changeVal = (side, key, delta) => {
            const obj = side === 'red' ? red : blue;
            obj[key] = Math.max(0, obj[key] + delta);
            update();
        };

        window.toggleBool = (side, key) => {
            const obj = side === 'red' ? red : blue;
            obj[key] = !obj[key];
            update();
        };

        window.setScout = (side, val) => {
            const obj = side === 'red' ? red : blue;
            obj.scout = val;
            update();
        };

        window.addStack = (side, h) => {
            const obj = side === 'red' ? red : blue;
            obj.stacks.push(h);
            update();
        };

        window.removeStack = (side, i) => {
            const obj = side === 'red' ? red : blue;
            obj.stacks.splice(i, 1);
            update();
        };

        window.toggleTimer = () => {
            isRunning = !isRunning;
            document.getElementById('timer-btn').innerHTML = isRunning ? `<i data-lucide="pause"></i>` : `<i data-lucide="play"></i>`;
            document.getElementById('overlay').classList.add('hidden');
            lucide.createIcons();
            
            if (isRunning) {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft === 90) {
                        phase = 'TELEOP';
                        document.getElementById('phase-badge').className = "px-4 py-2 rounded-full font-black text-xs tracking-widest bg-blue-600 text-white";
                        document.getElementById('phase-badge').innerText = "TELEOP";
                    }
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                    }
                    const m = Math.floor(timeLeft / 60);
                    const s = timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    update();
                }, 1000);
            } else {
                clearInterval(timerInterval);
            }
        };

        window.resetMatch = () => {
            clearInterval(timerInterval);
            timeLeft = 120;
            isRunning = false;
            phase = 'AUTO';
            red = initialState();
            blue = initialState();
            document.getElementById('timer-display').innerText = "2:00";
            document.getElementById('phase-badge').className = "px-4 py-2 rounded-full font-black text-xs tracking-widest bg-amber-500 text-amber-950 pulse";
            document.getElementById('phase-badge').innerText = "AUTO";
            document.getElementById('overlay').classList.remove('hidden');
            update();
        };

        window.saveMatch = () => {
            const matchNum = document.getElementById('match-number').value;
            matchLog.unshift({
                match: matchNum,
                timestamp: new Date().toLocaleTimeString(),
                redScore: calculate(red),
                blueScore: calculate(blue),
                winner: calculate(red) > calculate(blue) ? 'RED' : calculate(red) < calculate(blue) ? 'BLUE' : 'DRAW'
            });
            renderLog();
            document.getElementById('match-number').value = parseInt(matchNum) + 1;
        };

        function renderLog() {
            const container = document.getElementById('match-log');
            container.innerHTML = matchLog.map(m => `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between shadow-sm">
                    <div class="flex items-center gap-2">
                        <div class="text-[10px] font-black bg-slate-200 px-2 py-1 rounded">#${m.match}</div>
                        <div class="font-black tabular-nums text-sm">
                            <span class="text-red-600">${m.redScore}</span> - <span class="text-blue-600">${m.blueScore}</span>
                        </div>
                    </div>
                    <div class="text-[10px] font-black uppercase text-slate-400 italic">${m.winner}</div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.exportLog = () => {
            let csv = "Match,Red,Blue,Winner\n" + matchLog.map(m => `${m.match},${m.redScore},${m.blueScore},${m.winner}`).join("\n");
            const link = document.createElement("a");
            link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
            link.download = "match_log.csv";
            link.click();
        };

        window.onload = () => {
            update();
            lucide.createIcons();
        };
    </script>
</body>
</html>
