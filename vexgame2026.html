<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stacker's Summit Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            touch-action: manipulation; 
            -webkit-user-select: none;
            user-select: none;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
        
        #log-sidebar { transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .sidebar-closed { transform: translateX(100%); }

        .stepper-btn { transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; border-radius: 9999px; }

        /* Tablet Mode (Default) */
        .mode-tablet .stepper-btn { width: 48px; height: 48px; }
        .mode-tablet .control-card { padding: 1.25rem; margin-bottom: 1.25rem; border-radius: 1.25rem; }
        .mode-tablet .counter-row { padding: 0.75rem 1rem; margin-bottom: 0.5rem; }
        .mode-tablet .alliance-container { border-radius: 1.5rem; }

        /* Computer Mode (Compact) */
        .mode-computer .stepper-btn { width: 32px; height: 32px; }
        .mode-computer .control-card { padding: 0.75rem; margin-bottom: 0.75rem; border-radius: 0.75rem; }
        .mode-computer .counter-row { padding: 0.4rem 0.75rem; margin-bottom: 0.25rem; }
        .mode-computer .alliance-container { border-radius: 1rem; }
        .mode-computer h2 { font-size: 1.1rem; }
    </style>
</head>
<body id="app-body" class="bg-slate-100 h-screen flex flex-col overflow-hidden mode-tablet">

    <!-- Header Navigation -->
    <header class="bg-slate-900 p-4 shadow-xl flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i data-lucide="mountain" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-white font-black italic text-xl uppercase tracking-tighter leading-none">Stacker's Summit</h1>
                <p id="mode-label" class="text-blue-400 text-[10px] font-bold uppercase tracking-widest mt-1">Tablet Mode</p>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <!-- Mode Toggle Switch -->
            <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
                <button onclick="setMode('computer')" id="btn-computer" class="px-3 py-1.5 rounded-lg text-[10px] font-black transition-all flex items-center gap-2 text-slate-400">
                    <i data-lucide="monitor" class="w-3.5 h-3.5"></i> PC
                </button>
                <button onclick="setMode('tablet')" id="btn-tablet" class="px-3 py-1.5 rounded-lg text-[10px] font-black transition-all flex items-center gap-2 bg-blue-600 text-white shadow-lg">
                    <i data-lucide="tablet" class="w-3.5 h-3.5"></i> TABLET
                </button>
            </div>

            <div id="phase-badge" class="px-4 py-2 rounded-lg font-black text-xs bg-amber-500 text-amber-950 pulse uppercase">AUTO</div>
            
            <div id="timer-display" class="text-white text-4xl font-mono font-black tabular-nums tracking-tighter">2:00</div>
            
            <div class="flex gap-2">
                <button onclick="toggleTimer()" id="timer-btn" class="w-10 h-10 bg-green-500 text-white rounded-lg shadow-lg active:scale-90 transition-transform flex items-center justify-center">
                    <i data-lucide="play" class="w-6 h-6"></i>
                </button>
                <button onclick="resetMatch()" class="w-10 h-10 bg-slate-700 text-white rounded-lg shadow-lg active:rotate-180 transition-all flex items-center justify-center">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
                <button onclick="toggleLog()" class="w-10 h-10 bg-slate-800 text-blue-400 rounded-lg shadow-lg border border-slate-700 flex items-center justify-center">
                    <i data-lucide="history" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Scoring Area -->
    <main class="flex-1 flex p-4 gap-4 overflow-hidden">
        <!-- Red Alliance -->
        <section class="flex-1 flex flex-col bg-red-50 border-2 border-red-200 alliance-container overflow-hidden shadow-sm">
            <div class="bg-red-600 p-4 text-white flex justify-between items-center">
                <h2 class="font-black uppercase italic tracking-wider">Red Alliance</h2>
                <div id="red-total" class="text-4xl font-black">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 custom-scrollbar" id="red-controls"></div>
        </section>

        <!-- Blue Alliance -->
        <section class="flex-1 flex flex-col bg-blue-50 border-2 border-blue-200 alliance-container overflow-hidden shadow-sm">
            <div class="bg-blue-700 p-4 text-white flex justify-between items-center">
                <h2 class="font-black uppercase italic tracking-wider">Blue Alliance</h2>
                <div id="blue-total" class="text-4xl font-black">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 custom-scrollbar" id="blue-controls"></div>
        </section>

        <!-- Log Sidebar -->
        <div id="log-sidebar" class="fixed top-0 right-0 h-full w-80 bg-white shadow-2xl z-[60] flex flex-col sidebar-closed border-l border-slate-200">
            <div class="bg-slate-900 p-4 text-white flex justify-between items-center">
                <h2 class="font-black uppercase tracking-tighter italic">History</h2>
                <button onclick="toggleLog()" class="p-2 hover:bg-slate-800 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="match-log" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar"></div>
            <div class="p-4 border-t border-slate-100">
                <button onclick="saveMatch()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-xs">Save Score</button>
            </div>
        </div>
    </main>

    <script>
        // Scoring State
        const createAllianceState = () => ({
            cubes: 0,
            rings: 0,
            rockers: 0,
            balls: 0,
            pickleballs: 0,
            autoBonus: false
        });

        let red = createAllianceState();
        let blue = createAllianceState();
        let timeLeft = 120;
        let isRunning = false;
        let phase = 'AUTO';
        let timerInterval;
        let currentMode = 'tablet';

        // Display Mode Logic
        window.setMode = (mode) => {
            currentMode = mode;
            const body = document.getElementById('app-body');
            const btnPC = document.getElementById('btn-computer');
            const btnTab = document.getElementById('btn-tablet');
            const label = document.getElementById('mode-label');

            if (mode === 'computer') {
                body.classList.replace('mode-tablet', 'mode-computer');
                btnPC.className = "px-3 py-1.5 rounded-lg text-[10px] font-black bg-blue-600 text-white shadow-lg flex items-center gap-2";
                btnTab.className = "px-3 py-1.5 rounded-lg text-[10px] font-black text-slate-400 flex items-center gap-2";
                label.innerText = "Computer Mode";
            } else {
                body.classList.replace('mode-computer', 'mode-tablet');
                btnTab.className = "px-3 py-1.5 rounded-lg text-[10px] font-black bg-blue-600 text-white shadow-lg flex items-center gap-2";
                btnPC.className = "px-3 py-1.5 rounded-lg text-[10px] font-black text-slate-400 flex items-center gap-2";
                label.innerText = "Tablet Mode";
            }
            render();
        };

        // Core Calculation (Original logic preserved)
        function calculateScore(alliance) {
            let total = 0;
            total += alliance.cubes * 10;
            total += alliance.rings * 5;
            total += alliance.rockers * 20;
            total += alliance.balls * 15;
            total += alliance.pickleballs * 50;
            if (alliance.autoBonus) total += 20;
            return total;
        }

        function render() {
            document.getElementById('red-total').innerText = calculateScore(red);
            document.getElementById('blue-total').innerText = calculateScore(blue);
            
            renderSide('red', red);
            renderSide('blue', blue);
            lucide.createIcons();
        }

        function renderSide(id, state) {
            const container = document.getElementById(`${id}-controls`);
            const isTab = currentMode === 'tablet';
            
            container.innerHTML = `
                <div class="bg-white border border-slate-200 control-card shadow-sm">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Field Scoring</h3>
                    ${renderCounter(id, 'cubes', 'Cubes', 'box', state.cubes, 'text-amber-500')}
                    ${renderCounter(id, 'rings', 'Rings', 'circle-dashed', state.rings, 'text-blue-400')}
                    ${renderCounter(id, 'rockers', 'Rockers', 'layers', state.rockers, 'text-green-600')}
                    ${renderCounter(id, 'balls', 'Balls', 'circle', state.balls, 'text-orange-500')}
                    ${renderCounter(id, 'pickleballs', 'Pickleballs', 'target', state.pickleballs, 'text-lime-500')}
                </div>

                <div class="bg-white border border-slate-200 control-card shadow-sm">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Bonuses</h3>
                    <button onclick="toggleBonus('${id}')" class="w-full py-4 rounded-xl border-2 font-black text-xs uppercase transition-all ${state.autoBonus ? 'bg-indigo-600 border-indigo-700 text-white shadow-inner' : 'bg-slate-50 border-slate-100 text-slate-300'}">
                        Autonomous Bonus (+20)
                    </button>
                </div>
            `;
        }

        function renderCounter(side, key, label, icon, val, color) {
            const isTab = currentMode === 'tablet';
            const iconSize = isTab ? 'w-6 h-6' : 'w-4 h-4';
            const labelSize = isTab ? 'text-xs' : 'text-[10px]';

            return `
                <div class="flex items-center justify-between bg-slate-50 border border-slate-100 counter-row">
                    <div class="flex items-center gap-3">
                        <i data-lucide="${icon}" class="${iconSize} ${color}"></i>
                        <span class="${labelSize} font-bold text-slate-700 uppercase tracking-tight">${label}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeVal('${side}', '${key}', -1)" class="stepper-btn bg-white border border-slate-200 text-slate-400 active:scale-90">
                            <i data-lucide="minus" class="${isTab ? 'w-4 h-4' : 'w-3 h-3'}"></i>
                        </button>
                        <span class="${isTab ? 'text-xl' : 'text-sm'} font-black w-8 text-center tabular-nums">${val}</span>
                        <button onclick="changeVal('${side}', '${key}', 1)" class="stepper-btn bg-slate-900 text-white active:scale-90">
                            <i data-lucide="plus" class="${isTab ? 'w-4 h-4' : 'w-3 h-3'}"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // Actions
        window.changeVal = (side, key, delta) => {
            const state = side === 'red' ? red : blue;
            state[key] = Math.max(0, state[key] + delta);
            render();
        };

        window.toggleBonus = (side) => {
            const state = side === 'red' ? red : blue;
            state.autoBonus = !state.autoBonus;
            render();
        };

        window.toggleTimer = () => {
            isRunning = !isRunning;
            const btn = document.getElementById('timer-btn');
            btn.innerHTML = isRunning ? `<i data-lucide="pause"></i>` : `<i data-lucide="play"></i>`;
            lucide.createIcons();

            if (isRunning) {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft === 90) {
                        phase = 'TELEOP';
                        const badge = document.getElementById('phase-badge');
                        badge.innerText = "TELEOP";
                        badge.classList.replace('bg-amber-500', 'bg-blue-600');
                        badge.classList.replace('text-amber-950', 'text-white');
                        badge.classList.remove('pulse');
                    }
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        timeLeft = 0;
                    }
                    const m = Math.floor(timeLeft / 60);
                    const s = timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                }, 1000);
            } else {
                clearInterval(timerInterval);
            }
        };

        window.resetMatch = () => {
            clearInterval(timerInterval);
            red = createAllianceState();
            blue = createAllianceState();
            timeLeft = 120;
            isRunning = false;
            phase = 'AUTO';
            document.getElementById('timer-display').innerText = "2:00";
            const badge = document.getElementById('phase-badge');
            badge.innerText = "AUTO";
            badge.className = "px-4 py-2 rounded-lg font-black text-xs bg-amber-500 text-amber-950 pulse uppercase";
            render();
        };

        window.saveMatch = () => {
            const log = document.getElementById('match-log');
            const entry = document.createElement('div');
            entry.className = "p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center";
            entry.innerHTML = `
                <div>
                    <p class="text-[8px] font-bold text-slate-400 uppercase">${new Date().toLocaleTimeString()}</p>
                    <p class="font-black text-lg"><span class="text-red-600">${calculateScore(red)}</span> - <span class="text-blue-600">${calculateScore(blue)}</span></p>
                </div>
                <div class="text-[9px] font-black px-2 py-1 bg-white border border-slate-100 rounded uppercase">Match Saved</div>
            `;
            log.prepend(entry);
        };

        window.toggleLog = () => document.getElementById('log-sidebar').classList.toggle('sidebar-closed');

        window.onload = () => {
            render();
            lucide.createIcons();
        };
    </script>
</body>
</html>
