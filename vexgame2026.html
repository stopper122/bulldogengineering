<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stacker's Summit Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        .bg-game-yellow { background-color: #facc15; }
        .bg-game-green { background-color: #22c55e; }
        .bg-game-tennis { background-color: #bef264; }
        .bg-game-red { background-color: #ef4444; }
        .bg-game-blue { background-color: #3b82f6; }
        .bg-game-scrap { background-color: #64748b; }
        .bg-game-poms { background-color: #ec4899; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- Header -->
    <header class="bg-slate-900 px-4 py-3 shadow-xl flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                <i data-lucide="mountain" class="w-5 h-5"></i>
            </div>
            <h1 class="text-white font-black italic text-lg uppercase tracking-tighter hidden sm:block">Stacker's Summit</h1>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex flex-col items-center">
                <span class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Match</span>
                <input type="number" id="match-number" value="1" class="w-12 bg-slate-800 border border-slate-700 text-white font-black py-0.5 rounded text-center outline-none focus:border-blue-500">
            </div>
            
            <div id="phase-badge" class="px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse">
                AUTO
            </div>

            <div id="timer-display" class="text-white text-3xl font-mono font-black tabular-nums tracking-tighter w-20 text-center">
                2:00
            </div>

            <div class="flex gap-2">
                <button onclick="toggleTimer()" id="timer-btn" class="flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    <span id="timer-btn-text">Start</span>
                </button>
                <button onclick="resetMatch()" class="p-2.5 bg-slate-700 text-white rounded-full hover:bg-slate-600 transition-colors">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="game-container" class="flex-1 flex flex-col md:flex-row p-2 gap-2 overflow-hidden">
        
        <!-- Red Alliance -->
        <div class="flex-1 flex flex-col rounded-2xl border-2 border-red-200 bg-red-50 overflow-hidden shadow-sm">
            <div class="bg-red-600 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-sm font-black uppercase italic tracking-wider">Red Alliance</h2>
                <div id="red-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-4 custom-scrollbar" id="red-controls"></div>
        </div>

        <!-- Blue Alliance -->
        <div class="flex-1 flex flex-col rounded-2xl border-2 border-blue-200 bg-blue-50 overflow-hidden shadow-sm">
            <div class="bg-blue-700 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-sm font-black uppercase italic tracking-wider">Blue Alliance</h2>
                <div id="blue-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-4 custom-scrollbar" id="blue-controls"></div>
        </div>

        <!-- Match Actions Sidebar -->
        <div class="w-full md:w-64 flex flex-col rounded-2xl border-2 border-slate-200 bg-white overflow-hidden shadow-sm shrink-0">
            <div class="bg-slate-800 p-3 text-white">
                <h2 class="text-[10px] font-black uppercase tracking-widest flex items-center gap-2">
                    <i data-lucide="history" class="w-3 h-3"></i> Match Log
                </h2>
            </div>
            <div class="flex-1 overflow-y-auto p-2 custom-scrollbar space-y-2 bg-slate-50" id="match-log"></div>
            <div class="p-3 border-t border-slate-100 bg-white">
                <button onclick="saveMatch()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase tracking-widest text-[11px] shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
                    <i data-lucide="save" class="w-4 h-4"></i> Commit Result
                </button>
            </div>
        </div>
    </main>

    <script>
        let timeLeft = 120;
        let isRunning = false;
        let phase = 'AUTO';
        let timerInterval;
        let matchLog = [];

        const getEmptyState = () => ({
            // Auto
            yellowBase: 0, ringBase: 0, rockerBase: 0, ballBase: 0, botUpBase: 0, botTipBase: 0,
            scout: 0, autoStacks: [],
            // Teleop
            yellowZone: 0, ringZone: 0, botUpZone: 0, botTipZone: 0, ballZone: 0,
            // Negative/Penalty
            scrapZone: 0, scrapBase: 0,
            pomsZone: 0, pomsBase: 0,
            hazard: 0,
            // Flags
            autoWinner: false, ultimate: false, pickle: false,
            autoLockedScore: 0
        });

        let red = getEmptyState();
        let blue = getEmptyState();

        function calcAuto(a) {
            let pts = 0;
            let items = (a.yellowBase + a.ringBase) * 10;
            items += (a.ballBase + a.rockerBase) * 20;
            items += (a.botUpBase * 30) + (a.botTipBase * 15);
            
            let stackBonus = 0;
            if (a.autoStacks.length > 0) {
                const count = a.yellowBase + a.ringBase + a.ballBase + a.rockerBase + a.botUpBase + a.botTipBase;
                const avg = count > 0 ? items / count : 0;
                a.autoStacks.forEach(h => {
                    let mult = h === 2 ? 3 : h === 3 ? 4 : 5;
                    stackBonus += (avg * h * mult * 2) - (avg * h);
                });
            }

            pts += (items * 2) + stackBonus;
            pts += (a.ballBase + a.rockerBase) * 50;
            pts += a.scout === 1 ? 10 : a.scout === 2 ? 25 : 0;
            return Math.max(0, Math.round(pts));
        }

        function calcTotal(a) {
            if (phase === 'AUTO') return calcAuto(a);
            
            let pts = a.autoLockedScore;
            pts += (a.yellowZone + a.ringZone) * 2;
            pts += (a.botUpZone * 10) + (a.botTipZone * 5);
            pts += (a.ballZone * 5);
            
            if (a.ultimate) pts += 100;
            if (a.autoWinner) pts += 50;
            
            if (a.pickle) {
                pts += 100;
            } else {
                pts -= (a.scrapZone * 2);
                pts -= (a.scrapBase * 10);
                pts -= (a.pomsZone * 2);
                pts -= (a.pomsBase * 10);
            }
            
            pts -= (a.hazard * 15);
            return Math.max(0, Math.round(pts));
        }

        function render() {
            document.getElementById('red-total').innerText = calcTotal(red);
            document.getElementById('blue-total').innerText = calcTotal(blue);
            renderAlliance(red, 'red');
            renderAlliance(blue, 'blue');
        }

        function renderAlliance(a, side) {
            const container = document.getElementById(`${side}-controls`);
            const isAuto = phase === 'AUTO';

            if (isAuto) {
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        ${counter('Cubes', 'box', a.yellowBase, side, 'yellowBase', 'bg-game-yellow')}
                        ${counter('Rings', 'circle', a.ringBase, side, 'ringBase', 'bg-slate-200')}
                        ${counter('Rocker', 'layers', a.rockerBase, side, 'rockerBase', 'bg-game-green')}
                        ${counter('Summit (Ball)', 'circle', a.ballBase, side, 'ballBase', 'bg-game-tennis')}
                        ${counter('Bot (Up)', 'bot', a.botUpBase, side, 'botUpBase', 'bg-game-red')}
                        ${counter('Bot (Tip)', 'trending-down', a.botTipBase, side, 'botTipBase', 'bg-red-200')}
                    </div>
                    <div class="mt-4 bg-white p-3 rounded-xl border border-slate-200">
                        <h4 class="text-[9px] font-black uppercase text-slate-400 mb-2">Scout Mission</h4>
                        <div class="flex gap-2">
                            ${['OFF', 'N-ZONE', 'O-ZONE'].map((l, i) => `
                                <button onclick="setScout('${side}', ${i})" class="flex-1 py-2 rounded-lg text-[9px] font-black transition-all ${a.scout === i ? 'bg-slate-900 text-white shadow-md' : 'bg-slate-50 text-slate-400 border border-slate-100'}">${l}</button>
                            `).join('')}
                        </div>
                    </div>
                    <div class="mt-4 bg-white p-3 rounded-xl border border-slate-200">
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="text-[9px] font-black uppercase text-slate-400">Auto Stacks</h4>
                            <div class="flex gap-1">
                                ${[2,3,4].map(h => `<button onclick="addStack('${side}', ${h})" class="px-2 py-1 bg-slate-100 text-[10px] font-bold rounded hover:bg-slate-200">${h}T</button>`).join('')}
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${a.autoStacks.map((s, i) => `<div class="bg-slate-900 text-white px-2 py-1 rounded text-[10px] font-black flex items-center gap-1">${s}T <i data-lucide="x" class="w-3 h-3 text-red-400 cursor-pointer" onclick="removeStack('${side}', ${i})"></i></div>`).join('')}
                        </div>
                    </div>
                `;
            } else {
                // TELEOP LAYOUT MATCHING SCREENSHOT
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        ${counter('Cubes', 'box', a.yellowZone, side, 'yellowZone', 'bg-game-yellow')}
                        ${counter('Rings', 'circle', a.ringZone, side, 'ringZone', 'bg-slate-200')}
                        ${counter('Bot (Up)', 'bot', a.botUpZone, side, 'botUpZone', 'bg-game-red')}
                        ${counter('Summit (Ball)', 'circle', a.ballZone, side, 'ballZone', 'bg-game-tennis')}
                    </div>

                    <div class="mt-4 bg-white p-3 rounded-xl border border-slate-200">
                        <h4 class="text-[9px] font-black uppercase text-red-500 mb-2 flex items-center gap-1.5">
                            <i data-lucide="alert-circle" class="w-3 h-3"></i> Opponent Items (Penalty)
                        </h4>
                        <div class="grid grid-cols-2 gap-2">
                            ${counter('Opp. Pom (Zone)', 'minus-circle', a.pomsZone, side, 'pomsZone', 'bg-game-poms')}
                            ${counter('Opp. Pom (Base)', 'home', a.pomsBase, side, 'pomsBase', 'bg-game-poms')}
                            ${counter('Scrap (Zone)', 'trash-2', a.scrapZone, side, 'scrapZone', 'bg-game-scrap')}
                            ${counter('Scrap (Base)', 'archive', a.scrapBase, side, 'scrapBase', 'bg-game-scrap')}
                        </div>
                        <div class="mt-2">
                             ${counter('Hazard Contact', 'bomb', a.hazard, side, 'hazard', 'bg-orange-500 text-white')}
                        </div>
                    </div>

                    <div class="mt-4 grid grid-cols-3 gap-2">
                        <button onclick="toggleBool('${side}', 'autoWinner')" class="flex flex-col items-center justify-center p-3 rounded-xl border transition-all ${a.autoWinner ? 'bg-amber-500 text-white border-amber-600 shadow-lg' : 'bg-white text-slate-400 border-slate-100'}">
                            <i data-lucide="award" class="w-5 h-5 mb-1"></i>
                            <span class="text-[8px] font-black uppercase">Auto Win</span>
                        </button>
                        <button onclick="toggleBool('${side}', 'ultimate')" class="flex flex-col items-center justify-center p-3 rounded-xl border transition-all ${a.ultimate ? 'bg-indigo-600 text-white border-indigo-700 shadow-lg' : 'bg-white text-slate-400 border-slate-100'}">
                            <i data-lucide="zap" class="w-5 h-5 mb-1"></i>
                            <span class="text-[8px] font-black uppercase">Ultimate</span>
                        </button>
                        <button onclick="toggleBool('${side}', 'pickle')" class="flex flex-col items-center justify-center p-3 rounded-xl border transition-all ${a.pickle ? 'bg-green-500 text-white border-green-600 shadow-lg' : 'bg-white text-slate-400 border-slate-100'}">
                            <i data-lucide="database" class="w-5 h-5 mb-1"></i>
                            <span class="text-[8px] font-black uppercase">Pickle</span>
                        </button>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function counter(label, icon, val, side, key, color) {
            return `
                <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between h-20">
                    <span class="text-[7px] font-black uppercase text-slate-400 tracking-tighter truncate">${label}</span>
                    <div class="flex items-center justify-between">
                        <div class="${color} p-1.5 rounded-lg text-slate-900/40"><i data-lucide="${icon}" class="w-4 h-4"></i></div>
                        <div class="flex items-center gap-1">
                            <button onclick="changeVal('${side}', '${key}', -1)" class="w-7 h-7 flex items-center justify-center bg-slate-50 border rounded-lg active:scale-90">-</button>
                            <span class="w-6 text-center font-black text-sm tabular-nums">${val}</span>
                            <button onclick="changeVal('${side}', '${key}', 1)" class="w-7 h-7 flex items-center justify-center bg-slate-100 border rounded-lg active:scale-90 font-bold">+</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.changeVal = (s, k, d) => { (s === 'red' ? red : blue)[k] = Math.max(0, (s === 'red' ? red : blue)[k] + d); render(); };
        window.toggleBool = (s, k) => { (s === 'red' ? red : blue)[k] = !(s === 'red' ? red : blue)[k]; render(); };
        window.setScout = (s, v) => { (s === 'red' ? red : blue).scout = v; render(); };
        window.addStack = (s, h) => { (s === 'red' ? red : blue).autoStacks.push(h); render(); };
        window.removeStack = (s, i) => { (s === 'red' ? red : blue).autoStacks.splice(i, 1); render(); };

        window.toggleTimer = () => {
            isRunning = !isRunning;
            const btn = document.getElementById('timer-btn');
            if (isRunning) {
                btn.className = "flex items-center gap-2 px-4 py-2 bg-amber-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest";
                btn.innerHTML = `<i data-lucide="pause" class="w-4 h-4"></i><span>Pause</span>`;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft === 105 && phase === 'AUTO') {
                        red.autoLockedScore = calcAuto(red);
                        blue.autoLockedScore = calcAuto(blue);
                        phase = 'TELEOP';
                        document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-blue-600 text-white";
                        document.getElementById('phase-badge').innerText = "TELEOP";
                    }
                    if (timeLeft <= 0) { 
                        clearInterval(timerInterval); 
                        isRunning = false;
                        btn.innerHTML = `<i data-lucide="play" class="w-4 h-4"></i><span>Start</span>`;
                    }
                    const m = Math.floor(timeLeft / 60); const s = timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    render();
                }, 1000);
            } else {
                clearInterval(timerInterval);
                btn.className = "flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest";
                btn.innerHTML = `<i data-lucide="play" class="w-4 h-4"></i><span>Resume</span>`;
            }
            lucide.createIcons();
        };

        window.resetMatch = () => {
            clearInterval(timerInterval);
            timeLeft = 120; isRunning = false; phase = 'AUTO';
            red = getEmptyState(); blue = getEmptyState();
            document.getElementById('timer-display').innerText = "2:00";
            document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse";
            document.getElementById('phase-badge').innerText = "AUTO";
            document.getElementById('timer-btn').className = "flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest";
            document.getElementById('timer-btn').innerHTML = `<i data-lucide="play" class="w-4 h-4"></i><span>Start</span>`;
            lucide.createIcons();
            render();
        };

        window.saveMatch = () => {
            const mNum = document.getElementById('match-number').value;
            const rS = calcTotal(red); const bS = calcTotal(blue);
            matchLog.unshift({ match: mNum, r: rS, b: bS, winner: rS > bS ? 'RED' : rS < bS ? 'BLUE' : 'TIE' });
            renderLog();
            document.getElementById('match-number').value = parseInt(mNum) + 1;
        };

        function renderLog() {
            const container = document.getElementById('match-log');
            if (matchLog.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-20 text-[10px] font-black uppercase italic">No history</div>`;
                return;
            }
            container.innerHTML = matchLog.map(m => `
                <div class="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between shadow-sm border-l-4 ${m.winner === 'RED' ? 'border-l-red-500' : m.winner === 'BLUE' ? 'border-l-blue-500' : 'border-l-slate-400'}">
                    <div class="flex items-center gap-3">
                        <span class="text-[8px] font-black bg-slate-100 px-1.5 py-0.5 rounded">M${m.match}</span>
                        <div class="text-sm font-black tabular-nums">
                            <span class="${m.winner === 'RED' ? 'text-red-600' : 'text-slate-400'}">${m.r}</span> - <span class="${m.winner === 'BLUE' ? 'text-blue-600' : 'text-slate-400'}">${m.b}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => { render(); renderLog(); lucide.createIcons(); };
    </script>
</body>
</html>
