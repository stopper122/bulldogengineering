<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summit Climb Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-select {
            -webkit-user-select: none;
            user-select: none;
        }
        #import-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-800">Summit Climb</h1>
            <div class="text-5xl font-black text-blue-600 mt-2" id="total-score">0</div>
            <p class="text-gray-500 uppercase text-xs tracking-widest font-bold mt-1">Total Points</p>
        </div>

        <!-- Scoring Sections -->
        <div class="space-y-4">
            <!-- Auto High -->
            <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-200">
                <div>
                    <div class="font-bold text-gray-700">Auto High</div>
                    <div class="text-xs text-gray-400">15 pts each</div>
                </div>
                <div class="flex items-center space-x-4 no-select">
                    <button onclick="changeValue('autoHigh', -1)" class="w-10 h-10 rounded-full bg-white border border-gray-300 flex items-center justify-center text-xl font-bold active:bg-gray-200">-</button>
                    <span id="autoHigh-val" class="text-xl font-bold w-6 text-center">0</span>
                    <button onclick="changeValue('autoHigh', 1)" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center text-xl font-bold active:bg-blue-700">+</button>
                </div>
            </div>

            <!-- Auto Low -->
            <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-200">
                <div>
                    <div class="font-bold text-gray-700">Auto Low</div>
                    <div class="text-xs text-gray-400">8 pts each</div>
                </div>
                <div class="flex items-center space-x-4 no-select">
                    <button onclick="changeValue('autoLow', -1)" class="w-10 h-10 rounded-full bg-white border border-gray-300 flex items-center justify-center text-xl font-bold active:bg-gray-200">-</button>
                    <span id="autoLow-val" class="text-xl font-bold w-6 text-center">0</span>
                    <button onclick="changeValue('autoLow', 1)" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center text-xl font-bold active:bg-blue-700">+</button>
                </div>
            </div>

            <!-- Teleop -->
            <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-200">
                <div>
                    <div class="font-bold text-gray-700">Standard</div>
                    <div class="text-xs text-gray-400">5 pts each</div>
                </div>
                <div class="flex items-center space-x-4 no-select">
                    <button onclick="changeValue('teleop', -1)" class="w-10 h-10 rounded-full bg-white border border-gray-300 flex items-center justify-center text-xl font-bold active:bg-gray-200">-</button>
                    <span id="teleop-val" class="text-xl font-bold w-6 text-center">0</span>
                    <button onclick="changeValue('teleop', 1)" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center text-xl font-bold active:bg-blue-700">+</button>
                </div>
            </div>

            <!-- Summit Toggle -->
            <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-200">
                <div>
                    <div class="font-bold text-gray-700">Summit Bonus</div>
                    <div class="text-xs text-gray-400">25 pts</div>
                </div>
                <button id="summit-btn" onclick="toggleValue('summit')" class="px-6 py-2 rounded-full font-bold text-sm transition-colors bg-gray-300 text-gray-600">OFF</button>
            </div>

            <!-- Ultimate Toggle -->
            <div class="flex items-center justify-between p-4 bg-gray-900 rounded-lg border border-gray-700">
                <div>
                    <div class="font-bold text-white italic">ULTIMATE</div>
                    <div class="text-xs text-blue-400">100 pts bonus</div>
                </div>
                <button id="ultimate-btn" onclick="toggleValue('ultimate')" class="px-6 py-2 rounded-full font-bold text-sm transition-colors bg-gray-700 text-gray-400">OFF</button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-100">
            <button onclick="resetData()" class="py-3 px-4 bg-red-50 text-red-600 font-bold rounded-lg active:bg-red-100">Reset</button>
            <button onclick="exportData()" class="py-3 px-4 bg-blue-600 text-white font-bold rounded-lg active:bg-blue-700">Copy Report</button>
            <button onclick="showImportModal()" class="col-span-2 py-2 text-gray-500 text-sm font-medium">Restore from Export</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 bg-black text-white px-6 py-3 rounded-full opacity-0 transition-opacity pointer-events-none text-sm">
        Report copied!
    </div>

    <!-- Import Modal -->
    <div id="import-modal">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-80 max-w-[90vw]">
            <h3 class="font-bold text-lg mb-2 text-gray-800">Restore Data</h3>
            <p class="text-xs text-gray-500 mb-4">Paste the exported report text below:</p>
            <textarea id="import-text" class="w-full h-32 p-3 text-xs border border-gray-200 rounded bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Paste here..."></textarea>
            <div class="flex space-x-2 mt-4">
                <button onclick="hideImportModal()" class="flex-1 py-2 text-gray-500 font-bold">Cancel</button>
                <button onclick="handleImport()" class="flex-1 py-2 bg-blue-600 text-white font-bold rounded">Import</button>
            </div>
        </div>
    </div>

    <script>
        const state = {
            autoHigh: 0,
            autoLow: 0,
            teleop: 0,
            summit: false,
            ultimate: false
        };

        const config = {
            autoHigh: 15,
            autoLow: 8,
            teleop: 5,
            summit: 25,
            ultimate: 100
        };

        function updateUI() {
            document.getElementById('autoHigh-val').textContent = state.autoHigh;
            document.getElementById('autoLow-val').textContent = state.autoLow;
            document.getElementById('teleop-val').textContent = state.teleop;

            const sBtn = document.getElementById('summit-btn');
            sBtn.textContent = state.summit ? 'ON' : 'OFF';
            sBtn.className = `px-6 py-2 rounded-full font-bold text-sm transition-colors ${state.summit ? 'bg-green-500 text-white' : 'bg-gray-300 text-gray-600'}`;

            const uBtn = document.getElementById('ultimate-btn');
            uBtn.textContent = state.ultimate ? 'ON' : 'OFF';
            uBtn.className = `px-6 py-2 rounded-full font-bold text-sm transition-colors ${state.ultimate ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-400'}`;

            const total = (state.autoHigh * config.autoHigh) + 
                          (state.autoLow * config.autoLow) + 
                          (state.teleop * config.teleop) + 
                          (state.summit ? config.summit : 0) + 
                          (state.ultimate ? config.ultimate : 0);
            
            document.getElementById('total-score').textContent = total;
        }

        function changeValue(key, delta) {
            state[key] = Math.max(0, state[key] + delta);
            updateUI();
        }

        function toggleValue(key) {
            state[key] = !state[key];
            updateUI();
        }

        function resetData() {
            state.autoHigh = 0;
            state.autoLow = 0;
            state.teleop = 0;
            state.summit = false;
            state.ultimate = false;
            updateUI();
        }

        function exportData() {
            const report = [
                `AUTO HIGH: ${state.autoHigh}`,
                `AUTO LOW: ${state.autoLow}`,
                `TELEOP: ${state.teleop}`,
                `SUMMIT: ${state.summit ? 'YES' : 'NO'}`,
                `ULTIMATE: ${state.ultimate ? 'YES' : 'NO'}`,
                `TOTAL: ${document.getElementById('total-score').textContent}`
            ].join('\n');

            const el = document.createElement('textarea');
            el.value = report;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            showToast("Report copied to clipboard!");
        }

        function showImportModal() {
            document.getElementById('import-modal').style.display = 'flex';
        }

        function hideImportModal() {
            document.getElementById('import-modal').style.display = 'none';
            document.getElementById('import-text').value = '';
        }

        function handleImport() {
            const text = document.getElementById('import-text').value;
            if(!text) return;

            const ah = text.match(/AUTO HIGH: (\d+)/);
            const al = text.match(/AUTO LOW: (\d+)/);
            const te = text.match(/TELEOP: (\d+)/);
            const su = text.match(/SUMMIT: (YES|NO)/);
            const ul = text.match(/ULTIMATE: (YES|NO)/);

            if(ah) state.autoHigh = parseInt(ah[1]);
            if(al) state.autoLow = parseInt(al[1]);
            if(te) state.teleop = parseInt(te[1]);
            if(su) state.summit = su[1] === 'YES';
            if(ul) state.ultimate = ul[1] === 'YES';

            updateUI();
            hideImportModal();
            showToast("Data restored!");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        updateUI();
    </script>
</body>
</html>
