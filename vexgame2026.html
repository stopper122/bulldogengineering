<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stacker's Summit Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        .text-game-yellow { color: #facc15; }
        .text-game-rocker { color: #22c55e; }
        .text-game-tennis { color: #bef264; }
        .text-game-red { color: #ef4444; }
        .text-game-poms { color: #ec4899; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden select-none">

    <!-- Header -->
    <header class="bg-slate-900 px-4 py-3 shadow-xl flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                <i data-lucide="mountain" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-white font-black italic text-sm uppercase tracking-tighter leading-none">Stacker's Summit</h1>
                <p class="text-[8px] text-slate-400 font-bold tracking-widest uppercase">Official Scorer</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div id="phase-badge" class="px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse">
                AUTO
            </div>
            <div id="timer-display" class="text-white text-3xl font-mono font-black tabular-nums tracking-tighter w-20 text-center">
                2:00
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTimer()" id="timer-btn" class="flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest active:scale-95 transition-transform">
                    <i data-lucide="play" class="w-4 h-4" id="timer-icon"></i>
                    <span id="timer-btn-text">Start</span>
                </button>
                <button onclick="resetMatch()" class="p-2.5 bg-slate-700 text-white rounded-full hover:bg-slate-600 active:rotate-180 transition-all">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Red Alliance Side -->
        <div class="flex-1 flex flex-col border-r border-slate-200">
            <div class="bg-red-600 px-4 py-3 text-white flex justify-between items-center shadow-lg z-10">
                <div>
                    <h2 class="text-[10px] font-black uppercase italic tracking-wider opacity-80">Red Alliance</h2>
                    <div id="red-total" class="text-4xl font-black tabular-nums leading-none">0</div>
                </div>
                <i data-lucide="shield" class="w-8 h-8 opacity-20"></i>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-6 custom-scrollbar bg-red-50/30" id="red-controls">
                <!-- Controls injected by JS -->
            </div>
        </div>

        <!-- Blue Alliance Side -->
        <div class="flex-1 flex flex-col">
            <div class="bg-blue-700 px-4 py-3 text-white flex justify-between items-center shadow-lg z-10">
                <div>
                    <h2 class="text-[10px] font-black uppercase italic tracking-wider opacity-80">Blue Alliance</h2>
                    <div id="blue-total" class="text-4xl font-black tabular-nums leading-none">0</div>
                </div>
                <i data-lucide="shield" class="w-8 h-8 opacity-20"></i>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-6 custom-scrollbar bg-blue-50/30" id="blue-controls">
                <!-- Controls injected by JS -->
            </div>
        </div>

        <!-- Log Toggle Button (Mobile) -->
        <button onclick="toggleLog()" class="absolute bottom-6 right-6 md:right-8 bg-slate-900 text-white p-4 rounded-full shadow-2xl z-50 md:hidden">
            <i data-lucide="history" class="w-6 h-6"></i>
        </button>

        <!-- Right Side Panel (Log & Commit) -->
        <div id="log-panel" class="fixed inset-0 bg-white z-[100] md:relative md:z-0 md:inset-auto md:w-80 border-l border-slate-200 flex flex-col translate-x-full md:translate-x-0 transition-transform duration-300">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 flex items-center gap-2">
                    <i data-lucide="list" class="w-4 h-4"></i> Match Records
                </h2>
                <button onclick="toggleLog()" class="md:hidden p-2 text-slate-400"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar bg-slate-50/50" id="match-log">
                <!-- Logs injected by JS -->
            </div>

            <div class="p-4 bg-white border-t border-slate-100 space-y-3">
                <div class="flex items-center justify-between px-2">
                    <span class="text-[10px] font-black text-slate-400 uppercase">Match Number</span>
                    <input type="number" id="match-number" value="1" class="w-16 bg-slate-100 border-none rounded-lg p-2 text-center font-black text-slate-900">
                </div>
                <button onclick="saveMatch()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl active:scale-95 transition-transform flex items-center justify-center gap-3">
                    <i data-lucide="save" class="w-5 h-5 text-emerald-400"></i> Commit Result
                </button>
            </div>
        </div>
    </main>

    <script>
        let timeLeft = 120;
        let isRunning = false;
        let phase = 'AUTO';
        let timerInterval;
        let matchLog = [];

        const getEmptyState = () => ({
            autoYellow: 0, autoRing: 0, autoRocker: 0, autoBall: 0, autoBotUp: 0, autoBotTip: 0,
            scoutLevel: 0,
            autoLockedPoints: 0,
            zoneYellow: 0, zoneRing: 0, zoneRocker: 0, zoneBall: 0, zoneBotUp: 0, zoneBotTip: 0,
            baseYellow: 0, baseRing: 0, baseRocker: 0, baseBall: 0, baseBotUp: 0, baseBotTip: 0,
            pomsZone: 0, pomsBase: 0, scrapZone: 0, scrapBase: 0, hazardContact: 0,
            autoWinner: false,
            ultimateStack: false
        });

        let red = getEmptyState();
        let blue = getEmptyState();

        function calculateAutoPoints(alliance) {
            let pts = 0;
            pts += (alliance.autoYellow * 10) * 2;
            pts += (alliance.autoRing * 10) * 2;
            pts += (alliance.autoRocker * 20 * 2) + (alliance.autoRocker * 50);
            pts += (alliance.autoBall * 20 * 2) + (alliance.autoBall * 50);
            pts += (alliance.autoBotUp * 30 * 2);
            pts += (alliance.autoBotTip * 15 * 2);
            if (alliance.scoutLevel === 1) pts += 10;
            if (alliance.scoutLevel === 2) pts += 25;
            return pts;
        }

        function calculateTotal(alliance) {
            if (phase === 'AUTO') return calculateAutoPoints(alliance);
            let pts = alliance.autoLockedPoints;
            pts += (alliance.zoneYellow + alliance.zoneRing + alliance.zoneRocker + alliance.zoneBall) * 2;
            pts += (alliance.zoneBotUp * 10) + (alliance.zoneBotTip * 5);
            pts += (alliance.baseYellow + alliance.baseRing + alliance.baseRocker + alliance.baseBall) * 10;
            pts += (alliance.baseBotUp * 30) + (alliance.baseBotTip * 15);
            if (alliance.autoWinner) pts += 50;
            if (alliance.ultimateStack) pts += 100;
            pts -= (alliance.pomsZone * 2);
            pts -= (alliance.pomsBase * 10);
            pts -= (alliance.scrapZone * 2); // Rule: -2 in zone
            pts -= (alliance.scrapBase * 10); // Rule: -10 in base
            pts -= (alliance.hazardContact * 15);
            return Math.max(0, pts);
        }

        function render() {
            document.getElementById('red-total').innerText = calculateTotal(red);
            document.getElementById('blue-total').innerText = calculateTotal(blue);
            renderAlliance(red, 'red');
            renderAlliance(blue, 'blue');
        }

        function renderAlliance(a, side) {
            const container = document.getElementById(`${side}-controls`);
            if (phase === 'AUTO') {
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        ${counter('Yellow Cube', 'package', a.autoYellow, side, 'autoYellow', 'text-game-yellow')}
                        ${counter('Scoring Ring', 'circle', a.autoRing, side, 'autoRing', 'text-slate-400')}
                        ${counter('Rocker Base', 'layers', a.autoRocker, side, 'autoRocker', 'text-game-rocker')}
                        ${counter('Summit Ball', 'target', a.autoBall, side, 'autoBall', 'text-game-tennis')}
                        ${counter('Robot Upright', 'arrow-up-circle', a.autoBotUp, side, 'autoBotUp', 'text-game-red')}
                        ${counter('Robot Tipped', 'rotate-cw', a.autoBotTip, side, 'autoBotTip', 'text-slate-400')}
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <label class="text-[10px] font-black uppercase text-slate-400 block mb-3">Autonomous Scouting</label>
                        <div class="flex gap-2">
                            ${['NONE', 'LVL 1', 'LVL 2'].map((l, i) => `
                                <button onclick="setScout('${side}', ${i})" class="flex-1 py-3 rounded-xl font-black text-[10px] border-2 transition-all ${a.scoutLevel === i ? 'bg-slate-900 border-slate-900 text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400'}">${l}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="space-y-6">
                        <section>
                            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <i data-lucide="map-pin" class="w-3 h-3"></i> Scoring Zone (2pts)
                            </h3>
                            <div class="grid grid-cols-2 gap-3">
                                ${counter('Cubes', 'package', a.zoneYellow, side, 'zoneYellow', 'text-game-yellow')}
                                ${counter('Rings', 'circle', a.zoneRing, side, 'zoneRing', 'text-slate-400')}
                                ${counter('Rockers', 'layers', a.zoneRocker, side, 'zoneRocker', 'text-game-rocker')}
                                ${counter('Balls', 'target', a.zoneBall, side, 'zoneBall', 'text-game-tennis')}
                            </div>
                        </section>
                        <section>
                            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <i data-lucide="home" class="w-3 h-3"></i> Home Base (10pts)
                            </h3>
                            <div class="grid grid-cols-2 gap-3">
                                ${counter('Cubes', 'package', a.baseYellow, side, 'baseYellow', 'text-game-yellow')}
                                ${counter('Rings', 'circle', a.baseRing, side, 'baseRing', 'text-slate-400')}
                                ${counter('Rockers', 'layers', a.baseRocker, side, 'baseRocker', 'text-game-rocker')}
                                ${counter('Balls', 'target', a.baseBall, side, 'baseBall', 'text-game-tennis')}
                            </div>
                        </section>
                        <section>
                            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <i data-lucide="bot" class="w-3 h-3"></i> Robot Status
                            </h3>
                            <div class="grid grid-cols-2 gap-3">
                                ${counter('Up (Z)', 'arrow-up-circle', a.zoneBotUp, side, 'zoneBotUp', 'text-game-red')}
                                ${counter('Up (HB)', 'home', a.baseBotUp, side, 'baseBotUp', 'text-game-red')}
                                ${counter('Tipped (Z)', 'rotate-cw', a.zoneBotTip, side, 'zoneBotTip', 'text-slate-400')}
                                ${counter('Tipped (HB)', 'home', a.baseBotTip, side, 'baseBotTip', 'text-slate-400')}
                            </div>
                        </section>
                        <section class="bg-red-50/50 p-4 rounded-2xl border border-red-100">
                            <h3 class="text-[10px] font-black text-red-400 uppercase tracking-widest mb-3">Penalties & Hazards</h3>
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                ${counter('Opp. Pom (Z)', 'minus-circle', a.pomsZone, side, 'pomsZone', 'text-game-poms')}
                                ${counter('Opp. Pom (HB)', 'minus-circle', a.pomsBase, side, 'pomsBase', 'text-game-poms')}
                                ${counter('Scrap (Z)', 'trash-2', a.scrapZone, side, 'scrapZone', 'text-slate-600')}
                                ${counter('Scrap (HB)', 'trash-2', a.scrapBase, side, 'scrapBase', 'text-slate-800')}
                            </div>
                            ${counter('Hazard Contact', 'zap-off', a.hazardContact, side, 'hazardContact', 'text-orange-600')}
                        </section>
                        <section class="grid grid-cols-2 gap-3 pb-8">
                            <button onclick="toggleState('${side}', 'autoWinner')" class="flex flex-col items-center gap-2 p-4 rounded-2xl border-2 transition-all ${a.autoWinner ? 'bg-amber-500 border-amber-500 text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400'}">
                                <i data-lucide="award" class="w-6 h-6"></i>
                                <span class="text-[10px] font-black uppercase">Auto Winner</span>
                            </button>
                            <button onclick="toggleState('${side}', 'ultimateStack')" class="flex flex-col items-center gap-2 p-4 rounded-2xl border-2 transition-all ${a.ultimateStack ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400'}">
                                <i data-lucide="zap" class="w-6 h-6"></i>
                                <span class="text-[10px] font-black uppercase">Ultimate</span>
                            </button>
                        </section>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function counter(label, icon, value, side, key, colorClass) {
            return `
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between h-24">
                    <div class="flex items-center justify-between">
                        <i data-lucide="${icon}" class="w-4 h-4 ${colorClass}"></i>
                        <span class="text-[10px] font-black tabular-nums ${value > 0 ? 'text-slate-900' : 'text-slate-300'}">${value}</span>
                    </div>
                    <span class="text-[9px] font-black uppercase text-slate-400 truncate tracking-tighter">${label}</span>
                    <div class="flex items-center gap-1 mt-1">
                        <button onclick="updateValue('${side}', '${key}', -1)" class="flex-1 bg-slate-50 hover:bg-slate-100 p-2 rounded-lg transition-colors"><i data-lucide="minus" class="w-3 h-3 mx-auto"></i></button>
                        <button onclick="updateValue('${side}', '${key}', 1)" class="flex-1 bg-slate-100 hover:bg-slate-200 p-2 rounded-lg transition-colors"><i data-lucide="plus" class="w-3 h-3 mx-auto"></i></button>
                    </div>
                </div>
            `;
        }

        window.updateValue = (side, key, delta) => {
            const alliance = (side === 'red' ? red : blue);
            alliance[key] = Math.max(0, alliance[key] + delta);
            render();
        };

        window.toggleState = (side, key) => {
            const alliance = (side === 'red' ? red : blue);
            alliance[key] = !alliance[key];
            render();
        };

        window.setScout = (side, level) => {
            const alliance = (side === 'red' ? red : blue);
            alliance.scoutLevel = level;
            render();
        };

        window.toggleTimer = () => {
            isRunning = !isRunning;
            const btn = document.getElementById('timer-btn');
            const btnText = document.getElementById('timer-btn-text');
            if (isRunning) {
                btn.classList.replace('bg-green-500', 'bg-amber-500');
                btnText.innerText = "Pause";
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft === 105 && phase === 'AUTO') {
                        red.autoLockedPoints = calculateAutoPoints(red);
                        blue.autoLockedPoints = calculateAutoPoints(blue);
                        phase = 'TELEOP';
                        document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-blue-600 text-white";
                        document.getElementById('phase-badge').innerText = "TELEOP";
                    }
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                    }
                    updateTimerUI();
                    render();
                }, 1000);
            } else {
                btn.classList.replace('bg-amber-500', 'bg-green-500');
                btnText.innerText = "Resume";
                clearInterval(timerInterval);
            }
        };

        function updateTimerUI() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        window.resetMatch = () => {
            if (!confirm("Reset match? This will clear all current scores.")) return;
            clearInterval(timerInterval);
            timeLeft = 120;
            isRunning = false;
            phase = 'AUTO';
            red = getEmptyState();
            blue = getEmptyState();
            updateTimerUI();
            document.getElementById('phase-badge').innerText = "AUTO";
            document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse";
            document.getElementById('timer-btn').classList.replace('bg-amber-500', 'bg-green-500');
            document.getElementById('timer-btn-text').innerText = "Start";
            render();
        };

        window.saveMatch = () => {
            const matchNum = document.getElementById('match-number').value;
            const rScore = calculateTotal(red);
            const bScore = calculateTotal(blue);
            const winner = rScore > bScore ? 'RED' : bScore > rScore ? 'BLUE' : 'TIE';
            matchLog.unshift({ match: matchNum, redScore: rScore, blueScore: bScore, winner });
            renderLog();
            document.getElementById('match-number').value = parseInt(matchNum) + 1;
        };

        function renderLog() {
            const container = document.getElementById('match-log');
            if (matchLog.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-30 text-[10px] font-black uppercase italic">No Matches Recorded</div>`;
                return;
            }
            container.innerHTML = matchLog.map(m => `
                <div class="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between shadow-sm border-l-4 ${m.winner === 'RED' ? 'border-l-red-500' : m.winner === 'BLUE' ? 'border-l-blue-500' : 'border-l-slate-400'}">
                    <div class="flex items-center gap-3">
                        <div class="text-[8px] font-black bg-slate-100 px-2 py-1 rounded">#${m.match}</div>
                        <div class="font-black tabular-nums text-sm">
                            <span class="${m.winner === 'RED' ? 'text-red-600' : 'text-slate-500'}">${m.redScore}</span> 
                            <span class="text-slate-300 mx-1">-</span> 
                            <span class="${m.winner === 'BLUE' ? 'text-blue-600' : 'text-slate-500'}">${m.blueScore}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.toggleLog = () => document.getElementById('log-panel').classList.toggle('translate-x-full');
        window.onload = () => { render(); renderLog(); lucide.createIcons(); };
    </script>
</body>
</html>
