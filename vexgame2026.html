<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stacker's Summit Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        .text-game-yellow { color: #facc15; }
        .text-game-rocker { color: #22c55e; }
        .text-game-tennis { color: #bef264; }
        .text-game-pickle { color: #16a34a; }
        .text-game-botguy { color: #ef4444; }
        .text-game-scrap { color: #64748b; }

        .bullseye-icon {
            display: inline-block; width: 14px; height: 14px; border-radius: 50%;
            background: radial-gradient(circle, #facc15 20%, #ef4444 21%, #ef4444 50%, #3b82f6 51%, #3b82f6 100%);
        }
        
        .active-btn { transform: scale(0.95); transition: transform 0.1s; }
        .timer-warning { color: #ef4444; animation: pulse 0.5s infinite; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- Header -->
    <header class="bg-slate-900 px-4 py-3 shadow-xl flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                <i data-lucide="mountain" class="w-5 h-5"></i>
            </div>
            <div class="hidden sm:block">
                <h1 class="text-white font-black italic text-lg leading-none uppercase tracking-tighter">Stacker's Summit</h1>
                <span class="text-blue-400 text-[8px] font-bold tracking-[0.3em] uppercase opacity-70">Audible Countdown Enabled</span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Audio Toggle -->
            <button onclick="toggleMute()" id="mute-btn" class="p-2 bg-slate-800 text-slate-400 rounded-lg hover:text-white transition-colors">
                <i data-lucide="volume-2" class="w-4 h-4"></i>
            </button>

            <div class="flex flex-col items-center">
                <span class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Match</span>
                <input type="number" id="match-number" value="1" class="w-12 bg-slate-800 border border-slate-700 text-white font-black py-0.5 rounded text-center outline-none focus:border-blue-500">
            </div>
            <div id="phase-badge" class="px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse">
                AUTO
            </div>
            <div id="timer-display" class="text-white text-3xl font-mono font-black tabular-nums tracking-tighter w-20 text-center">
                2:00
            </div>
            <div class="flex gap-1.5">
                <button onclick="toggleTimer()" id="timer-btn" class="p-2.5 bg-green-500 text-white rounded-full shadow-lg active:scale-90 transition-all">
                    <i data-lucide="play" class="w-5 h-5"></i>
                </button>
                <button onclick="resetMatch()" class="p-2.5 bg-slate-700 text-white rounded-full hover:bg-slate-600 active:rotate-180 transition-all">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row p-2 gap-2 overflow-hidden">
        
        <!-- Red Alliance -->
        <div class="flex-1 flex flex-col rounded-2xl border-2 border-red-200 bg-red-50 overflow-hidden shadow-sm">
            <div class="bg-red-600 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-sm font-black uppercase italic tracking-wider">Red</h2>
                <div id="red-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-4 custom-scrollbar" id="red-controls"></div>
        </div>

        <!-- Blue Alliance -->
        <div class="flex-1 flex flex-col rounded-2xl border-2 border-blue-200 bg-blue-50 overflow-hidden shadow-sm">
            <div class="bg-blue-700 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-sm font-black uppercase italic tracking-wider">Blue</h2>
                <div id="blue-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-4 custom-scrollbar" id="blue-controls"></div>
        </div>

        <!-- Sidebar / Match Log -->
        <div class="w-full md:w-72 flex flex-col rounded-2xl border-2 border-slate-200 bg-white overflow-hidden shadow-sm">
            <div class="bg-slate-800 p-3 text-white flex justify-between items-center">
                <h2 class="text-[10px] font-black uppercase tracking-widest flex items-center gap-2">
                    <i data-lucide="list" class="w-3 h-3"></i> Match Log
                </h2>
                <div class="flex gap-1">
                    <button onclick="importJSON()" class="p-1.5 bg-slate-700 hover:bg-slate-600 rounded text-[10px]">
                        <i data-lucide="upload" class="w-3 h-3"></i>
                    </button>
                    <button onclick="exportFullJSON()" class="p-1.5 bg-blue-600 hover:bg-blue-500 rounded text-[10px] font-bold uppercase flex items-center gap-1">
                        <i data-lucide="download" class="w-3 h-3"></i> Backup
                    </button>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-2 custom-scrollbar space-y-2 bg-slate-50" id="match-log"></div>

            <div class="p-2 border-t border-slate-100 bg-white">
                <button id="save-btn" onclick="saveMatch()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black uppercase tracking-widest text-[10px] shadow-lg active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Commit Result
                </button>
            </div>
        </div>
    </main>

    <!-- Overlay -->
    <div id="overlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl text-center max-w-sm w-full border-4 border-blue-500/20">
            <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="mountain" class="w-10 h-10"></i>
            </div>
            <h3 class="text-3xl font-black text-slate-900 mb-2 italic uppercase tracking-tighter">New Match</h3>
            <p class="text-slate-400 text-[10px] font-bold mb-8 uppercase tracking-[0.2em]">Ready for 30s Autonomous Phase</p>
            <button onclick="toggleTimer()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-blue-500/30 uppercase tracking-widest text-sm hover:bg-blue-500 transition-colors">
                Start Scoring
            </button>
        </div>
    </div>

    <!-- Hidden input for JSON import -->
    <input type="file" id="import-file" class="hidden" accept=".json">

    <script>
        // Audio Logic
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = false;

        function playSound(freq, duration, type = 'sine', volume = 0.1) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playBuzzer(duration) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(100, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);
            
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        window.toggleMute = () => {
            isMuted = !isMuted;
            const btn = document.getElementById('mute-btn');
            btn.innerHTML = isMuted ? `<i data-lucide="volume-x"></i>` : `<i data-lucide="volume-2"></i>`;
            btn.classList.toggle('text-red-500', isMuted);
            btn.classList.toggle('text-slate-400', !isMuted);
            lucide.createIcons();
        };

        // State & Timing Logic
        let timeLeft = 120;
        let isRunning = false;
        let phase = 'AUTO';
        let timerInterval;
        let matchLog = [];
        let autoOverride = false;

        const initialState = () => ({
            yellowBase: 0, ringBase: 0, botguyUpBase: 0, botguyTipBase: 0, ballBase: 0, rockerBase: 0,
            scout: 0, autoStacks: [],
            yellowZone: 0, ringZone: 0, botguyUpZone: 0, botguyTipZone: 0, ballZone: 0,
            scrapZone: 0, scrapBase: 0, hazard: 0,
            pickle: false, ultimate: false, autoWinner: false,
            autoLockedScore: 0
        });

        let red = initialState();
        let blue = initialState();

        function calculateAuto(alliance) {
            let total = 0;
            let baseScore = (alliance.yellowBase + alliance.ringBase) * 10;
            baseScore += (alliance.ballBase + alliance.rockerBase) * 20;
            baseScore += (alliance.botguyUpBase * 30) + (alliance.botguyTipBase * 15);

            let stackBonus = 0;
            if (alliance.autoStacks.length > 0) {
                const itemCount = alliance.yellowBase + alliance.ringBase + alliance.ballBase + alliance.rockerBase + alliance.botguyUpBase + alliance.botguyTipBase;
                const avgVal = itemCount > 0 ? baseScore / itemCount : 0;
                alliance.autoStacks.forEach(h => {
                    let mult = h === 2 ? 3 : h === 3 ? 4 : 5;
                    stackBonus += (avgVal * h * mult * 2) - (avgVal * h); 
                });
            }

            total += (baseScore * 2) + stackBonus;
            total += (alliance.ballBase + alliance.rockerBase) * 50;
            total += alliance.scout === 1 ? 10 : alliance.scout === 2 ? 25 : 0;
            return Math.max(0, Math.round(total));
        }

        function calculate(alliance) {
            if (phase === 'AUTO') return calculateAuto(alliance);
            let total = alliance.autoLockedScore;
            total += (alliance.yellowZone + alliance.ringZone) * 2;
            total += (alliance.botguyUpZone * 10) + (alliance.botguyTipZone * 5);
            total += (alliance.ballZone * 5);
            if (alliance.ultimate) total += 100;
            if (alliance.autoWinner) total += 50;
            if (alliance.pickle) total += 100;
            if (!alliance.pickle) {
                total -= (alliance.scrapZone * 2);
                total -= (alliance.scrapBase * 10);
            }
            total -= (alliance.hazard * 15);
            return Math.max(0, Math.round(total));
        }

        function renderControls(alliance, side) {
            const container = document.getElementById(`${side}-controls`);
            const isAutoActive = phase === 'AUTO' || autoOverride;
            
            container.innerHTML = `
                <div class="space-y-3 p-3 bg-white rounded-xl border-2 ${autoOverride ? 'border-blue-400 ring-2 ring-blue-100' : 'border-slate-100 shadow-sm'}">
                    <h3 class="text-[9px] font-black text-slate-400 uppercase flex items-center justify-between">
                        <span class="flex items-center gap-1.5"><i data-lucide="cpu" class="w-3 h-3 text-amber-500"></i> Autonomous</span>
                        <div class="flex gap-2 items-center">
                            ${phase === 'TELEOP' ? `
                                <button onclick="toggleAutoOverride()" class="px-2 py-0.5 rounded bg-blue-600 text-white text-[7px] font-bold active:scale-95">
                                    ${autoOverride ? 'LOCK CHANGES' : 'CORRECT AUTO'}
                                </button>
                            ` : ''}
                        </div>
                    </h3>
                    
                    <div class="grid grid-cols-2 gap-1.5 ${!isAutoActive ? 'pointer-events-none opacity-50' : ''}">
                        ${renderCounter('Cubes', 'box', alliance.yellowBase, side, 'yellowBase', 'text-game-yellow')}
                        ${renderCounter('Rings', 'bullseye', alliance.ringBase, side, 'ringBase')}
                        ${renderCounter('Rocker', 'layers', alliance.rockerBase, side, 'rockerBase', 'text-game-rocker')}
                        ${renderCounter('Summit', 'circle', alliance.ballBase, side, 'ballBase', 'text-game-tennis')}
                        ${renderCounter('Bot (Up)', 'bot', alliance.botguyUpBase, side, 'botguyUpBase', 'text-game-botguy')}
                        ${renderCounter('Bot (Tip)', 'trending-down', alliance.botguyTipBase, side, 'botguyTipBase', 'text-game-botguy opacity-40')}
                    </div>

                    <div class="flex gap-1 ${!isAutoActive ? 'pointer-events-none opacity-50' : ''}">
                        <button onclick="setScout('${side}', 0)" class="flex-1 py-1 rounded text-[8px] font-black border ${alliance.scout === 0 ? 'bg-slate-900 text-white' : 'bg-white text-slate-400'}">OFF</button>
                        <button onclick="setScout('${side}', 1)" class="flex-1 py-1 rounded text-[8px] font-black border ${alliance.scout === 1 ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-400'}">N-ZONE</button>
                        <button onclick="setScout('${side}', 2)" class="flex-1 py-1 rounded text-[8px] font-black border ${alliance.scout === 2 ? 'bg-red-500 text-white border-red-600' : 'bg-white text-slate-400'}">O-ZONE</button>
                    </div>

                    <div class="p-2 bg-slate-50 rounded-lg border border-dashed border-slate-200 ${!isAutoActive ? 'pointer-events-none opacity-50' : ''}">
                        <div class="flex justify-between items-center mb-1.5">
                            <span class="text-[8px] font-black text-slate-400 uppercase">Auto Stacks</span>
                            <div class="flex gap-1">
                                <button onclick="addStack('${side}', 2)" class="px-2 py-0.5 bg-slate-800 text-white text-[8px] rounded">2T</button>
                                <button onclick="addStack('${side}', 3)" class="px-2 py-0.5 bg-slate-800 text-white text-[8px] rounded">3T</button>
                                <button onclick="addStack('${side}', 4)" class="px-2 py-0.5 bg-slate-800 text-white text-[8px] rounded">4T</button>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-1">
                            ${alliance.autoStacks.map((s, i) => `<div class="bg-white px-1.5 py-0.5 rounded text-[9px] font-bold border flex items-center gap-1">${s}T <i data-lucide="x" class="w-2.5 h-2.5 text-red-500 cursor-pointer" onclick="removeStack('${side}', ${i})"></i></div>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="space-y-3 p-3 bg-white rounded-xl border border-slate-100 shadow-sm ${phase === 'AUTO' && !autoOverride ? 'opacity-30 pointer-events-none' : ''}">
                    <h3 class="text-[9px] font-black text-slate-400 uppercase flex items-center gap-1.5">
                        <i data-lucide="gamepad-2" class="w-3 h-3 text-blue-500"></i> Teleop Controls
                    </h3>
                    <div class="grid grid-cols-2 gap-1.5">
                        ${renderCounter('Cubes (Z)', 'square', alliance.yellowZone, side, 'yellowZone', 'text-game-yellow')}
                        ${renderCounter('Rings (Z)', 'bullseye', alliance.ringZone, side, 'ringZone')}
                        ${renderCounter('Bot (Z)', 'smile', alliance.botguyUpZone, side, 'botguyUpZone', 'text-game-botguy')}
                        ${renderCounter('Scrap (Z)', 'trash-2', alliance.scrapZone, side, 'scrapZone', 'text-game-scrap')}
                    </div>
                    
                    <div class="grid grid-cols-3 gap-1.5">
                         <button onclick="toggleBool('${side}', 'autoWinner')" class="flex flex-col items-center p-1.5 rounded-lg border ${alliance.autoWinner ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-400 border-slate-200'}">
                            <i data-lucide="award" class="w-3.5 h-3.5 mb-0.5"></i><span class="text-[7px] font-black uppercase">Win</span>
                        </button>
                        <button onclick="toggleBool('${side}', 'ultimate')" class="flex flex-col items-center p-1.5 rounded-lg border ${alliance.ultimate ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-slate-400 border-slate-200'}">
                            <i data-lucide="zap" class="w-3.5 h-3.5 mb-0.5"></i><span class="text-[7px] font-black uppercase">Ult</span>
                        </button>
                        <button onclick="toggleBool('${side}', 'pickle')" class="flex flex-col items-center p-1.5 rounded-lg border ${alliance.pickle ? 'bg-green-500 text-white border-green-600' : 'bg-white text-slate-400 border-slate-200'}">
                            <i data-lucide="database" class="w-3.5 h-3.5 mb-0.5"></i><span class="text-[7px] font-black uppercase">Pickle</span>
                        </button>
                    </div>

                    <div class="bg-red-50 p-2 rounded-lg border border-red-100">
                        ${renderCounter('Penalty (Sets)', 'bomb', alliance.hazard, side, 'hazard', 'text-red-500')}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderCounter(label, icon, val, side, key, iconColorClass = 'text-slate-400') {
            let iconHtml = `<i data-lucide="${icon}" class="w-3 h-3 ${iconColorClass} shrink-0 fill-current"></i>`;
            if (icon === 'bullseye') iconHtml = `<span class="bullseye-icon shrink-0"></span>`;

            return `
                <div class="flex items-center justify-between p-1.5 bg-white rounded shadow-sm border border-slate-100">
                    <span class="text-[8px] font-bold text-slate-500 uppercase truncate mr-1">${label}</span>
                    <div class="flex items-center gap-1">
                        <button onclick="changeVal('${side}', '${key}', -1)" class="p-0.5 hover:bg-slate-100 rounded text-slate-300 active:scale-75"><i data-lucide="minus" class="w-2.5 h-2.5"></i></button>
                        <span class="text-[10px] font-black w-3 text-center tabular-nums">${val}</span>
                        <button onclick="changeVal('${side}', '${key}', 1)" class="p-0.5 hover:bg-slate-100 rounded text-slate-900 active:scale-75"><i data-lucide="plus" class="w-2.5 h-2.5"></i></button>
                    </div>
                </div>
            `;
        }

        function update() {
            if (autoOverride) {
                red.autoLockedScore = calculateAuto(red);
                blue.autoLockedScore = calculateAuto(blue);
            }
            document.getElementById('red-total').innerText = calculate(red);
            document.getElementById('blue-total').innerText = calculate(blue);
            renderControls(red, 'red');
            renderControls(blue, 'blue');
        }

        window.toggleAutoOverride = () => { autoOverride = !autoOverride; update(); }
        window.changeVal = (side, key, delta) => {
            const obj = side === 'red' ? red : blue;
            obj[key] = Math.max(0, obj[key] + delta);
            update();
        };
        window.toggleBool = (side, key) => {
            const obj = side === 'red' ? red : blue;
            obj[key] = !obj[key];
            update();
        };
        window.setScout = (side, val) => {
            const obj = side === 'red' ? red : blue;
            obj.scout = val;
            update();
        };
        window.addStack = (side, h) => {
            const obj = side === 'red' ? red : blue;
            obj.autoStacks.push(h);
            update();
        };
        window.removeStack = (side, i) => {
            const obj = side === 'red' ? red : blue;
            obj.autoStacks.splice(i, 1);
            update();
        };

        window.toggleTimer = () => {
            isRunning = !isRunning;
            document.getElementById('timer-btn').innerHTML = isRunning ? `<i data-lucide="pause"></i>` : `<i data-lucide="play"></i>`;
            document.getElementById('overlay').classList.add('hidden');
            lucide.createIcons();
            
            if (isRunning) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                timerInterval = setInterval(() => {
                    timeLeft--;

                    // Sound Logic
                    // End of Auto Countdown (starts at 35s remaining, which is 5s before Auto ends)
                    if (timeLeft > 90 && timeLeft <= 95) {
                        playSound(660, 0.1, 'sine', 0.15);
                    }
                    if (timeLeft === 90) {
                        playSound(880, 0.5, 'sine', 0.2); // Auto End chime
                        red.autoLockedScore = calculateAuto(red);
                        blue.autoLockedScore = calculateAuto(blue);
                        phase = 'TELEOP';
                        document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-blue-600 text-white";
                        document.getElementById('phase-badge').innerText = "TELEOP";
                        document.getElementById('timer-display').classList.remove('timer-warning');
                    }

                    // End of Match Countdown (5s before 0)
                    if (timeLeft > 0 && timeLeft <= 5) {
                        playSound(440, 0.1, 'sine', 0.15);
                        document.getElementById('timer-display').classList.add('timer-warning');
                    }
                    if (timeLeft === 0) {
                        playBuzzer(1.5);
                        clearInterval(timerInterval);
                        isRunning = false;
                        timeLeft = 0;
                        document.getElementById('timer-btn').innerHTML = `<i data-lucide="play"></i>`;
                        lucide.createIcons();
                    }

                    const m = Math.floor(timeLeft / 60);
                    const s = timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    update();
                }, 1000);
            } else {
                clearInterval(timerInterval);
            }
        };

        window.resetMatch = () => {
            clearInterval(timerInterval);
            timeLeft = 120;
            isRunning = false;
            phase = 'AUTO';
            autoOverride = false;
            red = initialState();
            blue = initialState();
            document.getElementById('timer-display').innerText = "2:00";
            document.getElementById('timer-display').classList.remove('timer-warning');
            document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse";
            document.getElementById('phase-badge').innerText = "AUTO";
            document.getElementById('overlay').classList.remove('hidden');
            update();
        };

        window.saveMatch = () => {
            const matchNum = document.getElementById('match-number').value;
            const rScore = calculate(red);
            const bScore = calculate(blue);
            
            const snapshot = {
                match: matchNum,
                timestamp: new Date().toLocaleTimeString(),
                redScore: rScore,
                blueScore: bScore,
                winner: rScore > bScore ? 'RED' : rScore < bScore ? 'BLUE' : 'DRAW',
                redState: JSON.parse(JSON.stringify(red)),
                blueState: JSON.parse(JSON.stringify(blue)),
                phase: phase
            };

            matchLog.unshift(snapshot);
            renderLog();
            document.getElementById('match-number').value = parseInt(matchNum) + 1;
        };

        function renderLog() {
            const container = document.getElementById('match-log');
            if (matchLog.length === 0) {
                container.innerHTML = `<div class="text-center py-8 opacity-20 text-[10px] font-black uppercase italic">No Data</div>`;
                return;
            }
            container.innerHTML = matchLog.map((m, idx) => `
                <div class="p-2.5 bg-white border border-slate-200 rounded-lg shadow-sm">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-[8px] font-black bg-slate-800 text-white px-1.5 py-0.5 rounded">M${m.match}</span>
                            <span class="text-[8px] font-bold text-slate-400 tabular-nums">${m.timestamp}</span>
                        </div>
                        <button onclick="restoreMatch(${idx})" class="text-[8px] font-black text-blue-600 hover:underline uppercase">Restore</button>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="font-black text-lg italic tabular-nums">
                            <span class="${m.winner === 'RED' ? 'text-red-600 underline' : 'text-slate-400'}">${m.redScore}</span> 
                            <span class="text-slate-200 mx-1">-</span> 
                            <span class="${m.winner === 'BLUE' ? 'text-blue-600 underline' : 'text-slate-400'}">${m.blueScore}</span>
                        </div>
                        <div class="text-[7px] font-black uppercase tracking-tighter ${m.winner === 'RED' ? 'text-red-500' : m.winner === 'BLUE' ? 'text-blue-500' : 'text-slate-400'}">${m.winner} WINNER</div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.restoreMatch = (idx) => {
            const data = matchLog[idx];
            if (!data) return;
            
            if (!confirm(`Restore Match ${data.match}? This will replace current unsaved progress.`)) return;

            red = JSON.parse(JSON.stringify(data.redState));
            blue = JSON.parse(JSON.stringify(data.blueState));
            phase = data.phase || 'TELEOP';
            
            document.getElementById('match-number').value = data.match;
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('phase-badge').innerText = phase;
            document.getElementById('phase-badge').className = phase === 'AUTO' 
                ? "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse"
                : "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-blue-600 text-white";
            
            update();
        };

        window.exportFullJSON = () => {
            const exportData = {
                exportedAt: new Date().toISOString(),
                matches: matchLog
            };
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `vex_summit_backup_${new Date().getTime()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        };

        window.importJSON = () => {
            document.getElementById('import-file').click();
        };

        document.getElementById('import-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.matches && Array.isArray(data.matches)) {
                        matchLog = data.matches;
                        renderLog();
                    } else {
                        alert("Invalid backup file format.");
                    }
                } catch(err) {
                    alert("Error parsing backup file.");
                }
            };
            reader.readAsText(file);
        });

        window.onload = () => {
            update();
            renderLog();
            lucide.createIcons();
        };
    </script>
</body>
</html>
