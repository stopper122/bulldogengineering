<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stacker's Summit Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        /* Game Colors */
        .bg-game-yellow { background-color: #facc15; }
        .bg-game-green { background-color: #22c55e; }
        .bg-game-tennis { background-color: #bef264; }
        .bg-game-red { background-color: #ef4444; }
        .bg-game-scrap { background-color: #64748b; }
        .bg-game-poms { background-color: #ec4899; } /* Pink for Poms */
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- Header -->
    <header class="bg-slate-900 px-4 py-3 shadow-xl flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                <i data-lucide="mountain" class="w-5 h-5"></i>
            </div>
            <h1 class="text-white font-black italic text-lg uppercase tracking-tighter hidden sm:block">Stacker's Summit</h1>
        </div>

        <div class="flex items-center gap-4">
            <button onclick="swapDisplay()" class="p-2 bg-slate-800 text-slate-400 rounded-lg hover:text-white transition-colors">
                <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
            </button>

            <div class="flex flex-col items-center">
                <span class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Match</span>
                <input type="number" id="match-number" value="1" class="w-12 bg-slate-800 border border-slate-700 text-white font-black py-0.5 rounded text-center outline-none focus:border-blue-500">
            </div>
            
            <div id="phase-badge" class="px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse">
                AUTO
            </div>

            <div id="timer-display" class="text-white text-3xl font-mono font-black tabular-nums tracking-tighter w-20 text-center">
                2:00
            </div>

            <div class="flex gap-2">
                <button onclick="toggleTimer()" id="timer-btn" class="flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    <span id="timer-btn-text">Start</span>
                </button>
                <button onclick="resetMatch()" class="p-2.5 bg-slate-700 text-white rounded-full hover:bg-slate-600 transition-colors">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="game-container" class="flex-1 flex flex-col md:flex-row p-2 gap-2 overflow-hidden">
        
        <!-- Red Column -->
        <div id="red-col" class="flex-1 flex flex-col rounded-2xl border-2 border-red-200 bg-red-50 overflow-hidden shadow-sm transition-all duration-300">
            <div class="bg-red-600 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-sm font-black uppercase italic tracking-wider">Red Alliance</h2>
                <div id="red-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-4 custom-scrollbar" id="red-controls"></div>
        </div>

        <!-- Blue Column -->
        <div id="blue-col" class="flex-1 flex flex-col rounded-2xl border-2 border-blue-200 bg-blue-50 overflow-hidden shadow-sm transition-all duration-300">
            <div class="bg-blue-700 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-sm font-black uppercase italic tracking-wider">Blue Alliance</h2>
                <div id="blue-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-4 custom-scrollbar" id="blue-controls"></div>
        </div>

        <!-- Log Sidebar -->
        <div id="log-sidebar" class="w-full md:w-72 flex flex-col rounded-2xl border-2 border-slate-200 bg-white overflow-hidden shadow-sm shrink-0">
            <div class="bg-slate-800 p-3 text-white flex justify-between items-center">
                <h2 class="text-[10px] font-black uppercase tracking-widest flex items-center gap-2">
                    <i data-lucide="list" class="w-3 h-3"></i> Match Log
                </h2>
                <button onclick="exportLog()" class="p-1 hover:text-blue-400"><i data-lucide="download" class="w-3.5 h-3.5"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-2 custom-scrollbar space-y-2 bg-slate-50" id="match-log"></div>
            <div class="p-3 border-t border-slate-100">
                <button onclick="saveMatch()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black uppercase tracking-widest text-[10px] shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Commit Result
                </button>
            </div>
        </div>
    </main>

    <script>
        let timeLeft = 120;
        let isRunning = false;
        let phase = 'AUTO';
        let timerInterval;
        let matchLog = [];
        let isSwapped = false;

        const initialState = () => ({
            // Autonomous
            yellowBase: 0, ringBase: 0, botguyUpBase: 0, botguyTipBase: 0, ballBase: 0, rockerBase: 0,
            scout: 0, autoStacks: [],
            // Teleop
            yellowZone: 0, ringZone: 0, botguyUpZone: 0, botguyTipZone: 0, ballZone: 0, 
            scrapZone: 0, scrapBase: 0,
            pomsZone: 0, pomsBase: 0, // NEW: Penalties for opposing poms
            hazard: 0, pickle: false, ultimate: false, autoWinner: false, autoLockedScore: 0
        });

        let red = initialState();
        let blue = initialState();

        function calculateAuto(alliance) {
            let total = 0;
            let baseScore = (alliance.yellowBase + alliance.ringBase) * 10;
            baseScore += (alliance.ballBase + alliance.rockerBase) * 20;
            baseScore += (alliance.botguyUpBase * 30) + (alliance.botguyTipBase * 15);

            let stackBonus = 0;
            if (alliance.autoStacks.length > 0) {
                const itemCount = alliance.yellowBase + alliance.ringBase + alliance.ballBase + alliance.rockerBase + alliance.botguyUpBase + alliance.botguyTipBase;
                const avgVal = itemCount > 0 ? baseScore / itemCount : 0;
                alliance.autoStacks.forEach(h => {
                    let mult = h === 2 ? 3 : h === 3 ? 4 : 5;
                    stackBonus += (avgVal * h * mult * 2) - (avgVal * h); 
                });
            }

            total += (baseScore * 2) + stackBonus;
            total += (alliance.ballBase + alliance.rockerBase) * 50;
            total += alliance.scout === 1 ? 10 : alliance.scout === 2 ? 25 : 0;
            return Math.max(0, Math.round(total));
        }

        function calculate(alliance) {
            if (phase === 'AUTO') return calculateAuto(alliance);
            
            let total = alliance.autoLockedScore;
            total += (alliance.yellowZone + alliance.ringZone) * 2;
            total += (alliance.botguyUpZone * 10) + (alliance.botguyTipZone * 5);
            total += (alliance.ballZone * 5);
            
            if (alliance.ultimate) total += 100;
            if (alliance.autoWinner) total += 50;
            
            // Penalties
            if (alliance.pickle) {
                total += 100;
            } else {
                total -= (alliance.scrapZone * 2);
                total -= (alliance.scrapBase * 10);
            }

            // NEW: Pom Penalties
            // Opposing poms on this alliance's side: -2
            // Opposing poms in this alliance's base: -10
            total -= (alliance.pomsZone * 2);
            total -= (alliance.pomsBase * 10);

            total -= (alliance.hazard * 15);
            
            return Math.max(0, Math.round(total));
        }

        function swapDisplay() {
            const container = document.getElementById('game-container');
            const redCol = document.getElementById('red-col');
            const blueCol = document.getElementById('blue-col');
            isSwapped = !isSwapped;
            if (isSwapped) {
                container.insertBefore(blueCol, redCol);
            } else {
                container.insertBefore(redCol, blueCol);
            }
        }

        function renderControls(alliance, side) {
            const container = document.getElementById(`${side}-controls`);
            const isAuto = phase === 'AUTO';
            
            container.innerHTML = `
                <!-- Autonomous Section -->
                <div class="space-y-2 p-3 bg-white rounded-xl border border-slate-100 shadow-sm ${!isAuto ? 'opacity-30 pointer-events-none' : ''}">
                    <h3 class="text-[9px] font-black text-slate-400 uppercase flex items-center gap-1.5"><i data-lucide="cpu" class="w-3 h-3 text-amber-500"></i> Autonomous</h3>
                    <div class="grid grid-cols-2 gap-2">
                        ${renderCounter('Cubes', 'box', alliance.yellowBase, side, 'yellowBase', 'bg-game-yellow')}
                        ${renderCounter('Rings', 'circle', alliance.ringBase, side, 'ringBase', 'bg-slate-200')}
                        ${renderCounter('Rocker', 'layers', alliance.rockerBase, side, 'rockerBase', 'bg-game-green')}
                        ${renderCounter('Summit', 'circle', alliance.ballBase, side, 'ballBase', 'bg-game-tennis')}
                        ${renderCounter('Bot (Up)', 'bot', alliance.botguyUpBase, side, 'botguyUpBase', 'bg-game-red')}
                        ${renderCounter('Bot (Tip)', 'trending-down', alliance.botguyTipBase, side, 'botguyTipBase', 'bg-game-red/40')}
                    </div>
                    
                    <div class="flex gap-1 py-1">
                        <button onclick="setScout('${side}', 0)" class="flex-1 py-1.5 rounded text-[8px] font-black border transition-colors ${alliance.scout === 0 ? 'bg-slate-900 text-white' : 'bg-white text-slate-400'}">OFF</button>
                        <button onclick="setScout('${side}', 1)" class="flex-1 py-1.5 rounded text-[8px] font-black border transition-colors ${alliance.scout === 1 ? 'bg-amber-500 text-white' : 'bg-white text-slate-400'}">N-ZONE</button>
                        <button onclick="setScout('${side}', 2)" class="flex-1 py-1.5 rounded text-[8px] font-black border transition-colors ${alliance.scout === 2 ? 'bg-red-500 text-white' : 'bg-white text-slate-400'}">O-ZONE</button>
                    </div>

                    <div class="p-2 bg-slate-50 rounded-lg border border-dashed border-slate-200">
                        <div class="flex justify-between items-center mb-1.5">
                            <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">Automatic Stacks</span>
                            <div class="flex gap-1">
                                <button onclick="addStack('${side}', 2)" class="px-2 py-0.5 bg-slate-800 text-white text-[8px] font-bold rounded">2T</button>
                                <button onclick="addStack('${side}', 3)" class="px-2 py-0.5 bg-slate-800 text-white text-[8px] font-bold rounded">3T</button>
                                <button onclick="addStack('${side}', 4)" class="px-2 py-0.5 bg-slate-800 text-white text-[8px] font-bold rounded">4T</button>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-1">
                            ${alliance.autoStacks.map((s, i) => `
                                <div class="bg-white px-1.5 py-0.5 rounded text-[9px] font-black border flex items-center gap-1 shadow-xs">${s}T <i data-lucide="x" class="w-2.5 h-2.5 text-red-500 cursor-pointer" onclick="removeStack('${side}', ${i})"></i></div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <!-- Teleop Section -->
                <div class="space-y-3 p-3 bg-white rounded-xl border border-slate-100 shadow-sm ${isAuto ? 'opacity-30 pointer-events-none' : ''}">
                    <h3 class="text-[9px] font-black text-slate-400 uppercase flex items-center gap-1.5"><i data-lucide="gamepad-2" class="w-3 h-3 text-blue-500"></i> Teleop</h3>
                    <div class="grid grid-cols-2 gap-2">
                        ${renderCounter('Cubes (Z)', 'square', alliance.yellowZone, side, 'yellowZone', 'bg-game-yellow')}
                        ${renderCounter('Rings (Z)', 'circle', alliance.ringZone, side, 'ringZone', 'bg-slate-200')}
                        ${renderCounter('Bot (Z)', 'smile', alliance.botguyUpZone, side, 'botguyUpZone', 'bg-game-red')}
                        ${renderCounter('Ball (Z)', 'circle', alliance.ballZone, side, 'ballZone', 'bg-game-tennis')}
                    </div>
                    
                    <h3 class="text-[8px] font-black text-red-500 uppercase flex items-center gap-1.5 mt-2">Penalties (Opponent Elements)</h3>
                    <div class="grid grid-cols-2 gap-2">
                        ${renderCounter('Opp. Poms (Zone)', 'minus-circle', alliance.pomsZone, side, 'pomsZone', 'bg-game-poms')}
                        ${renderCounter('Opp. Poms (Base)', 'home', alliance.pomsBase, side, 'pomsBase', 'bg-game-poms')}
                        ${renderCounter('Scrap (Zone)', 'trash-2', alliance.scrapZone, side, 'scrapZone', 'bg-game-scrap')}
                        ${renderCounter('Hazard Zone', 'bomb', alliance.hazard, side, 'hazard', 'bg-orange-500')}
                    </div>

                    <div class="grid grid-cols-3 gap-2 pt-1">
                         <button onclick="toggleBool('${side}', 'autoWinner')" class="flex flex-col items-center p-2 rounded-lg border transition-all ${alliance.autoWinner ? 'bg-amber-500 text-white border-amber-600 shadow-md' : 'bg-white text-slate-400'}">
                            <i data-lucide="award" class="w-4 h-4 mb-0.5"></i><span class="text-[7px] font-black uppercase">Auto Win</span>
                        </button>
                        <button onclick="toggleBool('${side}', 'ultimate')" class="flex flex-col items-center p-2 rounded-lg border transition-all ${alliance.ultimate ? 'bg-indigo-600 text-white border-indigo-700 shadow-md' : 'bg-white text-slate-400'}">
                            <i data-lucide="zap" class="w-4 h-4 mb-0.5"></i><span class="text-[7px] font-black uppercase">Ultimate</span>
                        </button>
                        <button onclick="toggleBool('${side}', 'pickle')" class="flex flex-col items-center p-2 rounded-lg border transition-all ${alliance.pickle ? 'bg-green-500 text-white border-green-600 shadow-md' : 'bg-white text-slate-400'}">
                            <i data-lucide="database" class="w-4 h-4 mb-0.5"></i><span class="text-[7px] font-black uppercase">Pickle</span>
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderCounter(label, icon, val, side, key, colorClass) {
            return `
                <div class="flex flex-col p-1.5 bg-slate-50 rounded-lg border border-slate-200">
                    <span class="text-[7px] font-black text-slate-400 uppercase tracking-tighter mb-1 truncate">${label}</span>
                    <div class="flex items-center justify-between">
                        <div class="${colorClass} p-1 rounded-md text-slate-900/50"><i data-lucide="${icon}" class="w-3 h-3"></i></div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="changeVal('${side}', '${key}', -1)" class="w-6 h-6 flex items-center justify-center bg-white border border-slate-200 rounded text-slate-400 active:scale-95"><i data-lucide="minus" class="w-2.5 h-2.5"></i></button>
                            <span class="text-xs font-black w-4 text-center tabular-nums">${val}</span>
                            <button onclick="changeVal('${side}', '${key}', 1)" class="w-6 h-6 flex items-center justify-center bg-white border border-slate-200 rounded text-slate-900 active:scale-95"><i data-lucide="plus" class="w-2.5 h-2.5"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        function update() {
            document.getElementById('red-total').innerText = calculate(red);
            document.getElementById('blue-total').innerText = calculate(blue);
            renderControls(red, 'red');
            renderControls(blue, 'blue');
        }

        window.changeVal = (side, key, delta) => { 
            const alliance = (side === 'red' ? red : blue);
            alliance[key] = Math.max(0, alliance[key] + delta); 
            update(); 
        };
        
        window.toggleBool = (side, key) => { 
            const alliance = (side === 'red' ? red : blue);
            alliance[key] = !alliance[key]; 
            update(); 
        };
        
        window.setScout = (side, val) => { 
            (side === 'red' ? red : blue).scout = val; 
            update(); 
        };
        
        window.addStack = (side, h) => { 
            (side === 'red' ? red : blue).autoStacks.push(h); 
            update(); 
        };
        
        window.removeStack = (side, i) => { 
            (side === 'red' ? red : blue).autoStacks.splice(i, 1); 
            update(); 
        };

        window.toggleTimer = () => {
            isRunning = !isRunning;
            const btn = document.getElementById('timer-btn');
            btn.className = `flex items-center gap-2 px-4 py-2 ${isRunning ? 'bg-amber-500' : 'bg-green-500'} text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest transition-all active:scale-95`;
            btn.innerHTML = isRunning ? `<i data-lucide="pause" class="w-4 h-4"></i><span>Pause</span>` : `<i data-lucide="play" class="w-4 h-4"></i><span>Resume</span>`;
            lucide.createIcons();
            
            if (isRunning) {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft === 105 && phase === 'AUTO') { // 15 sec Auto ends at 105
                        red.autoLockedScore = calculateAuto(red);
                        blue.autoLockedScore = calculateAuto(blue);
                        phase = 'TELEOP';
                        document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-blue-600 text-white";
                        document.getElementById('phase-badge').innerText = "TELEOP";
                    }
                    if (timeLeft <= 0) { 
                        clearInterval(timerInterval); 
                        isRunning = false; 
                        btn.innerHTML = `<i data-lucide="play" class="w-4 h-4"></i><span>Start</span>`;
                    }
                    const m = Math.floor(timeLeft / 60); const s = timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    update();
                }, 1000);
            } else { 
                clearInterval(timerInterval); 
            }
        };

        window.resetMatch = () => {
            clearInterval(timerInterval);
            timeLeft = 120; isRunning = false; phase = 'AUTO';
            red = initialState(); blue = initialState();
            document.getElementById('timer-display').innerText = "2:00";
            document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse";
            document.getElementById('phase-badge').innerText = "AUTO";
            document.getElementById('timer-btn').className = "flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest";
            document.getElementById('timer-btn').innerHTML = `<i data-lucide="play" class="w-4 h-4"></i><span>Start</span>`;
            lucide.createIcons();
            update();
        };

        window.saveMatch = () => {
            const matchNumInput = document.getElementById('match-number');
            const matchNum = matchNumInput.value;
            const r = calculate(red); const b = calculate(blue);
            matchLog.unshift({ match: matchNum, redScore: r, blueScore: b, winner: r > b ? 'RED' : r < b ? 'BLUE' : 'DRAW' });
            renderLog();
            matchNumInput.value = parseInt(matchNum) + 1;
        };

        function renderLog() {
            const container = document.getElementById('match-log');
            if (matchLog.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-30 text-[10px] font-black uppercase italic">No Matches Recorded</div>`;
                return;
            }
            container.innerHTML = matchLog.map(m => `
                <div class="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between shadow-sm border-l-4 ${m.winner === 'RED' ? 'border-l-red-500' : m.winner === 'BLUE' ? 'border-l-blue-500' : 'border-l-slate-400'}">
                    <div class="flex items-center gap-3">
                        <div class="text-[8px] font-black bg-slate-100 px-2 py-1 rounded">#${m.match}</div>
                        <div class="font-black tabular-nums text-sm">
                            <span class="${m.winner === 'RED' ? 'text-red-600' : 'text-slate-500'}">${m.redScore}</span> 
                            <span class="text-slate-300 mx-1">-</span> 
                            <span class="${m.winner === 'BLUE' ? 'text-blue-600' : 'text-slate-500'}">${m.blueScore}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.exportLog = () => {
            let csv = "Match,Red,Blue,Winner\n" + matchLog.map(m => `${m.match},${m.redScore},${m.blueScore},${m.winner}`).join("\n");
            const link = document.createElement("a");
            link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
            link.download = `vex_match_log_match_${document.getElementById('match-number').value}.csv`;
            link.click();
        };

        window.onload = () => { 
            update(); 
            renderLog(); 
            lucide.createIcons(); 
        };
    </script>
</body>
</html>
