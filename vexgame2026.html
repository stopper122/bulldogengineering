<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stacker's Summit Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        .bg-game-yellow { background-color: #facc15; }
        .bg-game-green { background-color: #22c55e; }
        .bg-game-tennis { background-color: #bef264; }
        .bg-game-red { background-color: #ef4444; }
        .bg-game-poms { background-color: #ec4899; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- Header -->
    <header class="bg-slate-900 px-4 py-3 shadow-xl flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                <i data-lucide="mountain" class="w-5 h-5"></i>
            </div>
            <h1 class="text-white font-black italic text-lg uppercase tracking-tighter hidden sm:block text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Stacker's Summit</h1>
        </div>

        <div class="flex items-center gap-4">
            <div id="phase-badge" class="px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse">
                AUTO
            </div>
            <div id="timer-display" class="text-white text-3xl font-mono font-black tabular-nums tracking-tighter w-20 text-center">
                2:00
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTimer()" id="timer-btn" class="flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    <span id="timer-btn-text">Start</span>
                </button>
                <button onclick="resetMatch()" class="p-2.5 bg-slate-700 text-white rounded-full hover:bg-slate-600 transition-colors">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row p-2 gap-2 overflow-hidden">
        
        <!-- Red Alliance -->
        <div class="flex-1 flex flex-col rounded-2xl border-2 border-red-200 bg-red-50 overflow-hidden shadow-sm">
            <div class="bg-red-600 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-xs font-black uppercase italic tracking-wider">Red Alliance</h2>
                <div id="red-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-3 custom-scrollbar" id="red-controls"></div>
        </div>

        <!-- Blue Alliance -->
        <div class="flex-1 flex flex-col rounded-2xl border-2 border-blue-200 bg-blue-50 overflow-hidden shadow-sm">
            <div class="bg-blue-700 px-4 py-2 text-white flex justify-between items-center">
                <h2 class="text-xs font-black uppercase italic tracking-wider">Blue Alliance</h2>
                <div id="blue-total" class="text-3xl font-black tabular-nums">0</div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-3 custom-scrollbar" id="blue-controls"></div>
        </div>

        <!-- Sidebar / History -->
        <div class="w-full md:w-56 flex flex-col rounded-2xl border-2 border-slate-200 bg-white overflow-hidden shadow-sm shrink-0">
            <div class="p-3 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400">Match Log</h2>
                <input type="number" id="match-number" value="1" class="w-10 bg-slate-100 text-slate-900 font-bold text-[10px] text-center rounded">
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-2 bg-slate-50" id="match-log"></div>
            <div class="p-2">
                <button onclick="saveMatch()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black uppercase tracking-widest text-[10px] shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Commit
                </button>
            </div>
        </div>
    </main>

    <script>
        let timeLeft = 120;
        let isRunning = false;
        let phase = 'AUTO';
        let timerInterval;
        let matchLog = [];

        const getEmptyState = () => ({
            // Auto scores are simple tallies for calculation
            autoYellow: 0, autoRing: 0, autoRocker: 0, autoBall: 0, autoBotUp: 0, autoBotTip: 0,
            scout: 0, autoStacks: [],
            // Teleop Zone (2 pts)
            zoneYellow: 0, zoneRing: 0, zoneRocker: 0, zoneBall: 0, zoneBotUp: 0, zoneBotTip: 0,
            // Teleop Base (10 pts)
            baseYellow: 0, baseRing: 0, baseRocker: 0, baseBall: 0, baseBotUp: 0, baseBotTip: 0,
            // Penalties
            pomsZone: 0, pomsBase: 0, hazard: 0,
            // Status
            autoWinner: false, ultimate: false, pickle: false,
            autoLockedScore: 0
        });

        let red = getEmptyState();
        let blue = getEmptyState();

        function calcAuto(a) {
            let items = (a.autoYellow + a.autoRing) * 10;
            items += (a.autoBall + a.autoRocker) * 20;
            items += (a.autoBotUp * 30) + (a.autoBotTip * 15);
            
            let stackBonus = 0;
            if (a.autoStacks.length > 0) {
                const count = a.autoYellow + a.autoRing + a.autoBall + a.autoRocker + a.autoBotUp + a.autoBotTip;
                const avg = count > 0 ? items / count : 0;
                a.autoStacks.forEach(h => {
                    let mult = h === 2 ? 3 : h === 3 ? 4 : 5;
                    stackBonus += (avg * h * mult * 2) - (avg * h);
                });
            }

            let total = (items * 2) + stackBonus;
            total += (a.autoBall + a.autoRocker) * 50;
            total += a.scout === 1 ? 10 : a.scout === 2 ? 25 : 0;
            return Math.max(0, Math.round(total));
        }

        function calcTotal(a) {
            if (phase === 'AUTO') return calcAuto(a);
            
            let pts = a.autoLockedScore;
            // Zone Points (2 pts each)
            pts += (a.zoneYellow + a.zoneRing + a.zoneRocker + a.zoneBall) * 2;
            pts += (a.zoneBotUp * 10) + (a.zoneBotTip * 5);

            // Base Points (10 pts each)
            pts += (a.baseYellow + a.baseRing + a.baseRocker + a.baseBall) * 10;
            pts += (a.baseBotUp * 30) + (a.baseBotTip * 15);
            
            if (a.ultimate) pts += 100;
            if (a.autoWinner) pts += 50;
            
            if (a.pickle) {
                pts += 100;
            } else {
                pts -= (a.pomsZone * 2);
                pts -= (a.pomsBase * 10);
            }
            
            pts -= (a.hazard * 15);
            return Math.max(0, Math.round(pts));
        }

        function render() {
            document.getElementById('red-total').innerText = calcTotal(red);
            document.getElementById('blue-total').innerText = calcTotal(blue);
            renderAlliance(red, 'red');
            renderAlliance(blue, 'blue');
        }

        function renderAlliance(a, side) {
            const container = document.getElementById(`${side}-controls`);
            const isAuto = phase === 'AUTO';

            if (isAuto) {
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        ${counter('Cubes', 'box', a.autoYellow, side, 'autoYellow', 'bg-game-yellow')}
                        ${counter('Rings', 'circle', a.autoRing, side, 'autoRing', 'bg-slate-200')}
                        ${counter('Rocker', 'layers', a.autoRocker, side, 'autoRocker', 'bg-game-green')}
                        ${counter('Ball', 'target', a.autoBall, side, 'autoBall', 'bg-game-tennis')}
                        ${counter('Bot Up', 'bot', a.autoBotUp, side, 'autoBotUp', 'bg-game-red')}
                        ${counter('Bot Tip', 'trending-down', a.autoBotTip, side, 'autoBotTip', 'bg-red-200')}
                    </div>
                    <div class="mt-4 bg-white p-3 rounded-xl border border-slate-200">
                        <h4 class="text-[9px] font-black uppercase text-slate-400 mb-2">Scout Mission</h4>
                        <div class="flex gap-2">
                            ${['OFF', 'N-ZONE', 'O-ZONE'].map((l, i) => `
                                <button onclick="setScout('${side}', ${i})" class="flex-1 py-2 rounded-lg text-[9px] font-black transition-all ${a.scout === i ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-400'}">${l}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <section class="space-y-4">
                        <!-- Team Zone (2pt) -->
                        <div>
                            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-1">
                                <i data-lucide="map" class="w-3 h-3"></i> Team Zone <span class="text-blue-500 ml-auto">+2 / +10 Pts</span>
                            </h3>
                            <div class="grid grid-cols-2 gap-2">
                                ${counter('Cubes (Zone)', 'box', a.zoneYellow, side, 'zoneYellow', 'bg-game-yellow')}
                                ${counter('Cubes (Base)', 'home', a.baseYellow, side, 'baseYellow', 'bg-game-yellow')}
                                ${counter('Rings (Zone)', 'circle', a.zoneRing, side, 'zoneRing', 'bg-slate-200')}
                                ${counter('Rings (Base)', 'home', a.baseRing, side, 'baseRing', 'bg-slate-200')}
                                ${counter('Rocker (Zone)', 'layers', a.zoneRocker, side, 'zoneRocker', 'bg-game-green')}
                                ${counter('Rocker (Base)', 'home', a.baseRocker, side, 'baseRocker', 'bg-game-green')}
                                ${counter('Ball (Zone)', 'target', a.zoneBall, side, 'zoneBall', 'bg-game-tennis')}
                                ${counter('Ball (Base)', 'home', a.baseBall, side, 'baseBall', 'bg-game-tennis')}
                                ${counter('Bot Up (Zone)', 'bot', a.zoneBotUp, side, 'zoneBotUp', 'bg-game-red')}
                                ${counter('Bot Up (Base)', 'home', a.baseBotUp, side, 'baseBotUp', 'bg-game-red')}
                                ${counter('Bot Tip (Zone)', 'trending-down', a.zoneBotTip, side, 'zoneBotTip', 'bg-red-200')}
                                ${counter('Bot Tip (Base)', 'home', a.baseBotTip, side, 'baseBotTip', 'bg-red-200')}
                            </div>
                        </div>

                        <!-- Penalties -->
                        <div class="bg-red-50 p-2 rounded-xl border border-red-100">
                            <h3 class="text-[10px] font-black text-red-400 uppercase tracking-widest mb-2 flex items-center gap-1">
                                <i data-lucide="shield-alert" class="w-3 h-3"></i> Opposing Poms <span class="text-red-600 ml-auto">-2 / -10 Pts</span>
                            </h3>
                            <div class="grid grid-cols-2 gap-2">
                                ${counter('Pom (Zone)', 'minus-circle', a.pomsZone, side, 'pomsZone', 'bg-game-poms')}
                                ${counter('Pom (Base)', 'home', a.pomsBase, side, 'pomsBase', 'bg-game-poms')}
                            </div>
                            <div class="mt-2">
                                ${counter('Hazard Contact', 'bomb', a.hazard, side, 'hazard', 'bg-orange-500 text-white')}
                            </div>
                        </div>

                        <!-- States -->
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="toggleBool('${side}', 'autoWinner')" class="flex flex-col items-center p-2 rounded-xl border transition-all ${a.autoWinner ? 'bg-amber-500 text-white' : 'bg-white text-slate-300'}">
                                <i data-lucide="award" class="w-4 h-4 mb-1"></i><span class="text-[8px] font-black uppercase">Auto Win</span>
                            </button>
                            <button onclick="toggleBool('${side}', 'ultimate')" class="flex flex-col items-center p-2 rounded-xl border transition-all ${a.ultimate ? 'bg-indigo-600 text-white' : 'bg-white text-slate-300'}">
                                <i data-lucide="zap" class="w-4 h-4 mb-1"></i><span class="text-[8px] font-black uppercase">Ultimate</span>
                            </button>
                            <button onclick="toggleBool('${side}', 'pickle')" class="flex flex-col items-center p-2 rounded-xl border transition-all ${a.pickle ? 'bg-green-600 text-white' : 'bg-white text-slate-300'}">
                                <i data-lucide="database" class="w-4 h-4 mb-1"></i><span class="text-[8px] font-black uppercase">Pickle</span>
                            </button>
                        </div>
                    </section>
                `;
            }
            lucide.createIcons();
        }

        function counter(label, icon, val, side, key, color) {
            return `
                <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between h-16">
                    <span class="text-[7px] font-black uppercase text-slate-400 tracking-tighter truncate">${label}</span>
                    <div class="flex items-center justify-between">
                        <div class="${color} p-1 rounded-lg text-slate-900/40"><i data-lucide="${icon}" class="w-3 h-3"></i></div>
                        <div class="flex items-center gap-1">
                            <button onclick="changeVal('${side}', '${key}', -1)" class="w-6 h-6 flex items-center justify-center bg-slate-50 border rounded-lg text-xs">-</button>
                            <span class="w-5 text-center font-black text-xs tabular-nums">${val}</span>
                            <button onclick="changeVal('${side}', '${key}', 1)" class="w-6 h-6 flex items-center justify-center bg-slate-100 border rounded-lg text-xs">+</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.changeVal = (s, k, d) => { (s === 'red' ? red : blue)[k] = Math.max(0, (s === 'red' ? red : blue)[k] + d); render(); };
        window.toggleBool = (s, k) => { (s === 'red' ? red : blue)[k] = !(s === 'red' ? red : blue)[k]; render(); };
        window.setScout = (s, v) => { (s === 'red' ? red : blue).scout = v; render(); };

        window.toggleTimer = () => {
            isRunning = !isRunning;
            const btn = document.getElementById('timer-btn');
            if (isRunning) {
                btn.className = "flex items-center gap-2 px-4 py-2 bg-amber-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest";
                btn.innerHTML = `<i data-lucide="pause" class="w-4 h-4"></i><span>Pause</span>`;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft === 105 && phase === 'AUTO') {
                        red.autoLockedScore = calcAuto(red);
                        blue.autoLockedScore = calcAuto(blue);
                        phase = 'TELEOP';
                        document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-blue-600 text-white";
                        document.getElementById('phase-badge').innerText = "TELEOP";
                    }
                    if (timeLeft <= 0) { clearInterval(timerInterval); isRunning = false; }
                    const m = Math.floor(timeLeft / 60); const s = timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    render();
                }, 1000);
            } else {
                clearInterval(timerInterval);
                btn.className = "flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl shadow-lg font-black uppercase text-[10px] tracking-widest";
                btn.innerHTML = `<i data-lucide="play" class="w-4 h-4"></i><span>Resume</span>`;
            }
            lucide.createIcons();
        };

        window.resetMatch = () => {
            clearInterval(timerInterval);
            timeLeft = 120; isRunning = false; phase = 'AUTO';
            red = getEmptyState(); blue = getEmptyState();
            document.getElementById('timer-display').innerText = "2:00";
            document.getElementById('phase-badge').innerText = "AUTO";
            document.getElementById('phase-badge').className = "px-3 py-1 rounded-full font-black text-[10px] tracking-widest bg-amber-500 text-amber-950 pulse";
            render();
        };

        window.saveMatch = () => {
            const m = document.getElementById('match-number').value;
            matchLog.unshift({ match: m, r: calcTotal(red), b: calcTotal(blue) });
            renderLog();
            document.getElementById('match-number').value = parseInt(m) + 1;
        };

        function renderLog() {
            const container = document.getElementById('match-log');
            if (!matchLog.length) { container.innerHTML = `<div class="py-8 text-center text-[8px] font-black text-slate-300 uppercase italic">Empty</div>`; return; }
            container.innerHTML = matchLog.map(m => `
                <div class="p-2 bg-white border border-slate-100 rounded-lg flex justify-between items-center shadow-sm">
                    <span class="text-[8px] font-black text-slate-400">#${m.match}</span>
                    <div class="flex gap-2 font-black text-xs tabular-nums">
                        <span class="text-red-500">${m.r}</span>
                        <span class="text-slate-300">-</span>
                        <span class="text-blue-500">${m.b}</span>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => { render(); renderLog(); lucide.createIcons(); };
    </script>
</body>
</html>
