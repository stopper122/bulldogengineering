<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Brown Memorial Scholarship</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and Babel for rendering JSX in browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .bg-navy { background-color: #001D3D; }
        .text-navy { color: #001D3D; }
        .bg-gold { background-color: #B89B5E; }
        .text-gold { color: #B89B5E; }
        .bg-growth-green { background-color: #5D7A32; }
        .text-growth-green { color: #5D7A32; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #B89B5E; border-radius: 10px; }

        #root { min-height: 100vh; display: flex; flex-direction: column; }

        .fade-up {
            animation: fadeUp 1s ease-out forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /**
         * --- DIRECT RAW GITHUB LINKS ---
         * These are constructed exactly from your stopper122/imagelocker repository names.
         */
        const RAW_BASE = "https://raw.githubusercontent.com/stopper122/imagelocker/main/";

        const LOGO_URL = RAW_BASE + "BillBrownScholarshipLogoLarge.png";
        const DAD_PHOTO_URL = RAW_BASE + "dad.jpg";
        // Space in filename is handled with %20
        const VENMO_QR_URL = RAW_BASE + "BB%20Scholarship%20Venmo.png"; 

        const COVINA_LOGO_URL = RAW_BASE + "CovinaHighSchoolLogo.png";
        const SOUTH_HILLS_LOGO_URL = RAW_BASE + "SouthHillsHSLogo.png";
        const NORTHVIEW_LOGO_URL = RAW_BASE + "NorthviewHS_MascotHead.png";
        
        const VENMO_DIRECT_LINK = "https://venmo.com/code?user_id=3588298232563078649&created=1777774131.050062";

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                    setIsMenuOpen(false);
                }
            };

            const schools = [
                { name: 'Covina High School', mascot: 'Colts', border: 'border-red-700', logo: COVINA_LOGO_URL, label: 'Covina' },
                { name: 'South Hills High School', mascot: 'Huskies', border: 'border-[#006633]', logo: SOUTH_HILLS_LOGO_URL, label: 'South Hills' },
                { name: 'Northview High School', mascot: 'Vikings', border: 'border-[#FFD700]', logo: NORTHVIEW_LOGO_URL, label: 'Northview' }
            ];

            const criteria = [
                "Must be a senior at Covina, Northview, or South Hills High School in Covina-Valley Unified.",
                "Must be planning on attending a Community College or University.",
                "Must be a student raised by a single parent or a single guardian.",
                "Must be involved in sports in school.",
                "Must have a GPA of 3.0 or higher.",
                "Must attach official transcripts (including 1st semester of senior year).",
                "Submission of one (1) letter of recommendation is required.",
                "Personal Essay."
            ];

            // If GitHub hasn't updated its cache yet, show a colored box so the site doesn't break
            const handleImageError = (e, text) => {
                e.target.onerror = null;
                e.target.src = `https://placehold.co/400x400/001d3d/white?text=${encodeURIComponent(text)}`;
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col overflow-x-hidden pt-0 text-slate-900">
                    {/* NAVBAR */}
                    <nav className={`fixed w-full z-50 transition-all duration-300 bg-white shadow-md ${scrolled ? 'py-2' : 'py-4'}`}>
                        <div className="max-w-7xl mx-auto px-4 flex justify-between items-center">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => scrollToSection('home')}>
                                <div className="p-1 rounded-lg">
                                    <img 
                                        src={LOGO_URL} 
                                        alt="Logo" 
                                        className="h-8 md:h-10 w-auto object-contain" 
                                        onError={(e) => handleImageError(e, 'Logo')}
                                    />
                                </div>
                                <div className="flex flex-col text-left">
                                    <span className="font-bold tracking-tight text-sm md:text-lg leading-none text-navy uppercase">Bill Brown</span>
                                    <span className="text-[8px] md:text-[9px] uppercase tracking-[0.2em] font-semibold text-growth-green text-left">Memorial Scholarship</span>
                                </div>
                            </div>

                            <div className="hidden md:flex space-x-6 lg:space-x-8">
                                {['Home', 'About Bill', 'Eligibility', 'Apply', 'Donate'].map((name) => (
                                    <button 
                                        key={name} 
                                        onClick={() => scrollToSection(name.toLowerCase().replace(' ', '-'))}
                                        className="text-xs lg:text-sm font-medium transition-colors hover:text-gold text-slate-700"
                                    >
                                        {name}
                                    </button>
                                ))}
                            </div>

                            <button className="md:hidden p-2 text-navy" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                {isMenuOpen ? <i data-lucide="x"></i> : <i data-lucide="menu"></i>}
                            </button>
                        </div>
                    </nav>

                    {/* Mobile Menu */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 z-40 bg-white flex flex-col items-center justify-center space-y-8 md:hidden text-navy">
                            {['Home', 'About Bill', 'Eligibility', 'Apply', 'Donate'].map((name) => (
                                <button key={name} onClick={() => scrollToSection(name.toLowerCase().replace(' ', '-'))} className="text-2xl font-bold">
                                    {name}
                                </button>
                            ))}
                            <button onClick={() => setIsMenuOpen(false)} className="absolute top-6 right-6 p-2 text-navy">
                                <i data-lucide="x" size={32}></i>
                            </button>
                        </div>
                    )}

                    {/* Hero Section */}
                    <header id="home" className="relative min-h-screen bg-navy text-white overflow-hidden flex items-center pt-16 md:pt-0">
                        <div className="absolute inset-0 bg-black/40 z-10 md:hidden"></div>
                        <div className="max-w-7xl mx-auto px-4 w-full grid md:grid-cols-2 gap-12 items-center relative z-20 pb-12">
                            <div className="fade-up text-center md:text-left order-2 md:order-1">
                                <div className="bg-white p-4 rounded-3xl inline-block mb-8 shadow-2xl overflow-hidden">
                                    <img 
                                        src={LOGO_URL} 
                                        alt="Logo" 
                                        className="h-40 md:h-64 lg:h-80 w-auto mx-auto" 
                                        onError={(e) => handleImageError(e, 'Logo')}
                                    />
                                </div>
                                <h1 className="text-4xl md:text-5xl lg:text-6xl font-bold uppercase tracking-tight mb-4 leading-tight">
                                    Continuing <br className="hidden lg:block" /> the Legacy
                                </h1>
                                <p className="text-xl text-slate-200 mb-10 font-light italic max-w-lg mx-auto md:mx-0">
                                    Empowering graduating seniors from Covina, South Hills, and Northview High Schools.
                                </p>
                                <div className="flex flex-col sm:flex-row justify-center md:justify-start gap-4 text-white font-bold">
                                    <button onClick={() => scrollToSection('apply')} className="bg-growth-green hover:opacity-90 px-10 py-4 rounded-full shadow-lg transition-all text-lg font-bold">
                                        How to Apply
                                    </button>
                                    <button onClick={() => scrollToSection('donate')} className="bg-white/10 backdrop-blur-sm border-2 border-white px-10 py-4 rounded-full transition-all text-lg hover:bg-white hover:text-navy font-bold">
                                        Donate to the Fund
                                    </button>
                                </div>
                            </div>
                            <div className="fade-up order-1 md:order-2 flex justify-center">
                                <div className="relative group w-full max-w-md">
                                    <div className="absolute inset-0 bg-gold rounded-[3rem] rotate-3 opacity-30"></div>
                                    <div className="relative rounded-[3rem] overflow-hidden shadow-2xl border-4 border-white/10">
                                        <img 
                                            src={DAD_PHOTO_URL} 
                                            alt="Bill Brown" 
                                            className="w-full h-auto block object-cover aspect-[4/5] md:aspect-auto" 
                                            onError={(e) => handleImageError(e, 'Bill Brown')}
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* About Bill - NESTED PHOTO LAYOUT */}
                    <section id="about-bill" className="py-24 bg-white">
                        <div className="max-w-5xl mx-auto px-4">
                            <div className="flex flex-col gap-6">
                                <div className="flex items-center space-x-2">
                                    <div className="h-1 w-12 bg-gold"></div>
                                    <span className="text-growth-green font-bold uppercase tracking-wider">The Legacy</span>
                                </div>
                                
                                <div className="flex flex-col md:flex-row items-center md:items-start gap-8 md:gap-12">
                                    {/* Shrunk and Nested Portrait of Dad */}
                                    <div className="relative shrink-0 w-48 md:w-64">
                                        <div className="absolute inset-0 bg-gold rounded-2xl rotate-6 opacity-20"></div>
                                        <img 
                                            src={DAD_PHOTO_URL} 
                                            alt="Bill Brown" 
                                            className="relative w-full h-auto object-cover rounded-2xl shadow-xl border-4 border-white" 
                                            onError={(e) => handleImageError(e, 'Photo')}
                                        />
                                        <div className="absolute -bottom-2 -right-2 bg-navy text-white px-3 py-2 rounded-lg shadow-lg font-bold text-[10px] uppercase tracking-wider text-center">
                                            35+ Years<br/>Service
                                        </div>
                                    </div>

                                    <div className="flex-1 text-center md:text-left">
                                        <h2 className="text-4xl md:text-5xl lg:text-6xl font-bold text-navy leading-tight mb-6">
                                            A Life Dedicated to <br className="hidden lg:block" /> Student Success
                                        </h2>
                                        <div className="space-y-6 text-lg text-slate-600 leading-relaxed">
                                            <p>
                                                Bill Brown dedicated over 35 years to the Covina Valley Unified School District. He was a man of integrity, kindness, and respect who touched the lives of countless students, leaving an impact that continues through this fund.
                                            </p>
                                            <p className="italic border-l-4 border-gold pl-6 py-4 bg-slate-50 text-slate-700 text-xl font-medium text-left">
                                                "He always expressed kindness and had a special way of making people feel seen and supported."
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Eligibility */}
                    <section id="eligibility" className="py-24 bg-navy text-white relative overflow-hidden text-center">
                         <div className="absolute top-0 right-0 w-64 h-64 bg-gold rounded-full blur-[120px] opacity-10"></div>
                         <div className="max-w-7xl mx-auto px-4 relative z-10">
                            <div className="text-center mb-16">
                                <h2 className="text-4xl md:text-5xl font-bold mb-4 tracking-tight">Scholarship Eligibility</h2>
                                <div className="h-1.5 w-24 bg-gold mx-auto rounded-full"></div>
                                <p className="text-slate-400 mt-6 max-w-xl mx-auto italic text-lg text-center">Supporting students who overcome obstacles with integrity and resilience.</p>
                            </div>
                            <div className="grid md:grid-cols-2 gap-4">
                                {criteria.map((item, index) => (
                                    <div key={index} className="flex items-start space-x-4 bg-white/5 p-6 rounded-2xl border border-white/10 hover:border-gold/50 transition-colors">
                                        <div className="bg-gold p-2 rounded-lg text-navy shrink-0">
                                            <i data-lucide="check" className="w-4 h-4 font-bold"></i>
                                        </div>
                                        <p className="text-md text-slate-200 leading-relaxed text-left">{item}</p>
                                    </div>
                                ))}
                            </div>
                         </div>
                    </section>

                    {/* Schools */}
                    <section id="scholarship" className="py-24 bg-slate-100 text-center">
                        <div className="max-w-7xl mx-auto px-4">
                            <h2 className="text-3xl md:text-5xl font-bold text-navy mb-16">Participating CVUSD Schools</h2>
                            <div className="grid md:grid-cols-3 gap-8">
                                {schools.map(school => (
                                    <div key={school.name} className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-200 transition-all hover:shadow-xl hover:-translate-y-2 group">
                                        <div className={`w-24 h-24 mx-auto mb-6 rounded-2xl flex items-center justify-center bg-white border-2 ${school.border} overflow-hidden shadow-md transform group-hover:scale-110 transition-transform`}>
                                            <img 
                                                src={school.logo} 
                                                alt={`${school.name} Logo`} 
                                                className="w-full h-full object-contain p-2" 
                                                onError={(e) => handleImageError(e, school.label)}
                                            />
                                        </div>
                                        <h3 className="text-xl font-bold text-navy mb-2 leading-tight">{school.name}</h3>
                                        <p className="text-growth-green font-semibold mb-6 uppercase tracking-widest text-[10px]">Home of the {school.mascot}</p>
                                        <button onClick={() => scrollToSection('apply')} className="text-navy font-bold hover:text-gold transition-colors flex items-center justify-center mx-auto text-sm underline decoration-gold/50 underline-offset-4">
                                            <span>View Application Process</span>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* How to Apply */}
                    <section id="apply" className="py-24 bg-white">
                        <div className="max-w-7xl mx-auto px-4 grid lg:grid-cols-2 gap-16 items-center">
                            <div>
                                <h2 className="text-4xl md:text-5xl font-bold text-navy mb-8 leading-tight">Your Path to <br/> The Scholarship</h2>
                                <div className="space-y-8 text-left">
                                    {[
                                        { n: "1", title: "Get Official Application", desc: "Visit your high school counseling office directly to obtain the official Bill Brown Memorial Scholarship application form." },
                                        { n: "2", title: "Complete Documentation", desc: "Follow the instructions on the official form. Ensure you have your 3.0+ GPA transcripts, recommendation letter, and personal essay ready." },
                                        { n: "3", title: "Submit your completed application", desc: "" }
                                    ].map(step => (
                                        <div key={step.n} className="flex gap-6 items-start group">
                                            <div className="bg-navy w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-white shrink-0 text-xl shadow-lg group-hover:bg-gold transition-colors">{step.n}</div>
                                            <div>
                                                <h4 className="text-xl font-bold mb-1 uppercase text-xs tracking-wider text-navy">{step.title}</h4>
                                                {step.desc && <p className="text-slate-600 leading-relaxed text-md">{step.desc}</p>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-navy p-10 rounded-[3rem] border border-white/10 text-center shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-32 h-32 bg-growth-green rounded-full blur-[80px] opacity-20"></div>
                                <h3 className="text-2xl font-bold text-white mb-2 uppercase tracking-wide">Official Submissions</h3>
                                <p className="text-gold font-bold mb-6 uppercase tracking-[0.2em] text-[10px]">2025-2026 School Year</p>
                                <div className="bg-white/10 p-8 rounded-2xl border border-white/10 text-left mb-8 text-white">
                                    <div className="flex items-center justify-between mb-4 pb-4 border-b border-white/10">
                                        <span className="text-slate-300 font-medium text-sm">Status</span>
                                        <span className="bg-growth-green text-white px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">Active</span>
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <span className="text-slate-300 font-medium text-sm">Deadline</span>
                                        <span className="text-white font-bold text-lg">May 18, 2026</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Donate Section */}
                    <section id="donate" className="py-24 bg-slate-50 text-center">
                        <div className="max-w-6xl mx-auto px-4">
                            <div className="bg-white p-10 md:p-16 rounded-[4rem] shadow-xl border border-slate-200">
                                <div className="flex flex-col items-center mb-10 text-center">
                                    <i data-lucide="heart" className="text-red-500 mb-4 w-12 h-12" fill="currentColor" fillOpacity="0.1"></i>
                                    <h2 className="text-4xl md:text-5xl font-bold text-navy tracking-tight text-center">Support the Scholarship</h2>
                                    <div className="h-1 w-20 bg-gold mt-4 rounded-full mx-auto"></div>
                                    <p className="text-lg text-slate-600 mt-6 max-w-3xl mx-auto leading-relaxed text-center font-medium italic">
                                        "Through generosity of family, friends, and community, this fund will provide meaningful opportunities to students who reflect the same work ethic, dedication, and compassion Bill showed everyday."
                                    </p>
                                    <div className="mt-6 p-6 bg-slate-50 rounded-2xl border-l-4 border-gold text-sm text-slate-700 italic max-w-2xl mx-auto text-center font-medium">
                                        Donations to support the scholarship can be sent to the <strong>Covina-Valley Leadership Association</strong>. Please note "Bill Brown Memorial Scholarship" on any Venmo or check submissions.
                                    </div>
                                </div>

                                <div className="grid md:grid-cols-2 gap-8 mb-12">
                                    <div className="bg-slate-50 p-8 rounded-[2.5rem] border border-slate-100 flex flex-col items-center shadow-sm hover:shadow-md transition-all">
                                        <div className="bg-[#008CFF] p-4 rounded-2xl mb-6 shadow-lg text-white">
                                            <i data-lucide="smartphone" className="w-8 h-8"></i>
                                        </div>
                                        <h4 className="text-2xl font-bold text-navy mb-2 text-center">Donate via Venmo</h4>
                                        <p className="text-slate-500 text-sm mb-6 text-center uppercase tracking-widest font-semibold italic px-4 leading-snug">Include "Bill Brown Memorial Scholarship" in memo</p>
                                        <div className="bg-white p-4 rounded-xl mb-6 shadow-sm border border-slate-100 mx-auto">
                                            <img 
                                                src={VENMO_QR_URL} 
                                                alt="Venmo QR Code" 
                                                className="w-64 h-64 object-contain" 
                                                onError={(e) => handleImageError(e, 'Venmo QR')}
                                            />
                                        </div>
                                        <div className="px-4 text-center">
                                            <a href={VENMO_DIRECT_LINK} target="_blank" rel="noopener noreferrer" className="text-blue-500 text-xs font-bold hover:underline break-all block text-center uppercase tracking-tight">
                                                Open Venmo Profile &rarr;
                                            </a>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-8 rounded-[2.5rem] border border-slate-100 flex flex-col items-center shadow-sm hover:shadow-md transition-all">
                                        <div className="bg-gold p-4 rounded-2xl mb-6 shadow-lg text-white">
                                            <i data-lucide="mail" className="w-8 h-8"></i>
                                        </div>
                                        <h4 className="text-2xl font-bold text-navy mb-2 text-center">Mail a Check</h4>
                                        <p className="text-slate-500 text-sm mb-6 text-center uppercase tracking-widest font-semibold italic px-4">Payable to: Covina-Valley Leadership Association</p>
                                        <div className="text-center space-y-2 bg-white p-6 rounded-2xl border border-slate-200 w-full mb-6 mx-auto">
                                            <p className="font-bold text-navy text-xs uppercase tracking-tighter border-b pb-2 mb-2 border-slate-100 text-center">Mailing Address</p>
                                            <div className="text-slate-700 text-md leading-snug font-medium text-center">
                                                Covina-Valley Unified School District<br/>
                                                Educational Services Department<br/>
                                                <span className="text-sm text-slate-500 font-bold">Attn: Bill Brown Memorial Scholarship</span><br/>
                                                519 E. Badillo St.<br/>
                                                Covina, CA 91723
                                            </div>
                                        </div>
                                        <p className="text-xs text-slate-400 italic px-4 leading-snug text-center">Please list "Bill Brown Memorial Scholarship" in the check memo.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-slate-900 py-20 text-white text-center border-t-8 border-gold mt-auto">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <div className="mb-10 bg-white p-6 rounded-2xl inline-block shadow-xl mx-auto">
                                <img 
                                    src={LOGO_URL} 
                                    alt="Logo" 
                                    className="h-20 w-auto mx-auto" 
                                    onError={(e) => handleImageError(e, 'Logo')}
                                />
                            </div>
                            <p className="font-bold tracking-[0.3em] uppercase mb-4 text-[10px] text-center text-white">Bill Brown Memorial Scholarship Fund</p>
                            <p className="text-slate-500 text-[10px] mb-10 max-w-md mx-auto leading-relaxed uppercase tracking-widest px-4 text-center">
                                Continuing the legacy of integrity and kindness in the Covina Valley Unified School District.
                            </p>
                            <div className="flex flex-wrap justify-center gap-6 mb-12 text-slate-400 font-bold text-xs uppercase tracking-widest">
                                <button onClick={() => scrollToSection('home')} className="hover:text-white transition-colors">Home</button>
                                <button onClick={() => scrollToSection('about-bill')} className="hover:text-white transition-colors">About</button>
                                <button onClick={() => scrollToSection('eligibility')} className="hover:text-white transition-colors">Eligibility</button>
                                <button onClick={() => scrollToSection('apply')} className="hover:text-white transition-colors">Apply</button>
                                <button onClick={() => scrollToSection('donate')} className="hover:text-white transition-colors">Donate</button>
                            </div>
                            <div className="pt-8 border-t border-white/10 text-center">
                                <p className="text-slate-600 text-[9px] uppercase tracking-[0.5em] text-center">
                                    &copy; {new Date().getFullYear()} Bill Brown Scholarship Fund. All Rights Reserved.
                                </p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Initialize Lucide Icons after render
        setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 500);
    </script>
</body>
</html>
