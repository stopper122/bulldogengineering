<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Hall Pass Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white p-6 shadow-sm border-b border-slate-200">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-indigo-600 tracking-tight">HALL PASS</h1>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Digital Log System</p>
                </div>
                <div class="flex items-center gap-3">
                    <button id="settings-btn" class="text-slate-400 hover:text-indigo-600 transition-colors">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                    <div id="connection-badge" class="flex items-center gap-2 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">
                        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                        <span class="text-[10px] font-bold text-emerald-600 uppercase">Live</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 pb-24">
            <!-- Active Passes Section -->
            <section id="active-passes-section">
                <div class="flex justify-between items-end mb-4">
                    <h2 class="font-black text-slate-800 uppercase text-sm tracking-wide">Active Passes</h2>
                    <span id="active-count" class="text-xs font-bold bg-slate-200 px-2 py-0.5 rounded-md">0</span>
                </div>
                
                <div id="active-list" class="space-y-3">
                    <div id="no-passes-msg" class="text-center py-12 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                        <i class="fa-solid fa-ghost text-slate-300 text-3xl mb-3 block"></i>
                        <p class="text-slate-400 text-sm font-medium">No one is currently out</p>
                    </div>
                </div>
            </section>

            <!-- History Section -->
            <section class="mt-10">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-black text-slate-800 uppercase text-sm tracking-wide">Recent History</h2>
                    <button id="export-btn-quick" class="text-[10px] font-bold text-indigo-600 uppercase tracking-wider hover:underline">Export CSV</button>
                </div>
                <div id="history-list" class="space-y-2 opacity-80">
                    <!-- Dynamic History Here -->
                </div>
            </section>
        </main>

        <!-- Action Bar (Floating) -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-full max-w-md px-6">
            <button id="new-pass-btn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-2xl shadow-slate-400 flex items-center justify-center gap-3 active:scale-95 transition-transform">
                <i class="fa-solid fa-plus"></i>
                Issue New Pass
            </button>
        </div>
    </div>

    <!-- Issue Pass Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-8 transform translate-y-full transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black text-slate-800">New Hall Pass</h3>
                <button id="close-modal" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Student Name</label>
                    <input type="text" id="student-name" placeholder="Type name or select below..." class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-4 outline-none focus:border-indigo-500 transition-colors font-bold">
                    
                    <!-- Quick Select Students -->
                    <div id="quick-student-list" class="flex flex-wrap gap-2 mt-3">
                        <!-- Dynamic Student Chips -->
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Destination</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="dest-opt p-3 rounded-xl border-2 border-slate-100 font-bold text-sm hover:bg-indigo-50 transition-colors" data-val="Restroom">🚽 Restroom</button>
                        <button class="dest-opt p-3 rounded-xl border-2 border-slate-100 font-bold text-sm hover:bg-indigo-50 transition-colors" data-val="Nurse">🏥 Nurse</button>
                        <button class="dest-opt p-3 rounded-xl border-2 border-slate-100 font-bold text-sm hover:bg-indigo-50 transition-colors" data-val="Office">🏫 Office</button>
                        <button class="dest-opt p-3 rounded-xl border-2 border-slate-100 font-bold text-sm hover:bg-indigo-50 transition-colors" data-val="Library">📚 Library</button>
                    </div>
                </div>

                <button id="create-pass-submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black mt-4 shadow-lg shadow-indigo-100">
                    CREATE PASS
                </button>
            </div>
        </div>
    </div>

    <!-- Settings/Management Modal -->
    <div id="settings-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-8 transform translate-y-full transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="settings-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black text-slate-800 text-center flex-1">Settings</h3>
                <button id="close-settings" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="space-y-6">
                <!-- Manual Student Entry -->
                <div>
                    <h4 class="text-xs font-black text-slate-400 uppercase mb-3 tracking-wider">Manage Students</h4>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="new-student-input" placeholder="Add student..." class="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold outline-none focus:border-indigo-500">
                        <button id="add-student-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm">Add</button>
                    </div>
                    <div id="manage-student-list" class="max-h-32 overflow-y-auto space-y-2 border border-slate-100 rounded-xl p-2 bg-slate-50">
                        <!-- List of students with delete icons -->
                    </div>
                </div>

                <!-- Reports & Backup -->
                <div>
                    <h4 class="text-xs font-black text-slate-400 uppercase mb-3 tracking-wider">Reports & Backup</h4>
                    <div class="space-y-2">
                        <button id="export-csv-full" class="w-full flex items-center justify-between p-3 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors text-sm font-bold text-slate-700">
                            <span>Export CSV (Spreadsheet)</span>
                            <i class="fa-solid fa-file-csv text-indigo-500"></i>
                        </button>
                        <button id="export-json-btn" class="w-full flex items-center justify-between p-3 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors text-sm font-bold text-slate-700">
                            <span>Backup All Data (JSON)</span>
                            <i class="fa-solid fa-download text-indigo-500"></i>
                        </button>
                        <label class="w-full flex items-center justify-between p-3 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors text-sm font-bold text-slate-700 cursor-pointer">
                            <span>Restore from Backup</span>
                            <i class="fa-solid fa-upload text-indigo-500"></i>
                            <input type="file" id="restore-json-input" class="hidden" accept=".json">
                        </label>
                    </div>
                </div>

                <!-- Danger Zone -->
                <div class="pt-4 border-t border-slate-100">
                    <h4 class="text-xs font-black text-red-400 uppercase mb-3 tracking-wider">Danger Zone</h4>
                    <button id="clear-data-btn" class="w-full flex items-center gap-3 p-3 border-2 border-red-50 text-red-500 rounded-xl hover:bg-red-50 transition-colors font-bold text-sm">
                        <i class="fa-solid fa-trash-can"></i>
                        Clear All Logs
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, updateDoc, doc, serverTimestamp, deleteDoc, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
            authDomain: "rrtracker-de70e.firebaseapp.com",
            projectId: "rrtracker-de70e",
            storageBucket: "rrtracker-de70e.firebasestorage.app",
            messagingSenderId: "1057987490614",
            appId: "1:1057987490614:web:7c37f2e0a9aa4e735a3997"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = "hall-pass-v1";
        
        let currentUser = null;
        let selectedDest = null;
        let allPasses = [];
        let students = [];

        // UI Management
        const modal = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const settingsModal = document.getElementById('settings-overlay');
        const settingsContent = document.getElementById('settings-content');

        function toggleUI(overlay, content, show) {
            if (show) {
                overlay.classList.remove('hidden');
                setTimeout(() => content.classList.remove('translate-y-full'), 10);
            } else {
                content.classList.add('translate-y-full');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // CSV Export
        function downloadCSV() {
            if (allPasses.length === 0) return;
            const headers = ["Student Name", "Destination", "Departure Time", "Return Time", "Duration (mins)"];
            const rows = allPasses.map(p => {
                const start = p.createdAt ? p.createdAt.toDate().toLocaleString() : "";
                const end = p.returnedAt ? p.returnedAt.toDate().toLocaleString() : "Still Out";
                const dur = calculateDurationRaw(p.createdAt, p.returnedAt);
                return [p.studentName, p.destination, `"${start}"`, `"${end}"`, dur];
            });
            const csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n" + rows.map(e => e.join(",")).join("\n");
            const link = document.createElement("a");
            link.href = encodeURI(csvContent);
            link.download = `hall_pass_log_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        // JSON Backup/Restore
        function downloadJSON() {
            const data = { passes: allPasses, students: students, exportedAt: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `hall_pass_backup_${Date.now()}.json`;
            link.click();
        }

        async function restoreJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!confirm(`Restore ${data.passes?.length || 0} passes and ${data.students?.length || 0} students? Existing data will stay.`)) return;
                    
                    // Restore Students
                    if (data.students) {
                        for (const s of data.students) {
                            const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'students', s.id);
                            await setDoc(ref, { name: s.name });
                        }
                    }
                    // Restore Passes (Simplified - as raw objects)
                    if (data.passes) {
                        const passesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'passes');
                        for (const p of data.passes) {
                            const {id, ...rest} = p;
                            // Convert back to Firestore timestamps if possible or keep as objects
                            await addDoc(passesRef, rest);
                        }
                    }
                    alert("Restore complete!");
                } catch (err) {
                    alert("Invalid backup file.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        // Data Management - Students
        async function addStudent() {
            const input = document.getElementById('new-student-input');
            const name = input.value.trim();
            if (!name) return;
            const ref = collection(db, 'artifacts', APP_ID, 'public', 'data', 'students');
            await addDoc(ref, { name });
            input.value = '';
        }

        async function deleteStudent(id) {
            await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'students', id));
        }

        async function clearAllData() {
            if (!confirm("Are you sure? This will delete all pass logs (Students list will be saved).")) return;
            const passesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'passes');
            const qSnap = await getDocs(passesRef);
            const deletePromises = qSnap.docs.map(d => deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'passes', d.id)));
            await Promise.all(deletePromises);
            toggleUI(settingsModal, settingsContent, false);
        }

        // Auth & Listeners
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                initDataListeners();
            } else {
                signInAnonymously(auth);
            }
        });

        function initDataListeners() {
            if (!currentUser) return;
            
            // Passes Listener
            onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'passes'), (snapshot) => {
                const passes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                passes.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                allPasses = passes;
                renderPasses(passes);
            });

            // Students Listener
            onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'students'), (snapshot) => {
                students = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderStudentUI();
            });
        }

        function formatTime(timestamp) {
            if (!timestamp) return "...";
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function calculateDurationRaw(start, end) {
            if (!start || !end) return "";
            const s = start.toDate ? start.toDate() : new Date(start);
            const e = end.toDate ? end.toDate() : new Date(end);
            return Math.floor((e - s) / 60000);
        }

        function renderPasses(passes) {
            const activeList = document.getElementById('active-list');
            const historyList = document.getElementById('history-list');
            const activeCount = document.getElementById('active-count');
            const noPassesMsg = document.getElementById('no-passes-msg');

            const active = passes.filter(p => !p.returnedAt);
            const history = passes.filter(p => p.returnedAt).slice(0, 15);

            activeCount.innerText = active.length;
            activeList.innerHTML = active.length === 0 ? noPassesMsg.outerHTML : '';
            if (active.length > 0) activeList.querySelector('#no-passes-msg')?.classList.add('hidden');

            active.forEach(pass => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center";
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-xl">${pass.destination.split(' ')[0]}</div>
                        <div>
                            <p class="font-black text-slate-800">${pass.studentName}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Left at ${formatTime(pass.createdAt)}</p>
                        </div>
                    </div>
                    <button class="check-in-btn bg-emerald-50 text-emerald-600 px-4 py-2 rounded-xl text-xs font-black" data-id="${pass.id}">RETURN</button>
                `;
                activeList.appendChild(card);
            });

            historyList.innerHTML = '';
            history.forEach(pass => {
                const item = document.createElement('div');
                item.className = "bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center text-sm shadow-sm";
                item.innerHTML = `
                    <div class="flex items-center gap-2"><span class="font-bold text-slate-600">${pass.studentName}</span></div>
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] text-slate-400">${formatTime(pass.createdAt)}</span>
                        <span class="text-[10px] font-black text-indigo-500 uppercase bg-indigo-50 px-2 py-0.5 rounded">${calculateDurationRaw(pass.createdAt, pass.returnedAt)}m</span>
                    </div>
                `;
                historyList.appendChild(item);
            });

            document.querySelectorAll('.check-in-btn').forEach(btn => {
                btn.onclick = async () => {
                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'passes', btn.dataset.id), { returnedAt: serverTimestamp() });
                };
            });
        }

        function renderStudentUI() {
            const quickList = document.getElementById('quick-student-list');
            const manageList = document.getElementById('manage-student-list');
            
            quickList.innerHTML = '';
            manageList.innerHTML = '';

            students.sort((a,b) => a.name.localeCompare(b.name)).forEach(s => {
                // Quick Select Chips
                const chip = document.createElement('button');
                chip.className = "px-3 py-1.5 bg-slate-100 rounded-full text-xs font-bold text-slate-600 hover:bg-indigo-600 hover:text-white transition-colors";
                chip.innerText = s.name;
                chip.onclick = () => document.getElementById('student-name').value = s.name;
                quickList.appendChild(chip);

                // Management List
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-2 bg-white rounded-lg border border-slate-200";
                item.innerHTML = `
                    <span class="text-xs font-bold">${s.name}</span>
                    <button class="text-red-300 hover:text-red-500 delete-student" data-id="${s.id}"><i class="fa-solid fa-trash-can"></i></button>
                `;
                manageList.appendChild(item);
            });

            document.querySelectorAll('.delete-student').forEach(btn => {
                btn.onclick = () => deleteStudent(btn.dataset.id);
            });
        }

        // Global Event Listeners
        document.getElementById('new-pass-btn').onclick = () => toggleUI(modal, modalContent, true);
        document.getElementById('close-modal').onclick = () => toggleUI(modal, modalContent, false);
        document.getElementById('settings-btn').onclick = () => toggleUI(settingsModal, settingsContent, true);
        document.getElementById('close-settings').onclick = () => toggleUI(settingsModal, settingsContent, false);
        document.getElementById('export-btn-quick').onclick = downloadCSV;
        document.getElementById('export-csv-full').onclick = downloadCSV;
        document.getElementById('export-json-btn').onclick = downloadJSON;
        document.getElementById('restore-json-input').onchange = restoreJSON;
        document.getElementById('add-student-btn').onclick = addStudent;
        document.getElementById('clear-data-btn').onclick = clearAllData;

        document.querySelectorAll('.dest-opt').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.dest-opt').forEach(b => b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600'));
                btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
                selectedDest = btn.innerText;
            };
        });

        document.getElementById('create-pass-submit').onclick = async () => {
            const name = document.getElementById('student-name').value.trim();
            if (!name || !selectedDest) return;
            await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'passes'), {
                studentName: name, destination: selectedDest, createdAt: serverTimestamp(), returnedAt: null
            });
            document.getElementById('student-name').value = '';
            selectedDest = null;
            document.querySelectorAll('.dest-opt').forEach(b => b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600'));
            toggleUI(modal, modalContent, false);
        };
    </script>
</body>
</html>
