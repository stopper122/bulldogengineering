<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall Pass Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6 font-sans">

<div class="max-w-6xl mx-auto grid grid-cols-4 gap-6">

  <!-- MAIN -->
  <div class="col-span-3">

    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-black text-slate-800">Hall Pass Tracker</h1>
      <span id="status" class="text-xs font-bold uppercase text-amber-600">Connecting...</span>
    </div>

    <!-- CONTROLS -->
    <div class="bg-white p-4 rounded-xl shadow mb-6 flex flex-wrap gap-3 items-center">
      <input type="file" id="csv">
      <button onclick="exportData()" class="px-3 py-1 bg-slate-800 text-white rounded text-xs">Export</button>
      <input type="file" id="importJson" class="hidden">
      <button onclick="document.getElementById('importJson').click()" class="px-3 py-1 bg-slate-200 rounded text-xs">Restore</button>
      <button onclick="toggleLog()" class="px-3 py-1 bg-indigo-600 text-white rounded text-xs">Toggle Log</button>

      <!-- PASS TIME SETTING -->
      <div class="flex items-center gap-2 ml-auto">
        <span class="text-xs">Pass Limit (min):</span>
        <input id="limitInput" type="number" min="1" class="w-16 px-2 py-1 border rounded text-xs">
        <button onclick="updateLimit()" class="px-2 py-1 bg-slate-700 text-white rounded text-xs">Set</button>
      </div>
    </div>

    <!-- PERIOD TABS -->
    <div id="periodTabs" class="flex gap-2 mb-4"></div>

    <!-- ACTIVE PASSES -->
    <div id="activeSection" class="mb-6"></div>

    <!-- STUDENTS -->
    <div id="app" class="grid gap-3"></div>

    <div id="log" class="hidden bg-white p-4 rounded-xl shadow mt-6"></div>

  </div>

  <!-- SIDEBAR -->
  <div>
    <div class="bg-white p-4 rounded-xl shadow">
      <h3 class="text-xs font-bold uppercase text-slate-400 mb-3">Watchlist (3+)</h3>
      <div id="watch"></div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
  authDomain: "rrtracker-de70e.firebaseapp.com",
  projectId: "rrtracker-de70e",
  storageBucket: "rrtracker-de70e.firebasestorage.app",
  messagingSenderId: "1057987490614",
  appId: "1:1057987490614:web:7c37f2e0a9aa4e735a3997"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "hallpass", "shared");

let state = {
  students: [],
  activePasses: [],
  logs: [],
  settings: { limitSec: 420 },
  currentPeriod: null
};

let showLog = false;

const appDiv = document.getElementById("app");
const logDiv = document.getElementById("log");
const watchDiv = document.getElementById("watch");
const activeDiv = document.getElementById("activeSection");
const status = document.getElementById("status");
const tabsDiv = document.getElementById("periodTabs");

function formatTime(sec){
  const m=Math.floor(sec/60);
  const s=(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function render() {

  // PERIOD TABS
  const periods = [...new Set(state.students.map(s=>s.period))].sort();
  if(!state.currentPeriod && periods.length) state.currentPeriod = periods[0];

  tabsDiv.innerHTML = periods.map(p=>`
    <button onclick="setPeriod('${p}')" class="px-3 py-1 rounded text-xs ${state.currentPeriod===p?'bg-indigo-600 text-white':'bg-slate-200'}">
      P${p}
    </button>`).join("");

  // ACTIVE
  if(state.activePasses.length > 0){
    activeDiv.innerHTML = `
      <div class="bg-red-50 border border-red-200 rounded-xl p-4">
        <div class="text-xs font-bold uppercase text-red-500 mb-2">Active Passes</div>
        ${state.activePasses.map(p=>{
          const student = state.students.find(s=>s.id===p.id);
          const duration = Math.floor((Date.now()-p.start)/1000);
          return `<div class="text-sm font-mono ${duration>state.settings.limitSec?'text-red-600':''}">${student?.name} - ${formatTime(duration)}</div>`;
        }).join("")}
      </div>`;
  } else activeDiv.innerHTML = "";

  // STUDENTS (filtered by period)
  const filtered = state.students.filter(s=>s.period===state.currentPeriod);

  appDiv.innerHTML = filtered.map(s=>{
    const active = state.activePasses.find(p=>p.id===s.id);
    const duration = active ? Math.floor((Date.now()-active.start)/1000) : 0;
    const remaining = 7 - (s.passesUsed||0);

    return `
      <div class="bg-white border rounded-xl p-4 flex justify-between items-center ${active?'bg-indigo-50 border-indigo-400':''}">
        <div>
          <div class="font-bold">${s.name}</div>
          <div class="text-xs text-slate-400">ID: ${s.id}</div>
        </div>

        <div class="flex items-center gap-4">
          ${active ? `<div class="font-mono text-sm ${duration>state.settings.limitSec?'text-red-600':''}">${formatTime(duration)}</div>` : ''}

          <div class="text-xs">
            <div class="font-bold">Used: ${s.passesUsed||0}</div>
            <div class="text-slate-400">Left: ${remaining}</div>
          </div>

          <!-- MANUAL ADJUST -->
          <div class="flex flex-col gap-1">
            <button onclick="adjustPass('${s.id}',1)" class="text-xs bg-slate-200 px-2 rounded">+</button>
            <button onclick="adjustPass('${s.id}',-1)" class="text-xs bg-slate-200 px-2 rounded">-</button>
          </div>

          <button onclick="togglePass('${s.id}')" class="px-3 py-1 rounded text-xs ${active?'bg-slate-800 text-white':'bg-indigo-600 text-white'}">
            ${active?'Return':'Start'}
          </button>
        </div>
      </div>`;
  }).join("");

  // watchlist
  const flagged = state.students.filter(s => (s.passesUsed||0)>=3);
  watchDiv.innerHTML = flagged.map(s=>`<div class="text-xs mb-1">${s.name} (${s.passesUsed})</div>`).join("") || "<div class='text-xs text-slate-400'>None</div>";

  // log
  if(showLog){
    logDiv.classList.remove("hidden");
    logDiv.innerHTML = state.logs.map(l=>`<div class="text-xs border-b py-1">${l.name} - ${formatTime(l.duration)} - ${l.deducted?'Pass Used':''}</div>`).join("");
  } else logDiv.classList.add("hidden");
}

async function save(){ await setDoc(docRef,state); }

function startSync(){
  onSnapshot(docRef,(snap)=>{
    if(snap.exists()){
      state = snap.data();
      render();
    }
    status.textContent = "Connected";
    status.className = "text-green-600 text-xs font-bold";
  },(err)=>{
    console.error(err);
    status.textContent = "Check Firestore Rules";
    status.className = "text-red-600 text-xs font-bold";
  });
}

window.setPeriod=(p)=>{ state.currentPeriod=p; render(); };

window.adjustPass=(id,delta)=>{
  const s = state.students.find(x=>x.id===id);
  if(!s) return;
  s.passesUsed = Math.max(0,(s.passesUsed||0)+delta);
  save(); render();
};

window.updateLimit=()=>{
  const val = parseInt(document.getElementById("limitInput").value);
  if(val>0){
    state.settings.limitSec = val*60;
    save(); render();
  }
};

window.togglePass=(id)=>{
  const active = state.activePasses.find(p=>p.id===id);
  const student = state.students.find(s=>s.id===id);

  if(active){
    const duration = Math.floor((Date.now()-active.start)/1000);
    const deduct = duration>state.settings.limitSec;

    if(deduct) student.passesUsed=(student.passesUsed||0)+1;

    state.logs.unshift({name:student.name,duration,deducted:deduct});
    state.activePasses = state.activePasses.filter(p=>p.id!==id);

  } else {
    state.activePasses.push({id,start:Date.now()});
  }

  save(); render();
};

window.exportData=()=>{
  const blob=new Blob([JSON.stringify(state)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='backup.json';
  a.click();
};

window.toggleLog=()=>{ showLog=!showLog; render(); };

// CSV

document.getElementById("csv").addEventListener("change", async(e)=>{
  const text=await e.target.files[0].text();
  const lines=text.split("\n");
  for(let i=1;i<lines.length;i++){
    const [period,first,last,id]=lines[i].split(",").map(v=>v?.trim());
    if(!first) continue;
    state.students.push({id:id||Math.random().toString(36).slice(2),name:first+" "+last,period,passesUsed:0});
  }
  save(); render();
});

// Restore

document.getElementById("importJson").addEventListener("change", async(e)=>{
  const data=JSON.parse(await e.target.files[0].text());
  state=data; save(); render();
});

async function init(){
  try {
    console.log("Initializing Firebase...");

    const snap = await getDoc(docRef);

    if(!snap.exists()){
      console.log("Creating initial document...");
      await setDoc(docRef,state);
    }

    startSync();

  } catch(e){
    console.error("INIT ERROR:", e);
    status.textContent = "Connection Error";
    status.className = "text-red-600 text-xs font-bold";
  }
}

init();

setInterval(()=>{
  if(state.activePasses.length>0) render();
},1000);

</script>

</body>
</html>
