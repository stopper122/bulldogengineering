<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Hall Pass Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white p-6 shadow-sm border-b border-slate-200">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-indigo-600 tracking-tight">HALL PASS</h1>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Digital Log System</p>
                </div>
                <div id="connection-badge" class="flex items-center gap-2 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] font-bold text-emerald-600 uppercase">Live</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 pb-24">
            <!-- Active Passes Section -->
            <section id="active-passes-section">
                <div class="flex justify-between items-end mb-4">
                    <h2 class="font-black text-slate-800 uppercase text-sm tracking-wide">Active Passes</h2>
                    <span id="active-count" class="text-xs font-bold bg-slate-200 px-2 py-0.5 rounded-md">0</span>
                </div>
                
                <div id="active-list" class="space-y-3">
                    <!-- Dynamic Passes Here -->
                    <div id="no-passes-msg" class="text-center py-12 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                        <i class="fa-solid fa-ghost text-slate-300 text-3xl mb-3 block"></i>
                        <p class="text-slate-400 text-sm font-medium">No one is currently out</p>
                    </div>
                </div>
            </section>

            <!-- History Section -->
            <section class="mt-10">
                <h2 class="font-black text-slate-800 uppercase text-sm tracking-wide mb-4">Recent History</h2>
                <div id="history-list" class="space-y-2 opacity-60">
                    <!-- Dynamic History Here -->
                </div>
            </section>
        </main>

        <!-- Action Bar (Floating) -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-full max-w-md px-6">
            <button id="new-pass-btn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-2xl shadow-slate-400 flex items-center justify-center gap-3 active:scale-95 transition-transform">
                <i class="fa-solid fa-plus"></i>
                Issue New Pass
            </button>
        </div>
    </div>

    <!-- Issue Pass Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-8 transform translate-y-full transition-transform duration-300" id="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black text-slate-800">New Hall Pass</h3>
                <button id="close-modal" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Student Name</label>
                    <input type="text" id="student-name" placeholder="Enter name..." class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-4 outline-none focus:border-indigo-500 transition-colors font-bold">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Destination</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="dest-opt p-3 rounded-xl border-2 border-slate-100 font-bold text-sm hover:bg-indigo-50 transition-colors" data-val="Restroom">🚽 Restroom</button>
                        <button class="dest-opt p-3 rounded-xl border-2 border-slate-100 font-bold text-sm hover:bg-indigo-50 transition-colors" data-val="Nurse">🏥 Nurse</button>
                        <button class="dest-opt p-3 rounded-xl border-2 border-slate-100 font-bold text-sm hover:bg-indigo-50 transition-colors" data-val="Office">🏫 Office</button>
                        <button class="dest-opt p-3 rounded-xl border-2 border-slate-100 font-bold text-sm hover:bg-indigo-50 transition-colors" data-val="Library">📚 Library</button>
                    </div>
                </div>

                <button id="create-pass-submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black mt-4 shadow-lg shadow-indigo-100">
                    CREATE PASS
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Verified Config
        const firebaseConfig = {
            apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
            authDomain: "rrtracker-de70e.firebaseapp.com",
            projectId: "rrtracker-de70e",
            storageBucket: "rrtracker-de70e.firebasestorage.app",
            messagingSenderId: "1057987490614",
            appId: "1:1057987490614:web:7c37f2e0a9aa4e735a3997"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = "hall-pass-v1";
        
        let currentUser = null;
        let selectedDest = null;

        // UI Helpers
        const modal = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');

        function toggleModal(show) {
            if (show) {
                modal.classList.remove('hidden');
                setTimeout(() => modalContent.classList.remove('translate-y-full'), 10);
            } else {
                modalContent.classList.add('translate-y-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        // Auth Logic
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                initDataListeners();
            } else {
                signInAnonymously(auth).catch(err => console.error("Auth error:", err));
            }
        });

        // Database Listeners
        function initDataListeners() {
            if (!currentUser) return;

            // Listen for Active/Recent Passes
            const passesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'passes');
            
            onSnapshot(passesRef, (snapshot) => {
                const passes = [];
                snapshot.forEach(doc => passes.push({ id: doc.id, ...doc.data() }));
                
                // Sort by time (newest first)
                passes.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                
                renderPasses(passes);
            }, (err) => console.error("Firestore Listen Error:", err));
        }

        function formatTime(timestamp) {
            if (!timestamp) return "...";
            const date = timestamp.toDate();
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function calculateDuration(start, end) {
            if (!start || !end) return "";
            const diff = Math.floor((end.toDate() - start.toDate()) / 60000);
            return `${diff}m`;
        }

        function renderPasses(passes) {
            const activeList = document.getElementById('active-list');
            const historyList = document.getElementById('history-list');
            const activeCount = document.getElementById('active-count');
            const noPassesMsg = document.getElementById('no-passes-msg');

            const active = passes.filter(p => !p.returnedAt);
            const history = passes.filter(p => p.returnedAt).slice(0, 10);

            activeCount.innerText = active.length;
            noPassesMsg.classList.toggle('hidden', active.length > 0);

            // Render Active
            activeList.innerHTML = active.length > 0 ? '' : noPassesMsg.outerHTML;
            active.forEach(pass => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center animate-in fade-in slide-in-from-bottom-2 duration-300";
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-xl">
                            ${pass.destination.split(' ')[0]}
                        </div>
                        <div>
                            <p class="font-black text-slate-800">${pass.studentName}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Left at ${formatTime(pass.createdAt)}</p>
                        </div>
                    </div>
                    <button class="check-in-btn bg-emerald-50 text-emerald-600 px-4 py-2 rounded-xl text-xs font-black hover:bg-emerald-100 transition-colors" data-id="${pass.id}">
                        RETURN
                    </button>
                `;
                activeList.appendChild(card);
            });

            // Render History
            historyList.innerHTML = '';
            history.forEach(pass => {
                const item = document.createElement('div');
                item.className = "bg-white/50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-sm";
                item.innerHTML = `
                    <span class="font-bold text-slate-600">${pass.studentName} <span class="text-slate-300 font-medium">to</span> ${pass.destination}</span>
                    <span class="text-[10px] font-black text-slate-400 uppercase">${calculateDuration(pass.createdAt, pass.returnedAt)}</span>
                `;
                historyList.appendChild(item);
            });

            // Attach Check-in Events
            document.querySelectorAll('.check-in-btn').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    const passRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'passes', id);
                    await updateDoc(passRef, { returnedAt: serverTimestamp() });
                };
            });
        }

        // Create Pass Logic
        document.getElementById('new-pass-btn').onclick = () => toggleModal(true);
        document.getElementById('close-modal').onclick = () => toggleModal(false);

        document.querySelectorAll('.dest-opt').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.dest-opt').forEach(b => b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600'));
                btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
                selectedDest = btn.dataset.val;
                if (btn.innerText.includes('🚽')) selectedDest = '🚽 Restroom';
                if (btn.innerText.includes('🏥')) selectedDest = '🏥 Nurse';
                if (btn.innerText.includes('🏫')) selectedDest = '🏫 Office';
                if (btn.innerText.includes('📚')) selectedDest = '📚 Library';
            };
        });

        document.getElementById('create-pass-submit').onclick = async () => {
            const name = document.getElementById('student-name').value.trim();
            if (!name || !selectedDest) return;

            const passesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'passes');
            await addDoc(passesRef, {
                studentName: name,
                destination: selectedDest,
                createdAt: serverTimestamp(),
                returnedAt: null,
                issuerUid: currentUser.uid
            });

            // Reset and close
            document.getElementById('student-name').value = '';
            selectedDest = null;
            document.querySelectorAll('.dest-opt').forEach(b => b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600'));
            toggleModal(false);
        };
    </script>
</body>
</html>
