<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Connection Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-slate-200">
        <h1 class="text-2xl font-black mb-2 text-slate-800">Connection Tester</h1>
        <p class="text-slate-500 text-sm mb-6">Checking if your app can reach the cloud database...</p>

        <div id="status-container" class="space-y-4">
            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                <span class="text-sm font-bold text-slate-600">Config Variables</span>
                <span id="step-vars" class="text-xs font-black px-2 py-1 rounded bg-amber-100 text-amber-600 uppercase">Waiting...</span>
            </div>
            
            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                <span class="text-sm font-bold text-slate-600">Authentication</span>
                <span id="step-auth" class="text-xs font-black px-2 py-1 rounded bg-slate-200 text-slate-400 uppercase">Pending</span>
            </div>

            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                <span class="text-sm font-bold text-slate-600">Database Read</span>
                <span id="step-db" class="text-xs font-black px-2 py-1 rounded bg-slate-200 text-slate-400 uppercase">Pending</span>
            </div>
        </div>

        <!-- Manual Override Section -->
        <div id="manual-config-area" class="mt-6 hidden">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Manual Config Override</p>
            <textarea id="manual-config-input" placeholder='Paste {"apiKey": "...", ...} here' class="w-full h-20 p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-[10px] outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <button id="apply-manual-btn" class="mt-2 w-full py-2 bg-slate-800 text-white rounded-lg text-xs font-bold">Apply & Retry</button>
        </div>

        <div id="debug-log" class="mt-8 p-4 bg-slate-900 rounded-xl font-mono text-[10px] text-emerald-400 h-40 overflow-y-auto no-scrollbar">
            > Initializing test sequence...<br>
        </div>

        <div class="flex gap-2 mt-6">
            <button id="retry-btn" class="hidden flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">
                Retry Auto
            </button>
            <button id="show-manual-btn" class="hidden flex-1 py-3 bg-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-300 transition-all">
                Manual Fix
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const log = (msg, isError = false) => {
            const el = document.getElementById('debug-log');
            const span = document.createElement('div');
            span.innerHTML = `> ${msg}`;
            if (isError) span.className = 'text-red-400';
            el.appendChild(span);
            el.scrollTop = el.scrollHeight;
        };

        const setStep = (id, status, type) => {
            const el = document.getElementById(id);
            el.innerText = status;
            const colors = {
                wait: 'bg-amber-100 text-amber-600',
                ok: 'bg-emerald-100 text-emerald-600',
                fail: 'bg-red-100 text-red-600',
                off: 'bg-slate-200 text-slate-400'
            };
            el.className = `text-xs font-black px-2 py-1 rounded uppercase ${colors[type]}`;
        };

        async function runTest(manualConfig = null) {
            log("Starting connection test...");
            document.getElementById('retry-btn').classList.add('hidden');
            document.getElementById('show-manual-btn').classList.add('hidden');

            // STEP 1: Polling for injected config or use manual
            let config = manualConfig;
            
            if (!config) {
                let attempts = 0;
                const maxAttempts = 50; // 5 seconds

                const waitForConfig = async () => {
                    return new Promise((resolve) => {
                        const check = () => {
                            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                                resolve(JSON.parse(__firebase_config));
                            } else if (attempts < maxAttempts) {
                                attempts++;
                                if (attempts % 10 === 0) log(`Searching for variables... (${attempts/10}s)`);
                                setTimeout(check, 100);
                            } else {
                                resolve(null);
                            }
                        };
                        check();
                    });
                };
                config = await waitForConfig();
            }

            if (!config) {
                setStep('step-vars', 'Missing', 'fail');
                log("Error: Configuration variables not found.", true);
                log("Try clicking 'Manual Fix' if this persists.", true);
                document.getElementById('retry-btn').classList.remove('hidden');
                document.getElementById('show-manual-btn').classList.remove('hidden');
                return;
            }

            setStep('step-vars', 'Found', 'ok');
            log("Firebase config detected successfully.");

            // STEP 2: Initialize and Auth
            try {
                const app = initializeApp(config);
                const auth = getAuth(app);
                const db = getFirestore(app);
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'test-app';

                setStep('step-auth', 'Authenticating', 'wait');
                log("Attempting sign-in...");

                let userCredential;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    log("Using custom token...");
                    userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    log("Using anonymous login fallback...");
                    userCredential = await signInAnonymously(auth);
                }

                const user = userCredential.user;
                setStep('step-auth', 'Success', 'ok');
                log(`Authenticated UID: ${user.uid}`);

                // STEP 3: Test Firestore Read/Write
                setStep('step-db', 'Testing', 'wait');
                log("Testing Firestore write/read...");

                const testRef = doc(db, 'artifacts', appId, 'users', user.uid, 'test', 'ping');
                await setDoc(testRef, { timestamp: Date.now(), status: 'online' });
                log("Write operation successful.");

                const snap = await getDoc(testRef);
                if (snap.exists()) {
                    setStep('step-db', 'Online', 'ok');
                    log("Read operation successful. Cloud is active!");
                } else {
                    throw new Error("Document not found after write.");
                }

            } catch (e) {
                log(`Critical Failure: ${e.message}`, true);
                setStep('step-auth', 'Failed', 'fail');
                setStep('step-db', 'Blocked', 'fail');
                document.getElementById('retry-btn').classList.remove('hidden');
                document.getElementById('show-manual-btn').classList.remove('hidden');
            }
        }

        document.getElementById('retry-btn').onclick = () => {
            log("--- Restarting Auto ---");
            runTest();
        };

        document.getElementById('show-manual-btn').onclick = () => {
            document.getElementById('manual-config-area').classList.toggle('hidden');
        };

        document.getElementById('apply-manual-btn').onclick = () => {
            const val = document.getElementById('manual-config-input').value.trim();
            try {
                const parsed = JSON.parse(val);
                log("Applying manual configuration...");
                runTest(parsed);
            } catch (e) {
                log("Invalid JSON format in manual input.", true);
            }
        };

        // Start immediately
        runTest();

    </script>
</body>
</html>
