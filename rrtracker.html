<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Pass Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        #data-menu { display: none; transform: translateY(-10px); opacity: 0; transition: all 0.2s ease; }
        #data-menu.show { display: block; transform: translateY(0); opacity: 1; }
        .row-active { background-color: #f0f4ff; border-left: 4px solid #4f46e5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #force-local { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-3xl font-black tracking-tight text-slate-900">Hall Pass <span class="text-indigo-600">Pro</span></h1>
                    <div id="cloud-status" class="px-2 py-1 bg-amber-100 text-amber-600 rounded text-[10px] font-bold uppercase tracking-widest transition-all text-nowrap">Initializing...</div>
                    <button id="force-local" class="px-2 py-1 bg-slate-200 text-slate-600 rounded text-[10px] font-bold uppercase hover:bg-slate-300 transition-all">Skip Cloud</button>
                </div>
                <div class="flex items-center gap-2 mt-2">
                    <p class="text-slate-500 text-sm">Sync Code:</p>
                    <input type="text" id="sync-code-input" placeholder="Enter a code" class="bg-white border border-slate-200 rounded px-2 py-0.5 text-xs font-bold text-indigo-600 w-32 focus:ring-1 focus:ring-indigo-500 outline-none">
                    <button id="set-sync-code" class="text-[10px] font-bold text-slate-400 hover:text-indigo-600 uppercase tracking-tighter">Set Code</button>
                </div>
            </div>

            <div class="flex gap-2 relative">
                <button id="add-btn" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-indigo-100 active:scale-95 transition-all">
                    + Add Student
                </button>
                
                <div class="relative">
                    <button id="menu-trigger" class="bg-white border border-slate-200 text-slate-700 px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm active:bg-slate-50">
                        Data Tools
                    </button>
                    <div id="data-menu" class="absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-2xl shadow-2xl py-2 z-[200]">
                        <button id="btn-import-csv" class="w-full text-left px-4 py-3 text-xs font-bold hover:bg-slate-50">Import CSV</button>
                        <button id="btn-export-json" class="w-full text-left px-4 py-3 text-xs font-bold hover:bg-slate-50">Export Backup (.json)</button>
                        <button id="btn-restore-json" class="w-full text-left px-4 py-3 text-xs font-bold hover:bg-slate-50 border-b border-slate-100">Restore from File</button>
                        <button id="btn-wipe" class="w-full text-left px-4 py-3 text-xs font-bold text-red-600 hover:bg-red-50">Wipe All Data</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-3">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Out Now</span>
                        <p id="stat-out" class="text-2xl font-black text-indigo-600">0</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Today's Trips</span>
                        <p id="stat-trips" class="text-2xl font-black text-slate-800">0</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Students</span>
                        <p id="stat-total" class="text-2xl font-black text-slate-800">0</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Limit</span>
                        <p class="text-2xl font-black text-slate-800">7</p>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200/50 overflow-hidden min-h-[400px]">
                    <div id="period-bar" class="flex gap-2 p-4 border-b border-slate-50 overflow-x-auto no-scrollbar"></div>
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <tr>
                                <th class="px-6 py-4">Student</th>
                                <th class="px-6 py-4">Overage (Limit 7)</th>
                                <th class="px-6 py-4 text-right">Pass</th>
                            </tr>
                        </thead>
                        <tbody id="student-table" class="divide-y divide-slate-50"></tbody>
                    </table>
                    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center px-6">
                        <h3 class="font-bold text-slate-800">No students found</h3>
                        <p class="text-slate-500 text-sm mb-6">Add a student or restore a backup to begin.</p>
                        <button id="empty-restore-btn" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold text-sm">Upload Backup</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white rounded-[2rem] shadow-lg border border-slate-200/50 p-6 sticky top-8">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Watchlist (3+ Passes)</h3>
                    <div id="watchlist" class="space-y-3">
                        <p class="text-xs text-slate-400 italic">No students flagged yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="input-csv" accept=".csv" class="hidden">
    <input type="file" id="input-json" accept=".json" class="hidden">

    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-sm p-8 shadow-2xl">
            <h2 id="modal-title" class="text-xl font-black mb-6">Student Details</h2>
            <div class="space-y-4">
                <input type="hidden" id="field-id">
                <input type="text" id="field-name" placeholder="Student Name" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
                <input type="text" id="field-period" placeholder="Period (e.g. 1)" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
            </div>
            <div class="flex gap-3 mt-8">
                <button id="modal-cancel" class="flex-1 py-3 text-slate-400 font-bold text-sm uppercase">Cancel</button>
                <button id="modal-save" class="flex-[1.5] py-3 bg-indigo-600 text-white rounded-xl font-black text-sm uppercase shadow-lg shadow-indigo-100">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Global State
        let db, auth, user;
        let state = { students: [], activePasses: [], currentPeriod: '1', syncCode: '' };
        let isSaving = false;
        let syncUnsubscribe = null;

        // Use environment provided variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hall-pass-pro-v1';
        const STORAGE_KEY = `hallpass_local_cache_${appId}`;
        const CODE_KEY = `hallpass_sync_code_${appId}`;
        
        const updateStatus = (text, type = 'amber') => {
            const el = document.getElementById('cloud-status');
            if (!el) return;
            el.innerText = text;
            const colors = { 
                amber: 'bg-amber-100 text-amber-600', 
                emerald: 'bg-emerald-100 text-emerald-600', 
                red: 'bg-red-100 text-red-600' 
            };
            el.className = `px-2 py-1 rounded text-[10px] font-bold uppercase tracking-widest transition-all ${colors[type] || colors.amber}`;
        };

        const render = () => {
            const list = document.getElementById('student-table');
            const empty = document.getElementById('empty-state');
            const watchlistEl = document.getElementById('watchlist');
            if (!list) return;

            document.getElementById('stat-out').innerText = state.activePasses.length;
            document.getElementById('stat-total').innerText = state.students.length;
            document.getElementById('stat-trips').innerText = state.students.reduce((acc, s) => acc + (s.history?.length || 0), 0);

            const flagged = state.students.filter(s => (s.passesUsed || 0) >= 3).sort((a,b) => (b.passesUsed || 0) - (a.passesUsed || 0));
            watchlistEl.innerHTML = flagged.length ? flagged.map(s => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <div><p class="text-sm font-bold text-slate-700">${s.name}</p><p class="text-[10px] text-slate-400 font-bold uppercase">P${s.period}</p></div>
                    <span class="px-2 py-1 bg-red-100 text-red-600 rounded-lg text-xs font-black">${s.passesUsed}</span>
                </div>`).join('') : '<p class="text-xs text-slate-400 italic">No students flagged yet.</p>';

            if (state.students.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                document.getElementById('period-bar').innerHTML = '';
                return;
            }
            empty.classList.add('hidden');

            const periods = [...new Set(state.students.map(s => s.period))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
            if (!periods.includes(state.currentPeriod)) state.currentPeriod = periods[0] || '1';

            document.getElementById('period-bar').innerHTML = periods.map(p => `
                <button class="px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${state.currentPeriod === p ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}" 
                onclick="window.setPeriod('${p}')">Period ${p}</button>`).join('');

            const filtered = state.students.filter(s => s.period === state.currentPeriod);
            list.innerHTML = filtered.map(s => {
                const isOut = state.activePasses.some(p => p.sid === s.id);
                return `
                <tr class="${isOut ? 'row-active' : ''}">
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-slate-700">${s.name}</span>
                            <div class="flex gap-1">
                                <button onclick="window.editStud('${s.id}')" class="text-slate-300 hover:text-indigo-500 p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2" stroke-linecap="round"></path></svg></button>
                                <button onclick="window.delStud('${s.id}')" class="text-slate-300 hover:text-red-500 p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round"></path></svg></button>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-2">
                            <button onclick="window.adjPass('${s.id}', -1)" class="w-8 h-8 bg-slate-100 rounded-lg font-bold">-</button>
                            <span class="font-black text-sm w-6 text-center ${s.passesUsed >= 7 ? 'text-red-600' : 'text-slate-700'}">${s.passesUsed || 0}</span>
                            <button onclick="window.adjPass('${s.id}', 1)" class="w-8 h-8 bg-slate-100 rounded-lg font-bold">+</button>
                        </div>
                    </td>
                    <td class="px-6 py-5 text-right">
                        <button onclick="window.togglePass('${s.id}')" class="px-5 py-2.5 rounded-xl text-[10px] font-black uppercase ${isOut ? 'bg-slate-900 text-white shadow-inner' : 'bg-indigo-50 text-indigo-600'} transition-all active:scale-95">
                            ${isOut ? 'Return' : 'Issue'}
                        </button>
                    </td>
                </tr>`;
            }).join('');
        };

        const syncToCloud = async () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            render(); 
            
            if (!user || !db) return;
            
            isSaving = true;
            updateStatus('Saving...', 'amber');
            try {
                let dataRef;
                if (state.syncCode) {
                    dataRef = doc(db, 'artifacts', appId, 'public', 'data', `shared_${state.syncCode}`);
                } else {
                    dataRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'hallpass_state');
                }

                await setDoc(dataRef, {
                    students: state.students,
                    activePasses: state.activePasses,
                    updatedAt: Date.now()
                });
                updateStatus(state.syncCode ? `Linked: ${state.syncCode}` : 'Cloud Synced', 'emerald');
            } catch (e) {
                console.error("Save failed:", e);
                updateStatus('Offline Mode', 'amber');
            } finally {
                isSaving = false;
            }
        };

        const setupSync = async () => {
            if (!user || !db) {
                updateStatus('Waiting for Auth...', 'amber');
                return;
            }
            if (syncUnsubscribe) syncUnsubscribe();
            
            let dataRef;
            if (state.syncCode) {
                dataRef = doc(db, 'artifacts', appId, 'public', 'data', `shared_${state.syncCode}`);
            } else {
                dataRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'hallpass_state');
            }
            
            updateStatus('Syncing...', 'amber');

            try {
                const snap = await getDoc(dataRef);
                if (snap.exists()) {
                    const data = snap.data();
                    state.students = data.students || [];
                    state.activePasses = data.activePasses || [];
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                    render();
                }
            } catch (e) {
                console.warn("Initial sync check failed.");
            }
            
            syncUnsubscribe = onSnapshot(dataRef, (snap) => {
                if (snap.exists() && !isSaving) {
                    const data = snap.data();
                    state.students = data.students || [];
                    state.activePasses = data.activePasses || [];
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                    render();
                }
                updateStatus(state.syncCode ? `Linked: ${state.syncCode}` : 'Cloud Synced', 'emerald');
                document.getElementById('force-local').style.display = 'none';
            }, (err) => {
                console.error("Firestore error:", err);
                updateStatus('Sync Blocked', 'red');
            });
        };

        const startFirebase = async () => {
            if (typeof __firebase_config === 'undefined') {
                throw new Error("Config Missing");
            }
            
            updateStatus('Connecting...', 'amber');
            const config = JSON.parse(__firebase_config);
            const app = initializeApp(config);
            auth = getAuth(app);
            db = getFirestore(app);

            onAuthStateChanged(auth, async (u) => {
                if (u) {
                    user = u;
                    await setupSync();
                }
            });

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        const init = async () => {
            // Load code & local data first
            const cachedCode = localStorage.getItem(CODE_KEY);
            if (cachedCode) {
                state.syncCode = cachedCode;
                document.getElementById('sync-code-input').value = cachedCode;
            }

            const cached = localStorage.getItem(STORAGE_KEY);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    state.students = parsed.students || [];
                    state.activePasses = parsed.activePasses || [];
                    render();
                } catch(e) {}
            }

            // Attempt Firebase with retries
            let attempts = 0;
            const tryInit = async () => {
                try {
                    await startFirebase();
                } catch (e) {
                    attempts++;
                    if (attempts < 5) {
                        setTimeout(tryInit, 1000 * Math.pow(2, attempts - 1));
                    } else {
                        updateStatus('Local Mode', 'amber');
                        document.getElementById('force-local').style.display = 'none';
                    }
                }
            };
            
            tryInit();
        };

        // UI Handlers
        window.setPeriod = (p) => { state.currentPeriod = p; render(); };
        window.togglePass = (id) => {
            const outIdx = state.activePasses.findIndex(p => p.sid === id);
            if (outIdx > -1) { state.activePasses.splice(outIdx, 1); } 
            else {
                state.activePasses.push({ sid: id, start: Date.now() });
                const s = state.students.find(x => x.id === id);
                if (s) { s.history = s.history || []; s.history.push(Date.now()); }
            }
            syncToCloud();
        };
        window.adjPass = (id, delta) => {
            const s = state.students.find(x => x.id === id);
            if (s) { s.passesUsed = Math.max(0, (s.passesUsed || 0) + delta); syncToCloud(); }
        };
        window.delStud = (id) => { if (confirm("Delete student?")) { state.students = state.students.filter(s => s.id !== id); state.activePasses = state.activePasses.filter(p => p.sid !== id); syncToCloud(); } };
        window.editStud = (id) => {
            const s = state.students.find(x => x.id === id);
            if (!s) return;
            document.getElementById('field-id').value = s.id;
            document.getElementById('field-name').value = s.name;
            document.getElementById('field-period').value = s.period;
            document.getElementById('modal-title').innerText = "Edit Student";
            document.getElementById('modal-backdrop').classList.remove('hidden');
        };

        document.addEventListener('DOMContentLoaded', () => {
            const menuTrigger = document.getElementById('menu-trigger');
            const dataMenu = document.getElementById('data-menu');
            const inputCsv = document.getElementById('input-csv');
            const inputJson = document.getElementById('input-json');
            const codeInput = document.getElementById('sync-code-input');
            const codeBtn = document.getElementById('set-sync-code');

            codeBtn.onclick = () => {
                const code = codeInput.value.trim().toUpperCase();
                state.syncCode = code;
                if (code) {
                    localStorage.setItem(CODE_KEY, code);
                } else {
                    localStorage.removeItem(CODE_KEY);
                }
                setupSync();
                syncToCloud();
            };

            document.getElementById('force-local').onclick = () => {
                updateStatus('Local Mode', 'amber');
                document.getElementById('force-local').style.display = 'none';
            };

            menuTrigger.onclick = (e) => { e.stopPropagation(); dataMenu.classList.toggle('show'); };
            document.addEventListener('click', () => dataMenu.classList.remove('show'));

            document.getElementById('add-btn').onclick = () => {
                document.getElementById('field-id').value = '';
                document.getElementById('field-name').value = '';
                document.getElementById('field-period').value = state.currentPeriod;
                document.getElementById('modal-title').innerText = "Add Student";
                document.getElementById('modal-backdrop').classList.remove('hidden');
            };

            document.getElementById('modal-cancel').onclick = () => document.getElementById('modal-backdrop').classList.add('hidden');
            document.getElementById('modal-save').onclick = () => {
                const id = document.getElementById('field-id').value;
                const name = document.getElementById('field-name').value.trim();
                const per = document.getElementById('field-period').value.trim() || '1';
                if (name) {
                    if (id) {
                        const s = state.students.find(x => x.id === id);
                        if (s) { s.name = name; s.period = per; }
                    } else {
                        state.students.push({ id: Date.now().toString(), name, period: per, passesUsed: 0, history: [] });
                    }
                    syncToCloud();
                    document.getElementById('modal-backdrop').classList.add('hidden');
                }
            };

            document.getElementById('btn-export-json').onclick = () => {
                const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `hallpass_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            document.getElementById('btn-wipe').onclick = () => { 
                if (confirm("Permanently wipe all student data?")) { 
                    state.students = []; 
                    state.activePasses = []; 
                    localStorage.removeItem(STORAGE_KEY);
                    syncToCloud(); 
                } 
            };

            document.getElementById('btn-import-csv').onclick = () => inputCsv.click();
            document.getElementById('btn-restore-json').onclick = () => inputJson.click();
            document.getElementById('empty-restore-btn').onclick = () => inputJson.click();

            inputCsv.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const r = new FileReader();
                r.onload = (ev) => {
                    ev.target.result.split('\n').filter(l => l.trim()).forEach(l => {
                        const [name, per] = l.split(',').map(v => v?.trim());
                        if (name) state.students.push({ id: Math.random().toString(36).substr(2,9), name, period: per || '1', passesUsed: 0, history: [] });
                    });
                    syncToCloud();
                    inputCsv.value = '';
                };
                r.readAsText(file);
            };

            inputJson.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const r = new FileReader();
                r.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.students) { 
                            state = data; 
                            syncToCloud(); 
                        }
                    } catch (err) { alert("Invalid backup file."); }
                    inputJson.value = '';
                };
                r.readAsText(file);
            };

            init();
        });
    </script>
</body>
</html>
