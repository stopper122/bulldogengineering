<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall Pass Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6 font-sans">

<div class="max-w-6xl mx-auto">

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-black">Hall Pass Tracker</h1>
    <span id="status" class="text-xs font-bold">Connecting...</span>
  </div>

  <input id="search" placeholder="Search student..." class="w-full mb-4 px-3 py-2 border rounded">

  <div id="periodTabs" class="flex gap-2 mb-4"></div>

  <div id="active" class="mb-4"></div>

  <div id="students" class="grid gap-2"></div>

  <div class="mt-6">
    <h3 class="font-bold mb-2">Watchlist (3+)</h3>
    <div id="watch"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
  authDomain: "rrtracker-de70e.firebaseapp.com",
  projectId: "rrtracker-de70e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "hallpass", "shared");

let state = {
  students: [],
  active: [],
  logs: [],
  settings: { limit: 420, max: 5 },
  period: null
};

const elStudents = document.getElementById("students");
const elTabs = document.getElementById("periodTabs");
const elActive = document.getElementById("active");
const elWatch = document.getElementById("watch");
const status = document.getElementById("status");

function time(sec){
  const m = Math.floor(sec/60);
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function render(){

  // periods
  const periods = [...new Set(state.students.map(s=>s.period))];
  if(!state.period && periods.length) state.period = periods[0];

  elTabs.innerHTML = periods.map(p=>{
    const btn = document.createElement("button");
    btn.textContent = "P"+p;
    btn.className = "px-3 py-1 rounded " + (p===state.period?"bg-indigo-600 text-white":"bg-gray-200");
    btn.onclick = ()=>{ state.period=p; render(); };
    return btn.outerHTML;
  }).join("");

  // active
  elActive.innerHTML = state.active.map(a=>{
    const s = state.students.find(x=>x.id===a.id);
    const d = Math.floor((Date.now()-a.start)/1000);
    return `<div class="text-sm ${d>state.settings.limit?'text-red-600':''}">${s?.name} ${time(d)}</div>`;
  }).join("");

  // students
  const list = state.students.filter(s=>s.period===state.period);

  elStudents.innerHTML = "";

  list.forEach(s=>{
    const row = document.createElement("div");
    row.className = "bg-white p-2 rounded flex justify-between";

    const active = state.active.find(a=>a.id===s.id);
    const d = active ? Math.floor((Date.now()-active.start)/1000) : 0;

    row.innerHTML = `
      <div>${s.name}</div>
      <div class="flex gap-2 items-center">
        ${active?`<span>${time(d)}</span>`:""}
        <span>${s.passesUsed||0}/${state.settings.max}</span>
        <button class="add">+</button>
        <button class="sub">-</button>
        <button class="edit">Edit</button>
        <button class="del bg-red-500 text-white px-2">X</button>
        <button class="toggle bg-indigo-600 text-white px-2">${active?'Return':'Start'}</button>
      </div>`;

    // attach handlers (simple + reliable)
    row.querySelector(".add").onclick = ()=>adjust(s.id,1);
    row.querySelector(".sub").onclick = ()=>adjust(s.id,-1);
    row.querySelector(".edit").onclick = ()=>edit(s.id);
    row.querySelector(".del").onclick = ()=>del(s.id);
    row.querySelector(".toggle").onclick = ()=>toggle(s.id);

    elStudents.appendChild(row);
  });

  // watchlist
  const flagged = state.students.filter(s=>s.passesUsed>=3);
  elWatch.innerHTML = flagged.map(s=>`${s.name} (${s.passesUsed})`).join("<br>") || "None";
}

async function save(){ await setDoc(ref,state); }

function sync(){
  onSnapshot(ref,s=>{
    if(s.exists()) state = s.data();
    render();
    status.textContent = "Connected";
  });
}

function toggle(id){
  const a = state.active.find(x=>x.id===id);
  const s = state.students.find(x=>x.id===id);

  if(a){
    const d = Math.floor((Date.now()-a.start)/1000);
    if(d>state.settings.limit) s.passesUsed++;
    state.active = state.active.filter(x=>x.id!==id);
  } else {
    state.active.push({id,start:Date.now()});
  }

  save();
}

function adjust(id,n){
  const s = state.students.find(x=>x.id===id);
  s.passesUsed = Math.max(0,(s.passesUsed||0)+n);
  save();
}

function edit(id){
  const s = state.students.find(x=>x.id===id);
  const name = prompt("Name",s.name);
  const p = prompt("Period",s.period);
  if(name) s.name=name;
  if(p) s.period=p;
  save();
}

function del(id){
  if(confirm("Delete?")){
    state.students = state.students.filter(x=>x.id!==id);
    save();
  }
}

async function init(){
  const s = await getDoc(ref);
  if(!s.exists()) await setDoc(ref,state);
  sync();
}

init();
setInterval(()=>render(),1000);

</script>

</body>
</html>
