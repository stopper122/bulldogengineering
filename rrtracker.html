<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall Pass Tracker Pro (Fully Fixed)</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6 font-sans">

<div class="max-w-4xl mx-auto">

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-black text-slate-800">Hall Pass Tracker</h1>
    <span id="status" class="text-xs font-bold uppercase text-amber-600">Connecting...</span>
  </div>

  <div class="bg-white p-4 rounded-xl shadow mb-6 flex justify-between items-center">
    <input type="file" id="csv" class="text-sm">
    <span class="text-xs text-slate-400">CSV: period, first, last, id</span>
  </div>

  <div id="app" class="grid gap-3"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// ✅ Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
  authDomain: "rrtracker-de70e.firebaseapp.com",
  projectId: "rrtracker-de70e",
  storageBucket: "rrtracker-de70e.firebasestorage.app",
  messagingSenderId: "1057987490614",
  appId: "1:1057987490614:web:7c37f2e0a9aa4e735a3997"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ✅ Use fixed document (no auth needed)
const docRef = doc(db, "hallpass", "shared_data");

let state = { students: [], activePasses: [] };

const status = document.getElementById("status");
const appDiv = document.getElementById("app");

function render() {
  appDiv.innerHTML = state.students.map(s => {
    const isOut = state.activePasses.includes(s.id);
    return `
      <div class="bg-white border rounded-xl p-4 flex justify-between items-center shadow-sm ${isOut ? 'border-indigo-500 bg-indigo-50' : ''}">
        <div>
          <div class="font-bold text-slate-800">${s.name}</div>
          <div class="text-xs text-slate-400">Period ${s.period}</div>
        </div>
        <div class="flex items-center gap-4">
          <div class="text-sm font-bold ${s.passesUsed >= 7 ? 'text-red-600' : 'text-slate-700'}">
            ${s.passesUsed || 0}/7
          </div>
          <button onclick="togglePass('${s.id}')" class="px-3 py-1 rounded-lg text-xs font-bold ${isOut ? 'bg-slate-800 text-white' : 'bg-indigo-600 text-white'}">
            ${isOut ? 'Return' : 'Start'}
          </button>
        </div>
      </div>
    `;
  }).join("");
}

async function syncToCloud() {
  try {
    await setDoc(docRef, state);
  } catch (e) {
    console.error(e);
    status.textContent = "Write Failed";
    status.className = "text-red-600 text-xs font-bold";
  }
}

function setupSync() {
  onSnapshot(docRef, (snap) => {
    if (snap.exists()) {
      state = snap.data();
      render();
    }
    status.textContent = "Cloud Synced";
    status.className = "text-green-600 text-xs font-bold";
  }, (err) => {
    console.error(err);
    status.textContent = "Connection Failed";
    status.className = "text-red-600 text-xs font-bold";
  });
}

window.togglePass = (id) => {
  const idx = state.activePasses.indexOf(id);
  if (idx > -1) {
    state.activePasses.splice(idx, 1);
  } else {
    state.activePasses.push(id);
  }
  syncToCloud();
  render();
};

// CSV Upload

document.getElementById("csv").addEventListener("change", (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = (ev) => {
    const lines = ev.target.result.split("\n");

    for (let i = 1; i < lines.length; i++) {
      const row = lines[i].trim();
      if (!row) continue;

      const cols = row.split(",").map(c => c.trim());
      const period = cols[0];
      const first = cols[1];
      const last = cols[2];

      state.students.push({
        id: Math.random().toString(36).substr(2, 9),
        name: first + " " + last,
        period: period,
        passesUsed: 0,
        history: []
      });
    }

    syncToCloud();
    render();
  };

  reader.readAsText(file);
});

// Init

// Try initial connection test + fallback
import { getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

async function init() {
  try {
    // Try reading once
    const snap = await getDoc(docRef);

    if (!snap.exists()) {
      // Create initial document if missing
      await setDoc(docRef, { students: [], activePasses: [] });
    }

    setupSync();

    // Failsafe: if still "Connecting" after 3s, show likely issue
    setTimeout(() => {
      if (status.textContent === "Connecting...") {
        status.textContent = "Check Firestore Rules";
        status.className = "text-red-600 text-xs font-bold";
      }
    }, 3000);

  } catch (e) {
    console.error(e);
    status.textContent = "Connection Failed";
    status.className = "text-red-600 text-xs font-bold";
  }
}

init();

</script>

</body>
</html>
