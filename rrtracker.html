<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectivity Diagnostic - Hall Pass Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .log-entry { font-family: 'Courier New', monospace; border-bottom: 1px solid #e2e8f0; padding: 4px 0; font-size: 12px; }
        .log-time { color: #94a3b8; margin-right: 8px; }
        .log-error { color: #ef4444; font-weight: bold; }
        .log-success { color: #10b981; font-weight: bold; }
        .log-info { color: #3b82f6; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .loading { animation: pulse 1.5s infinite; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <div class="max-w-3xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-black text-white">System <span class="text-indigo-400">Diagnostic</span></h1>
            <p class="text-slate-400 text-sm mt-1">Evaluating Firestore connectivity in the current environment...</p>
        </header>

        <!-- Status Panel -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Environment</p>
                <p id="env-status" class="text-lg font-bold text-yellow-500">Checking...</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Auth State</p>
                <p id="auth-status" class="text-lg font-bold text-yellow-500">Checking...</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Firestore Sync</p>
                <p id="db-status" class="text-lg font-bold text-yellow-500">Checking...</p>
            </div>
        </div>

        <!-- Diagnostic Actions -->
        <div class="flex gap-4 mb-6">
            <button id="btn-test-write" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">Test Cloud Write</button>
            <button id="btn-clear-logs" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">Clear Logs</button>
            <button onclick="window.location.reload()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">Reboot</button>
        </div>

        <!-- Log Console -->
        <div class="bg-black rounded-2xl border border-slate-700 overflow-hidden">
            <div class="bg-slate-800 px-4 py-2 border-b border-slate-700 flex justify-between items-center">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Live Diagnostic Stream</span>
                <div id="activity-light" class="w-2 h-2 rounded-full bg-slate-600"></div>
            </div>
            <div id="log-console" class="p-4 h-[400px] overflow-y-auto bg-slate-950">
                <!-- Logs appear here -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { initializeFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Global Diagnostics
        const logs = document.getElementById('log-console');
        const envStatus = document.getElementById('env-status');
        const authStatus = document.getElementById('auth-status');
        const dbStatus = document.getElementById('db-status');
        const activityLight = document.getElementById('activity-light');

        const log = (msg, type = 'info') => {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            
            let typeClass = 'log-info';
            if (type === 'error') typeClass = 'log-error';
            if (type === 'success') typeClass = 'log-success';

            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="${typeClass}">${msg}</span>`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
            
            activityLight.className = 'w-2 h-2 rounded-full bg-indigo-400';
            setTimeout(() => activityLight.className = 'w-2 h-2 rounded-full bg-slate-600', 100);
        };

        log("System boot initiated.");
        
        let firebaseConfig;
        try {
            firebaseConfig = JSON.parse(__firebase_config);
            log("Firebase Config loaded from environment.", "success");
            envStatus.innerText = "Configured";
            envStatus.className = "text-lg font-bold text-emerald-500";
        } catch (e) {
            log("CRITICAL: __firebase_config not found. Using hardcoded fallback.", "error");
            firebaseConfig = {
                apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
                authDomain: "rrtracker-de70e.firebaseapp.com",
                projectId: "rrtracker-de70e",
                storageBucket: "rrtracker-de70e.firebasestorage.app",
                messagingSenderId: "1057987490614",
                appId: "1:1057987490614:web:7c37f2e0a9aa4e735a3997"
            };
            envStatus.innerText = "Fallback";
            envStatus.className = "text-lg font-bold text-yellow-500";
        }

        // App ID logic
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hall-pass-tracker-v1';
        log(`App ID set to: ${appId}`);

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Force Long Polling for environment stability
        log("Initializing Firestore with experimentalForceLongPolling: true...");
        const db = initializeFirestore(app, {
            experimentalForceLongPolling: true
        });

        let currentUser = null;
        let unsubscribeData = null;

        const initAuth = async () => {
            log("Beginning Auth handshake...");
            authStatus.innerText = "Authenticating...";
            authStatus.className = "text-lg font-bold text-indigo-400 loading";

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    log("Found custom auth token. Signing in...");
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    log("No custom token found. Using Anonymous sign-in...");
                    await signInAnonymously(auth);
                }
            } catch (e) {
                log(`Auth Error: ${e.code} - ${e.message}`, "error");
                authStatus.innerText = "Failed";
                authStatus.className = "text-lg font-bold text-red-500";
            }
        };

        const connect = (user) => {
            if (unsubscribeData) unsubscribeData();

            log(`User authenticated: ${user.uid}`, "success");
            authStatus.innerText = "Connected";
            authStatus.className = "text-lg font-bold text-emerald-500";
            
            dbStatus.innerText = "Listening...";
            dbStatus.className = "text-lg font-bold text-indigo-400 loading";

            /**
             * RULE 1 FIX:
             * Paths must have even segments. 
             * segments: artifacts (1), appId (2), public (3), data (4), collectionName (5), docId (6)
             * Current failing path had 5 segments. We must ensure 6.
             */
            const collectionName = 'diagnostics';
            const docId = 'pulse';
            
            const publicPath = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
            
            log(`Opening listener at: artifacts/${appId}/public/data/${collectionName}/${docId}`);

            unsubscribeData = onSnapshot(publicPath, 
                (snap) => {
                    log("Cloud heartbeat received successfully.", "success");
                    dbStatus.innerText = "Online";
                    dbStatus.className = "text-lg font-bold text-emerald-500";
                    if (snap.exists()) {
                        log(`Cloud Data: ${JSON.stringify(snap.data())}`);
                    } else {
                        log("Cloud doc is currently empty (normal for first run).");
                    }
                }, 
                (err) => {
                    log(`Firestore Error: ${err.code} - ${err.message}`, "error");
                    dbStatus.innerText = "Blocked";
                    dbStatus.className = "text-lg font-bold text-red-500";
                    
                    if (err.code === 'permission-denied') {
                        log("CRITICAL: Path violation or security rule mismatch.", "error");
                    }
                }
            );
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                connect(user);
            } else {
                log("Auth state: No user signed in.");
                initAuth();
            }
        });

        document.getElementById('btn-test-write').onclick = async () => {
            if (!currentUser) {
                log("Write test failed: No authenticated user.", "error");
                return;
            }

            log("Attempting test write...");
            const testPath = doc(db, 'artifacts', appId, 'public', 'data', 'diagnostics', 'pulse');
            
            try {
                await setDoc(testPath, {
                    lastPulse: Date.now(),
                    tester: currentUser.uid,
                    environment: "Canvas Sandbox"
                }, { merge: true });
                log("Test write successful!", "success");
            } catch (e) {
                log(`Write Error: ${e.message}`, "error");
            }
        };

        document.getElementById('btn-clear-logs').onclick = () => {
            logs.innerHTML = '';
            log("Logs cleared.");
        };

        log("Ready. Waiting for Firebase background tasks...");
    </script>
</body>
</html>
