<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Connection Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-slate-200">
        <h1 class="text-2xl font-black mb-2 text-slate-800">Connection Tester</h1>
        <p class="text-slate-500 text-sm mb-6">Checking if your app can reach the cloud database...</p>

        <div id="status-container" class="space-y-4">
            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                <span class="text-sm font-bold text-slate-600">Config Variables</span>
                <span id="step-vars" class="text-xs font-black px-2 py-1 rounded bg-amber-100 text-amber-600 uppercase">Waiting...</span>
            </div>
            
            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                <span class="text-sm font-bold text-slate-600">Authentication</span>
                <span id="step-auth" class="text-xs font-black px-2 py-1 rounded bg-slate-200 text-slate-400 uppercase">Pending</span>
            </div>

            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                <span class="text-sm font-bold text-slate-600">Database Read</span>
                <span id="step-db" class="text-xs font-black px-2 py-1 rounded bg-slate-200 text-slate-400 uppercase">Pending</span>
            </div>
        </div>

        <div id="debug-log" class="mt-8 p-4 bg-slate-900 rounded-xl font-mono text-[10px] text-emerald-400 h-40 overflow-y-auto no-scrollbar">
            > Initializing test sequence...<br>
        </div>

        <button id="retry-btn" class="hidden mt-6 w-full py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">
            Retry Connection
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const log = (msg, isError = false) => {
            const el = document.getElementById('debug-log');
            const span = document.createElement('div');
            span.innerHTML = `> ${msg}`;
            if (isError) span.className = 'text-red-400';
            el.appendChild(span);
            el.scrollTop = el.scrollHeight;
        };

        const setStep = (id, status, type) => {
            const el = document.getElementById(id);
            el.innerText = status;
            const colors = {
                wait: 'bg-amber-100 text-amber-600',
                ok: 'bg-emerald-100 text-emerald-600',
                fail: 'bg-red-100 text-red-600',
                off: 'bg-slate-200 text-slate-400'
            };
            el.className = `text-xs font-black px-2 py-1 rounded uppercase ${colors[type]}`;
        };

        async function runTest() {
            log("Starting connection test...");
            document.getElementById('retry-btn').classList.add('hidden');

            // STEP 1: Check for injected config
            let config;
            try {
                if (typeof __firebase_config !== 'undefined') {
                    config = JSON.parse(__firebase_config);
                    setStep('step-vars', 'Found', 'ok');
                    log("Firebase config detected.");
                } else {
                    throw new Error("Config not injected yet.");
                }
            } catch (e) {
                setStep('step-vars', 'Missing', 'fail');
                log("Error: Environment variables missing. (Local Mode)", true);
                document.getElementById('retry-btn').classList.remove('hidden');
                return;
            }

            // STEP 2: Initialize and Auth
            try {
                const app = initializeApp(config);
                const auth = getAuth(app);
                const db = getFirestore(app);
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'test-app';

                setStep('step-auth', 'Authenticating', 'wait');
                log("Attempting sign-in...");

                let userCredential;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    log("Using custom token...");
                    userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    log("Using anonymous login...");
                    userCredential = await signInAnonymously(auth);
                }

                const user = userCredential.user;
                setStep('step-auth', 'Success', 'ok');
                log(`Authenticated as: ${user.uid}`);

                // STEP 3: Test Firestore Read/Write
                setStep('step-db', 'Testing', 'wait');
                log("Testing Firestore write/read...");

                const testRef = doc(db, 'artifacts', appId, 'users', user.uid, 'test', 'ping');
                await setDoc(testRef, { timestamp: Date.now(), status: 'online' });
                log("Write operation successful.");

                const snap = await getDoc(testRef);
                if (snap.exists()) {
                    setStep('step-db', 'Online', 'ok');
                    log("Read operation successful. Cloud is active.");
                } else {
                    throw new Error("Document not found after write.");
                }

            } catch (e) {
                log(`Critical Failure: ${e.message}`, true);
                if (e.message.includes('permission-denied')) {
                    log("Check Firestore Rules: Ensure path /artifacts/{appId}/users/{userId}/ matches exactly.", true);
                }
                setStep('step-auth', 'Failed', 'fail');
                setStep('step-db', 'Blocked', 'fail');
                document.getElementById('retry-btn').classList.remove('hidden');
            }
        }

        document.getElementById('retry-btn').onclick = runTest;

        // Give the environment 2 seconds to inject variables before failing
        log("Waiting for environment injection...");
        setTimeout(runTest, 2000);

    </script>
</body>
</html>
