<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Pass Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        #data-menu { display: none; transform: translateY(-10px); opacity: 0; transition: all 0.2s ease; }
        #data-menu.show { display: block; transform: translateY(0); opacity: 1; }
        .row-active { background-color: #f0f4ff; border-left: 4px solid #4f46e5; }
        .syncing { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans">

    <!-- Header / Nav -->
    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-3xl font-black tracking-tight text-slate-900">Hall Pass <span class="text-indigo-600">Pro</span></h1>
                    <div id="cloud-status" class="px-2 py-1 bg-amber-100 text-amber-600 rounded text-[10px] font-bold uppercase tracking-widest transition-all">Connecting...</div>
                </div>
                <p class="text-slate-500 text-sm mt-1">Cloud-synced student movement tracker.</p>
            </div>

            <div class="flex gap-2 relative">
                <button id="add-btn" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-indigo-100 active:scale-95 transition-all">
                    + Add Student
                </button>
                
                <div class="relative">
                    <button id="menu-trigger" class="bg-white border border-slate-200 text-slate-700 px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm active:bg-slate-50">
                        Data Tools
                    </button>
                    <!-- DATA MENU -->
                    <div id="data-menu" class="absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-2xl shadow-2xl py-2 z-[200]">
                        <button id="btn-import-csv" class="w-full text-left px-4 py-3 text-xs font-bold hover:bg-slate-50 flex items-center gap-3">
                            Import CSV
                        </button>
                        <button id="btn-export-json" class="w-full text-left px-4 py-3 text-xs font-bold hover:bg-slate-50 flex items-center gap-3">
                            Export Backup (.json)
                        </button>
                        <button id="btn-restore-json" class="w-full text-left px-4 py-3 text-xs font-bold hover:bg-slate-50 flex items-center gap-3 border-b border-slate-100">
                            Restore from File
                        </button>
                        <button id="btn-wipe" class="w-full text-left px-4 py-3 text-xs font-bold text-red-600 hover:bg-red-50 flex items-center gap-3">
                            Wipe All Data
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Out Now</span>
                <p id="stat-out" class="text-2xl font-black text-indigo-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Today's Trips</span>
                <p id="stat-trips" class="text-2xl font-black text-slate-800">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Students</span>
                <p id="stat-total" class="text-2xl font-black text-slate-800">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Limit</span>
                <p class="text-2xl font-black text-slate-800">7</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200/50 overflow-hidden min-h-[300px]">
            <!-- Period Filter -->
            <div id="period-bar" class="flex gap-2 p-4 border-b border-slate-50 overflow-x-auto no-scrollbar"></div>
            
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                    <tr>
                        <th class="px-6 py-4">Student</th>
                        <th class="px-6 py-4">Overage (Limit 7)</th>
                        <th class="px-6 py-4 text-right">Pass</th>
                    </tr>
                </thead>
                <tbody id="student-table" class="divide-y divide-slate-50">
                    <!-- Rows injected here -->
                </tbody>
            </table>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center px-6">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-width="2" stroke-linecap="round"></path></svg>
                </div>
                <h3 class="font-bold text-slate-800">No data found in cloud</h3>
                <p class="text-slate-500 text-sm mb-6">Import your backup to restore your students.</p>
                <button id="empty-restore-btn" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold text-sm">Upload Backup Now</button>
            </div>
        </div>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="input-csv" accept=".csv" class="hidden">
    <input type="file" id="input-json" accept=".json" class="hidden">

    <!-- Modal -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-sm p-8 shadow-2xl">
            <h2 id="modal-title" class="text-xl font-black mb-6">Add Student</h2>
            <div class="space-y-4">
                <input type="text" id="field-name" placeholder="Student Name" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
                <input type="text" id="field-period" placeholder="Period (e.g. 1)" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
            </div>
            <div class="flex gap-3 mt-8">
                <button id="modal-cancel" class="flex-1 py-3 text-slate-400 font-bold text-sm uppercase">Cancel</button>
                <button id="modal-save" class="flex-[1.5] py-3 bg-indigo-600 text-white rounded-xl font-black text-sm uppercase shadow-lg shadow-indigo-100">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Constants
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hall-pass-pro-v1';
        const firebaseConfig = JSON.parse(__firebase_config);

        // State Management
        let state = {
            user: null,
            students: [],
            activePasses: [],
            currentPeriod: '1'
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- AUTH LOGIC (RULE 3) ---
        const startApp = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth failed:", err);
                document.getElementById('cloud-status').innerText = 'Auth Error';
            }
        };

        // Handle Auth State Changes
        onAuthStateChanged(auth, (user) => {
            state.user = user;
            if (user) {
                setupDataListener(user.uid);
            } else {
                document.getElementById('cloud-status').innerText = 'Unauthorized';
            }
        });

        const setupDataListener = (uid) => {
            const userDoc = doc(db, 'artifacts', appId, 'users', uid, 'data', 'main');
            
            onSnapshot(userDoc, (snap) => {
                const data = snap.exists() ? snap.data() : { students: [], activePasses: [] };
                state.students = data.students || [];
                state.activePasses = data.activePasses || [];
                
                document.getElementById('cloud-status').innerText = 'Cloud Synced';
                document.getElementById('cloud-status').className = 'px-2 py-1 bg-emerald-100 text-emerald-600 rounded text-[10px] font-bold uppercase tracking-widest';
                render();
            }, (err) => {
                console.error("Firestore listener error:", err);
                document.getElementById('cloud-status').innerText = 'Sync Error';
            });
        };

        // --- SAVE DATA ---
        const syncToCloud = async () => {
            if (!state.user) return;
            const statusEl = document.getElementById('cloud-status');
            statusEl.innerText = 'Syncing...';
            statusEl.classList.add('syncing');
            
            try {
                const userDoc = doc(db, 'artifacts', appId, 'users', state.user.uid, 'data', 'main');
                await setDoc(userDoc, {
                    students: state.students,
                    activePasses: state.activePasses,
                    updatedAt: Date.now()
                });
            } catch (e) {
                console.error("Save error", e);
                statusEl.innerText = 'Save Failed';
            }
        };

        // --- UI RENDERER ---
        const render = () => {
            const list = document.getElementById('student-table');
            const empty = document.getElementById('empty-state');
            
            // Stats
            document.getElementById('stat-out').innerText = state.activePasses.length;
            document.getElementById('stat-total').innerText = state.students.length;
            document.getElementById('stat-trips').innerText = state.students.reduce((acc, s) => acc + (s.history?.length || 0), 0);

            if (state.students.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            const periods = [...new Set(state.students.map(s => s.period))].sort((a,b) => a - b);
            if (!periods.includes(state.currentPeriod)) state.currentPeriod = periods[0] || '1';

            document.getElementById('period-bar').innerHTML = periods.map(p => `
                <button class="px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${state.currentPeriod === p ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' : 'bg-slate-100 text-slate-400'}" 
                onclick="window.setPeriod('${p}')">Period ${p}</button>
            `).join('');

            const filtered = state.students.filter(s => s.period === state.currentPeriod);
            list.innerHTML = filtered.map(s => {
                const isOut = state.activePasses.some(p => p.sid === s.id);
                return `
                <tr class="${isOut ? 'row-active' : ''} transition-colors">
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-2">
                            <span class="font-bold">${s.name}</span>
                            <button onclick="window.delStud('${s.id}')" class="text-slate-200 hover:text-red-500 transition-colors">×</button>
                        </div>
                    </td>
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-2">
                            <button onclick="window.adjPass('${s.id}', -1)" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition-colors">-</button>
                            <span class="font-black text-sm w-5 text-center ${s.passesUsed >= 7 ? 'text-red-600' : 'text-slate-700'}">${s.passesUsed || 0}</span>
                            <button onclick="window.adjPass('${s.id}', 1)" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition-colors">+</button>
                        </div>
                    </td>
                    <td class="px-6 py-5 text-right">
                        <button onclick="window.togglePass('${s.id}')" class="px-5 py-2.5 rounded-xl text-[10px] font-black uppercase transition-all ${isOut ? 'bg-slate-900 text-white shadow-lg shadow-slate-200' : 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100'}">
                            ${isOut ? 'Return' : 'Issue'}
                        </button>
                    </td>
                </tr>
                `;
            }).join('');
        };

        // --- GLOBAL ACTIONS ---
        window.setPeriod = (p) => { state.currentPeriod = p; render(); };
        
        window.togglePass = (id) => {
            const outIdx = state.activePasses.findIndex(p => p.sid === id);
            if (outIdx > -1) {
                state.activePasses.splice(outIdx, 1);
            } else {
                const s = state.students.find(x => x.id === id);
                state.activePasses.push({ sid: id, start: Date.now() });
                s.history = s.history || [];
                s.history.push(Date.now());
            }
            syncToCloud();
        };

        window.adjPass = (id, delta) => {
            const s = state.students.find(x => x.id === id);
            s.passesUsed = Math.max(0, (s.passesUsed || 0) + delta);
            syncToCloud();
        };

        window.delStud = (id) => {
            if (confirm("Remove student?")) {
                state.students = state.students.filter(s => s.id !== id);
                syncToCloud();
            }
        };

        // UI Interactions
        const menuBtn = document.getElementById('menu-trigger');
        const menu = document.getElementById('data-menu');
        
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menu.classList.toggle('show');
        });

        document.addEventListener('click', () => menu.classList.remove('show'));

        // Data Management Events
        document.getElementById('btn-import-csv').onclick = () => document.getElementById('input-csv').click();
        document.getElementById('btn-restore-json').onclick = () => document.getElementById('input-json').click();
        document.getElementById('empty-restore-btn').onclick = () => document.getElementById('input-json').click();

        document.getElementById('input-csv').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                const rows = ev.target.result.split('\n').filter(r => r.trim());
                rows.forEach(r => {
                    const parts = r.split(',').map(s => s.trim());
                    const name = parts[0];
                    const per = parts[1] || '1';
                    if (name) state.students.push({ id: Math.random().toString(36).substr(2, 9), name, period: per, passesUsed: 0, history: [] });
                });
                syncToCloud();
            };
            reader.readAsText(file);
        };

        document.getElementById('input-json').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    state.students = data.students || [];
                    state.activePasses = data.activePasses || [];
                    syncToCloud();
                } catch (err) { alert("Invalid backup file."); }
            };
            reader.readAsText(file);
        };

        document.getElementById('btn-export-json').onclick = () => {
            const backup = { students: state.students, activePasses: state.activePasses };
            const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hallpass_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        };

        document.getElementById('btn-wipe').onclick = () => {
            if (confirm("Permanently wipe all student records?")) {
                state.students = [];
                state.activePasses = [];
                syncToCloud();
            }
        };

        // Modal Logic
        const modal = document.getElementById('modal-backdrop');
        document.getElementById('add-btn').onclick = () => modal.classList.remove('hidden');
        document.getElementById('modal-cancel').onclick = () => modal.classList.add('hidden');
        document.getElementById('modal-save').onclick = () => {
            const name = document.getElementById('field-name').value;
            const per = document.getElementById('field-period').value || '1';
            if (name) {
                state.students.push({ id: Date.now().toString(), name, period: per, passesUsed: 0, history: [] });
                state.currentPeriod = per;
                syncToCloud();
                modal.classList.add('hidden');
                document.getElementById('field-name').value = '';
            }
        };

        // Bootstrap on Load
        window.addEventListener('load', () => {
            startApp();
        });
    </script>
</body>
</html>
