<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Pass Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EmailJS for automatic notifications -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        .timer-badge { font-variant-numeric: tabular-nums; }
        @keyframes pulse-red {
            0%, 100% { background-color: #fee2e2; }
            50% { background-color: #fca5a5; }
        }
        .overtime { animation: pulse-red 2s infinite; }
        .modal-bg { background-color: rgba(0,0,0,0.5); }
        
        /* Dynamic Row Colors */
        .usage-safe { background-color: rgba(16, 185, 129, 0.05); }     /* Emerald 5% */
        .usage-warning { background-color: rgba(245, 158, 11, 0.08); }  /* Amber 8% */
        .usage-critical { background-color: rgba(249, 115, 22, 0.1); }  /* Orange 10% */
        .usage-danger { background-color: rgba(239, 68, 68, 0.12); }    /* Red 12% */
        
        tr { transition: background-color 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center transition-opacity duration-500 text-center px-6">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-6"></div>
        <h2 id="loading-status" class="text-xl font-bold text-slate-800 mb-2">Connecting to Your Secure Storage...</h2>
        <p class="text-sm text-slate-500 mb-8">Initializing Cloud Sync...</p>
        <button id="force-btn" onclick="hideLoader()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl shadow-lg shadow-indigo-200 transition-all font-bold">
            Launch Tracker Anyway
        </button>
    </div>

    <div id="app-container" class="max-w-4xl mx-auto p-4 pb-24 opacity-0 transition-opacity duration-500">
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Hall Pass Tracker</h1>
                <div class="flex items-center gap-2">
                    <span id="sync-indicator" class="w-2 h-2 rounded-full bg-slate-300"></span>
                    <p id="sync-text" class="text-slate-500 text-xs">Connecting...</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('add')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg transition shadow-sm text-sm font-bold">+ Add Student</button>
                <button id="csv-btn" onclick="document.getElementById('csv-input').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition shadow-sm text-sm font-bold">Upload CSV</button>
                <input type="file" id="csv-input" accept=".csv" class="hidden" onchange="handleCSV(event)">
            </div>
        </header>

        <!-- Stats -->
        <div id="stats-bar" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Out Now</p>
                <p id="stat-out" class="text-2xl font-bold text-indigo-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Passes Remaining</p>
                <p id="stat-rem" class="text-2xl font-bold text-emerald-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Students</p>
                <p id="stat-total" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">All-Time Trips</p>
                <p id="stat-trips" class="text-2xl font-bold">0</p>
            </div>
        </div>

        <!-- Active Pass Display -->
        <section id="timers-section" class="mb-10 hidden">
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                Active Passes
            </h2>
            <div id="timers-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- Main View -->
        <section id="main-view">
            <div class="flex items-center justify-between mb-4">
                <div id="period-tabs" class="flex gap-2 overflow-x-auto pb-2"></div>
                <button id="view-toggle" onclick="toggleView()" class="text-sm font-bold text-indigo-600 hover:underline">View Master Log</button>
            </div>

            <div id="list-view" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 text-[10px] uppercase font-bold text-slate-500">
                        <tr>
                            <th class="px-6 py-4">Student</th>
                            <th class="px-6 py-4">Usage (7 Limit)</th>
                            <th class="px-6 py-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="student-list" class="divide-y divide-slate-100"></tbody>
                </table>
                <div id="empty-msg" class="p-20 text-center text-slate-400 hidden">
                    No students in this period.
                </div>
            </div>

            <div id="log-view" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 text-[10px] uppercase font-bold text-slate-500">
                        <tr>
                            <th class="px-6 py-4">Student</th>
                            <th class="px-6 py-4">Period</th>
                            <th class="px-6 py-4">Date</th>
                            <th class="px-6 py-4">Duration</th>
                            <th class="px-6 py-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="log-list" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Student Modal -->
    <div id="modal" class="fixed inset-0 z-[110] flex items-center justify-center p-4 hidden modal-bg">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <h3 id="modal-title" class="text-xl font-bold mb-4">New Student</h3>
            <input type="hidden" id="m-id">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Full Name</label>
                    <input type="text" id="m-name" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Class Period</label>
                    <input type="text" id="m-period" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex items-center gap-2 py-2">
                    <input type="checkbox" id="m-notify" class="w-4 h-4 text-indigo-600 rounded">
                    <label for="m-notify" class="text-sm text-slate-600">Email alert on every pass</label>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button onclick="closeModal()" class="text-slate-400 font-bold px-4">Cancel</button>
                <button onclick="saveStudent()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURATION: Replace empty string with your EmailJS Public Key
        const EMAILJS_PUBLIC_KEY = ""; 
        if (EMAILJS_PUBLIC_KEY) emailjs.init(EMAILJS_PUBLIC_KEY);

        const firebaseConfig = {
            apiKey: "AIzaSyBoVvSMWxE4Mr0LxuNI3NkhxEr-g54Y67k",
            authDomain: "rrtracker-de70e.firebaseapp.com",
            projectId: "rrtracker-de70e",
            storageBucket: "rrtracker-de70e.firebasestorage.app",
            messagingSenderId: "1057987490614",
            appId: "1:1057987490614:web:7c37f2e0a9aa4e735a3997"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'hall-pass-tracker-main';

        let students = [];
        let activePasses = [];
        let currentPeriod = null;
        let isLogView = false;
        let isSynced = false;
        let currentUser = null;
        const LIMIT = 7;
        const OVERTIME = 7 * 60;

        window.hideLoader = () => {
            const overlay = document.getElementById('loading-overlay');
            const container = document.getElementById('app-container');
            if (overlay) overlay.classList.add('opacity-0', 'pointer-events-none');
            if (container) container.classList.remove('opacity-0');
        };

        const init = async () => {
            // Safety timeout to dismiss loader if sync hangs or takes too long
            setTimeout(() => { hideLoader(); }, 5000);
            
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    const indicator = document.getElementById('sync-indicator');
                    const text = document.getElementById('sync-text');
                    if (indicator) indicator.className = "w-2 h-2 rounded-full bg-emerald-500";
                    if (text) text.innerText = "Live Cloud Active";
                    setupSync();
                }
            });

            try { 
                await signInAnonymously(auth); 
            } catch (e) { 
                console.error("Auth error:", e);
                hideLoader(); 
            }
        };

        function setupSync() {
            // Listen for students
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (snap) => {
                students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!currentPeriod && students.length > 0) {
                    currentPeriod = [...new Set(students.map(s => s.period))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}))[0];
                }
                isSynced = true;
                render();
                hideLoader();
            }, (err) => {
                console.error("Firestore Students Listen Error:", err);
                hideLoader();
            });

            // Listen for active passes
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'active_passes'), (snap) => {
                activePasses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (err) => {
                console.error("Firestore Passes Listen Error:", err);
            });
        }

        window.openModal = (mode, id = null) => {
            const s = students.find(x => x.id === id);
            document.getElementById('modal-title').innerText = mode === 'add' ? 'New Student' : 'Edit Student';
            document.getElementById('m-id').value = id || '';
            document.getElementById('m-name').value = s ? s.name : '';
            document.getElementById('m-period').value = s ? s.period : (currentPeriod || '');
            document.getElementById('m-notify').checked = s ? !!s.notify : false;
            document.getElementById('modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');

        window.saveStudent = async () => {
            const name = document.getElementById('m-name').value.trim();
            const period = document.getElementById('m-period').value.trim();
            const notify = document.getElementById('m-notify').checked;
            const existingId = document.getElementById('m-id').value;
            if (!name || !period) return;
            const id = existingId || `student_${Date.now()}`;
            
            if (currentUser) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', id);
                if (existingId) await updateDoc(docRef, { name, period, notify });
                else await setDoc(docRef, { name, period, notify, passesUsed: 0, history: [] });
            }
            closeModal();
        };

        window.startPass = async (id) => {
            const s = students.find(x => x.id === id);
            if (!s) return;
            
            if (s.notify && EMAILJS_PUBLIC_KEY) {
                emailjs.send("default_service", "template_id_placeholder", {
                    student_name: s.name,
                    period: s.period,
                    time: new Date().toLocaleTimeString()
                }).catch(e => console.error("Email failed:", e));
            }

            if (currentUser) {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'active_passes', id), {
                    studentId: id, name: s.name, start: Date.now()
                });
            }
        };

        window.endPass = async (id) => {
            const p = activePasses.find(x => x.studentId === id);
            const s = students.find(x => x.id === id);
            if (!p || !s) return;
            const dur = Math.floor((Date.now() - p.start) / 1000);
            const penalize = dur >= OVERTIME;
            
            if (currentUser) {
                const batch = writeBatch(db);
                batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'active_passes', id));
                batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), {
                    passesUsed: (s.passesUsed || 0) + (penalize ? 1 : 0),
                    history: [...(s.history || []), { dur, penalize, date: new Date().toLocaleString(), ts: Date.now(), period: s.period }]
                });
                await batch.commit();
            }
        };

        window.adjust = async (id, delta) => {
            const s = students.find(x => x.id === id);
            if (!s) return;
            const newVal = Math.max(0, Math.min(LIMIT, (s.passesUsed || 0) + delta));
            if (currentUser) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id), { passesUsed: newVal });
        };

        window.removeStudent = async (id) => {
            if (confirm("Delete student?")) {
                if (currentUser) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id));
            }
        };

        window.handleCSV = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const text = e.target.result;
                const rows = text.split(/\r?\n/).slice(1); // Handle different line endings
                if (!currentUser) return;
                
                const batch = writeBatch(db);
                let addedCount = 0;
                
                rows.forEach(row => {
                    const columns = row.split(',');
                    const name = columns[0]?.trim();
                    const period = columns[1]?.trim();
                    
                    if (name && period) {
                        const id = `student_${Math.random().toString(36).substr(2, 9)}_${Date.now()}`;
                        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'students', id);
                        batch.set(ref, { 
                            name, 
                            period, 
                            passesUsed: 0, 
                            history: [], 
                            notify: false 
                        });
                        addedCount++;
                    }
                });
                
                if (addedCount > 0) {
                    await batch.commit();
                    console.log(`Successfully added ${addedCount} students.`);
                }
                
                // Reset input
                event.target.value = '';
            };
            reader.readAsText(file);
        };

        function getUsageClass(val) {
            if (val >= LIMIT) return 'usage-danger';
            if (val >= 5) return 'usage-critical';
            if (val >= 3) return 'usage-warning';
            return 'usage-safe';
        }

        function getBarColor(val) {
            if (val >= LIMIT) return 'bg-red-500';
            if (val >= 5) return 'bg-orange-500';
            if (val >= 3) return 'bg-yellow-500';
            return 'bg-emerald-500';
        }

        function render() {
            const outStat = document.getElementById('stat-out');
            const totalStat = document.getElementById('stat-total');
            const tripsStat = document.getElementById('stat-trips');
            const remStat = document.getElementById('stat-rem');

            if (outStat) outStat.innerText = activePasses.length;
            if (totalStat) totalStat.innerText = students.length;
            if (tripsStat) tripsStat.innerText = students.reduce((a,b) => a + (b.history?.length || 0), 0);
            
            const totalUsed = students.reduce((a,b) => a + (b.passesUsed || 0), 0);
            if (remStat) remStat.innerText = Math.max(0, (students.length * LIMIT) - totalUsed);

            // Active Pass List
            const sec = document.getElementById('timers-section');
            const list = document.getElementById('timers-list');
            if (activePasses.length === 0) {
                if (sec) sec.classList.add('hidden');
            } else {
                if (sec) sec.classList.remove('hidden');
                if (list) {
                    list.innerHTML = activePasses.map(p => {
                        const elapsed = Math.floor((Date.now() - p.start) / 1000);
                        const isOver = elapsed >= OVERTIME;
                        return `
                            <div class="p-4 rounded-xl border flex items-center justify-between ${isOver ? 'overtime border-red-300' : 'bg-white border-slate-200'}">
                                <div><span class="font-bold text-slate-700 block text-sm">${p.name}</span><span class="text-[10px] text-slate-400 font-bold uppercase">Active Pass</span></div>
                                <div class="flex items-center gap-4"><span class="font-mono font-bold text-lg ${isOver ? 'text-red-600' : 'text-indigo-600'}">${Math.floor(elapsed/60)}:${(elapsed%60).toString().padStart(2,'0')}</span>
                                <button onclick="endPass('${p.studentId}')" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm">RETURN</button></div>
                            </div>
                        `;
                    }).join('');
                }
            }

            // Tabs
            const pds = [...new Set(students.map(s => s.period))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
            const tabsContainer = document.getElementById('period-tabs');
            if (tabsContainer) {
                tabsContainer.innerHTML = pds.map(p => `
                    <button onclick="setPeriod('${p}')" class="whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold border transition ${currentPeriod === p ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'}">
                        Period ${p}
                    </button>
                `).join('');
            }

            // Student Table
            const filtered = students.filter(s => s.period === currentPeriod);
            const emptyMsg = document.getElementById('empty-msg');
            if (emptyMsg) emptyMsg.classList.toggle('hidden', filtered.length > 0 || students.length === 0);
            
            if (isLogView) {
                document.getElementById('list-view')?.classList.add('hidden');
                document.getElementById('log-view')?.classList.remove('hidden');
                const toggleBtn = document.getElementById('view-toggle');
                if (toggleBtn) toggleBtn.innerText = "Back to List";
                
                const all = students.flatMap(s => (s.history || []).map(h => ({...h, name: s.name}))).sort((a,b) => b.ts - a.ts);
                const logList = document.getElementById('log-list');
                if (logList) {
                    logList.innerHTML = all.map(t => `
                        <tr class="text-xs">
                            <td class="px-6 py-4 font-bold text-slate-700">${t.name}</td>
                            <td class="px-6 py-4 text-slate-500">P${t.period}</td>
                            <td class="px-6 py-4 text-slate-500">${t.date}</td>
                            <td class="px-6 py-4 font-mono font-bold">${Math.floor(t.dur/60)}m ${t.dur%60}s</td>
                            <td class="px-6 py-4"><span class="px-2 py-0.5 rounded text-[9px] font-black uppercase ${t.penalize ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-600'}">${t.penalize ? 'Deducted' : 'Normal'}</span></td>
                        </tr>
                    `).join('') || '<tr><td colspan="5" class="p-10 text-center italic text-slate-400">No logs.</td></tr>';
                }
            } else {
                document.getElementById('list-view')?.classList.remove('hidden');
                document.getElementById('log-view')?.classList.add('hidden');
                const toggleBtn = document.getElementById('view-toggle');
                if (toggleBtn) toggleBtn.innerText = "View Master Log";
                
                const studentList = document.getElementById('student-list');
                if (studentList) {
                    studentList.innerHTML = filtered.map(s => {
                        const isOut = activePasses.some(p => p.studentId === s.id);
                        const val = s.passesUsed || 0;
                        return `
                            <tr class="${getUsageClass(val)} ${isOut ? 'ring-2 ring-indigo-400 ring-inset' : ''}">
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <button onclick="removeStudent('${s.id}')" class="text-slate-300 hover:text-red-400 transition">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                        </button>
                                        <div class="flex flex-col">
                                            <div class="flex items-center gap-2">
                                                <span class="font-bold text-slate-700">${s.name}</span>
                                                <button onclick="openModal('edit', '${s.id}')" class="text-indigo-400 hover:text-indigo-600">
                                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <div class="flex items-center border rounded-lg overflow-hidden bg-white">
                                            <button onclick="adjust('${s.id}', -1)" class="px-2 py-1 hover:bg-slate-100 font-bold">-</button>
                                            <span class="px-3 py-1 font-bold text-sm min-w-[2rem] text-center">${val}</span>
                                            <button onclick="adjust('${s.id}', 1)" class="px-2 py-1 hover:bg-slate-100 font-bold">+</button>
                                        </div>
                                        <div class="w-24 h-2 bg-slate-200 rounded-full overflow-hidden">
                                            <div class="h-full transition-all duration-500 ${getBarColor(val)}" style="width: ${Math.min(100, (val / LIMIT) * 100)}%"></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <button onclick="startPass('${s.id}')" ${isOut ? 'disabled' : ''} class="px-4 py-2 rounded-lg text-[10px] font-black transition shadow-sm ${isOut ? 'bg-slate-200 text-slate-400' : 'bg-indigo-600 text-white hover:bg-indigo-700'}">
                                        ${isOut ? 'OUT' : 'START PASS'}
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                }
            }
        }

        window.setPeriod = (p) => { currentPeriod = p; render(); };
        window.toggleView = () => { isLogView = !isLogView; render(); };
        window.handleCSV = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const text = e.target.result;
                const rows = text.split(/\r?\n/).slice(1);
                if (!currentUser) return;
                
                const batch = writeBatch(db);
                let addedCount = 0;
                
                rows.forEach(row => {
                    const columns = row.split(',');
                    const name = columns[0]?.trim();
                    const period = columns[1]?.trim();
                    
                    if (name && period) {
                        const id = `student_${Math.random().toString(36).substr(2, 9)}_${Date.now()}`;
                        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'students', id);
                        batch.set(ref, { 
                            name, 
                            period, 
                            passesUsed: 0, 
                            history: [], 
                            notify: false 
                        });
                        addedCount++;
                    }
                });
                
                if (addedCount > 0) {
                    await batch.commit();
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        };

        // Update timer every second
        setInterval(() => { if (activePasses.length > 0) render(); }, 1000);
        
        // Start init
        init();
    </script>
</body>
</html>
