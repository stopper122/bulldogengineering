<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Pass Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .timer-badge { font-variant-numeric: tabular-nums; }
        @keyframes pulse-red {
            0%, 100% { background-color: #fee2e2; }
            50% { background-color: #fca5a5; }
        }
        .overtime { animation: pulse-red 2s infinite; border-color: #ef4444 !important; }
        .modal-bg { background-color: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .status-dot { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans">

    <!-- Feedback Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-[200] transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl text-sm font-bold"></div>

    <div class="max-w-4xl mx-auto p-4 pb-24">
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Hall Pass Tracker</h1>
                <div class="flex items-center gap-2 mt-1">
                    <span id="sync-indicator" class="w-2 h-2 rounded-full bg-slate-300 status-dot"></span>
                    <p id="sync-text" class="text-slate-500 text-[10px] font-bold uppercase tracking-wider">Initializing...</p>
                    <button id="retry-btn" onclick="window.location.reload()" class="hidden ml-2 text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded font-black hover:bg-red-200">RETRY CONNECTION</button>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="openModal('add')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition shadow-md text-sm font-bold flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2" stroke-linecap="round"/></svg>
                    Add Student
                </button>
                <button onclick="document.getElementById('csv-input').click()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg transition shadow-md text-sm font-bold flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Upload CSV
                </button>
                <input type="file" id="csv-input" accept=".csv" class="hidden" onchange="handleCSV(event)">
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Active Passes</p>
                <p id="stat-out" class="text-2xl font-bold text-indigo-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Available Capacity</p>
                <p id="stat-rem" class="text-2xl font-bold text-emerald-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Students</p>
                <p id="stat-total" class="text-2xl font-bold text-slate-700">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">All-Time Trips</p>
                <p id="stat-trips" class="text-2xl font-bold text-slate-700">0</p>
            </div>
        </div>

        <!-- Active Timers -->
        <section id="timers-section" class="mb-10 hidden">
            <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                In-Progress Hall Passes
            </h2>
            <div id="timers-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- Main Display -->
        <section>
            <div class="flex items-center justify-between mb-4 border-b border-slate-200 pb-2">
                <div id="period-tabs" class="flex gap-4 overflow-x-auto no-scrollbar"></div>
                <button onclick="toggleView()" id="view-toggle" class="text-xs font-black text-indigo-600 uppercase tracking-tighter bg-indigo-50 px-3 py-1.5 rounded-md hover:bg-indigo-100 transition-colors">Master Log</button>
            </div>

            <div id="list-view" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 text-[10px] uppercase font-black text-slate-400 border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4">Student</th>
                                <th class="px-6 py-4">Status / Limit (7)</th>
                                <th class="px-6 py-4 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="student-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
                <div id="empty-state" class="py-20 text-center flex flex-col items-center justify-center hidden">
                    <p class="text-slate-400 font-medium italic">No students found in Period <span id="empty-period"></span></p>
                </div>
            </div>

            <div id="log-view" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 border-b">
                        <tr>
                            <th class="px-6 py-4">Student</th>
                            <th class="px-6 py-4 text-center">Period</th>
                            <th class="px-6 py-4">Timestamp</th>
                            <th class="px-6 py-4">Duration</th>
                            <th class="px-6 py-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="log-list" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modals -->
    <div id="modal" class="fixed inset-0 z-[150] flex items-center justify-center p-4 hidden modal-bg">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8 transform scale-95 transition-transform">
            <h3 id="modal-title" class="text-2xl font-black mb-6 text-slate-800">New Student</h3>
            <input type="hidden" id="m-id">
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Full Name</label>
                    <input type="text" id="m-name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Class Period</label>
                    <input type="text" id="m-period" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
                </div>
            </div>
            <div class="flex justify-end gap-4 mt-10">
                <button onclick="closeModal()" class="text-slate-400 font-bold px-4 hover:text-slate-600 uppercase text-xs">Cancel</button>
                <button id="modal-save-btn" onclick="saveStudent()" class="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-black transition-all text-sm uppercase tracking-wide">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const LIMIT = 7;
        const OVERTIME = 7 * 60; // 7 Minutes
        
        let state = {
            students: [],
            activePasses: [],
            currentPeriod: '1',
            isLogView: false,
            user: null,
            db: null,
            appId: null
        };

        const toast = document.getElementById('toast');
        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        async function init() {
            try {
                updateSyncUI('connecting');
                
                if (typeof __firebase_config === 'undefined') throw new Error("Config not found");
                const config = JSON.parse(__firebase_config);
                state.appId = typeof __app_id !== 'undefined' ? __app_id : 'hall-pass-system-v5';
                
                const app = initializeApp(config);
                const auth = getAuth(app);
                state.db = getFirestore(app);

                // Start authentication
                let user;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const result = await signInWithCustomToken(auth, __initial_auth_token);
                    user = result.user;
                } else {
                    const result = await signInAnonymously(auth);
                    user = result.user;
                }

                if (user) {
                    state.user = user;
                    updateSyncUI('online');
                    startDataSync();
                } else {
                    throw new Error("Authentication returned null user");
                }

                // Reliability: also listen for changes
                onAuthStateChanged(auth, (u) => {
                    if (u && !state.user) {
                        state.user = u;
                        updateSyncUI('online');
                        startDataSync();
                    }
                });

            } catch (err) {
                console.error("Initialization failed:", err);
                updateSyncUI('error');
            }
        }

        function updateSyncUI(status) {
            const ind = document.getElementById('sync-indicator');
            const txt = document.getElementById('sync-text');
            const retry = document.getElementById('retry-btn');

            if (status === 'online') {
                ind.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]";
                txt.innerText = "Sync Active";
                txt.className = "text-emerald-600 text-[10px] font-bold uppercase tracking-wider";
                retry.classList.add('hidden');
            } else if (status === 'error') {
                ind.className = "w-2 h-2 rounded-full bg-red-500";
                txt.innerText = "Connection Failed";
                txt.className = "text-red-600 text-[10px] font-bold uppercase tracking-wider";
                retry.classList.remove('hidden');
            } else {
                ind.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
                txt.innerText = "Connecting...";
                txt.className = "text-amber-600 text-[10px] font-bold uppercase tracking-wider";
            }
        }

        function startDataSync() {
            if (!state.user || !state.db) return;

            const sRef = collection(state.db, 'artifacts', state.appId, 'public', 'data', 'students');
            const pRef = collection(state.db, 'artifacts', state.appId, 'public', 'data', 'active_passes');

            onSnapshot(sRef, (snap) => {
                state.students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (err) => {
                console.error("Student Sync Error:", err);
                updateSyncUI('error');
            });

            onSnapshot(pRef, (snap) => {
                state.activePasses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (err) => console.error("Pass Sync Error:", err));
        }

        // Global Window Functions for HTML Buttons
        window.openModal = (mode, id = null) => {
            const s = state.students.find(x => x.id === id);
            document.getElementById('modal-title').innerText = mode === 'add' ? 'New Student' : 'Edit Student';
            document.getElementById('m-id').value = id || '';
            document.getElementById('m-name').value = s ? s.name : '';
            document.getElementById('m-period').value = s ? s.period : state.currentPeriod;
            document.getElementById('modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');

        window.saveStudent = async () => {
            if (!state.user) return;
            const btn = document.getElementById('modal-save-btn');
            btn.disabled = true;
            btn.innerText = "Saving...";

            try {
                const name = document.getElementById('m-name').value.trim();
                const period = String(document.getElementById('m-period').value.trim());
                const id = document.getElementById('m-id').value || `s_${Date.now()}`;

                if (name && period) {
                    await setDoc(doc(state.db, 'artifacts', state.appId, 'public', 'data', 'students', id), {
                        name, period, passesUsed: 0, history: []
                    }, { merge: true });
                    closeModal();
                }
            } catch (e) {
                showToast("Save Failed");
            } finally {
                btn.disabled = false;
                btn.innerText = "Save";
            }
        };

        window.togglePass = async (sid) => {
            if (!state.user) return;
            const active = state.activePasses.find(p => p.studentId === sid);
            const student = state.students.find(s => s.id === sid);

            try {
                if (active) {
                    const duration = Math.floor((Date.now() - active.startTime) / 1000);
                    const isOvertime = duration >= OVERTIME;
                    
                    const batch = writeBatch(state.db);
                    batch.delete(doc(state.db, 'artifacts', state.appId, 'public', 'data', 'active_passes', sid));
                    
                    const log = {
                        ts: Date.now(),
                        duration,
                        period: student.period,
                        overtime: isOvertime
                    };

                    batch.update(doc(state.db, 'artifacts', state.appId, 'public', 'data', 'students', sid), {
                        passesUsed: (student.passesUsed || 0) + (isOvertime ? 1 : 0),
                        history: [log, ...(student.history || [])].slice(0, 50)
                    });
                    await batch.commit();
                    showToast(isOvertime ? "Returned (Overtime recorded)" : "Returned safe");
                } else {
                    await setDoc(doc(state.db, 'artifacts', state.appId, 'public', 'data', 'active_passes', sid), {
                        studentId: sid,
                        name: student.name,
                        startTime: Date.now()
                    });
                    showToast("Pass Issued");
                }
            } catch (e) {
                showToast("Operation Failed");
            }
        };

        window.adjustPasses = async (sid, delta) => {
            if (!state.user) return;
            const s = state.students.find(x => x.id === sid);
            const newVal = Math.max(0, (s.passesUsed || 0) + delta);
            await updateDoc(doc(state.db, 'artifacts', state.appId, 'public', 'data', 'students', sid), { passesUsed: newVal });
        };

        window.deleteStudent = async (sid) => {
            if (!state.user) return;
            if (confirm("Delete this student record?")) {
                await deleteDoc(doc(state.db, 'artifacts', state.appId, 'public', 'data', 'students', sid));
            }
        };

        window.handleCSV = (event) => {
            if (!state.user) return;
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const lines = e.target.result.split(/\r?\n/);
                const batch = writeBatch(state.db);
                let count = 0;

                lines.forEach((line, i) => {
                    const row = line.trim();
                    if (!row || (i === 0 && row.toLowerCase().includes('name'))) return;
                    
                    const cols = row.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                    let name = cols[0];
                    let period = cols[1] || "1";

                    // Support format: FirstName, LastName, Period
                    if (cols.length >= 3 && !isNaN(cols[2])) {
                        name = `${cols[0]} ${cols[1]}`;
                        period = cols[2];
                    }

                    if (name) {
                        const id = `s_csv_${Date.now()}_${count}`;
                        batch.set(doc(state.db, 'artifacts', state.appId, 'public', 'data', 'students', id), {
                            name, period: String(period), passesUsed: 0, history: []
                        });
                        count++;
                    }
                });

                if (count > 0) {
                    await batch.commit();
                    showToast(`Imported ${count} students`);
                }
            };
            reader.readAsText(file);
        };

        window.setPeriod = (p) => { state.currentPeriod = p; render(); };
        window.toggleView = () => { state.isLogView = !state.isLogView; render(); };

        function render() {
            const studentList = document.getElementById('student-list');
            const timersList = document.getElementById('timers-list');
            const periodTabs = document.getElementById('period-tabs');

            // Global Stats
            document.getElementById('stat-out').innerText = state.activePasses.length;
            document.getElementById('stat-total').innerText = state.students.length;
            const totalPassesRemaining = (state.students.length * LIMIT) - state.students.reduce((a, b) => a + (b.passesUsed || 0), 0);
            document.getElementById('stat-rem').innerText = Math.max(0, totalPassesRemaining);
            document.getElementById('stat-trips').innerText = state.students.reduce((a, b) => a + (b.history?.length || 0), 0);

            // Periods
            const periods = [...new Set(state.students.map(s => s.period))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
            periodTabs.innerHTML = periods.length ? periods.map(p => `
                <button onclick="setPeriod('${p}')" class="px-5 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${state.currentPeriod === p ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-600'}">
                    Period ${p}
                </button>
            `).join('') : '<p class="text-xs text-slate-400 font-bold py-2">Upload CSV to start</p>';

            // Active Passes
            const timerSec = document.getElementById('timers-section');
            if (state.activePasses.length > 0) {
                timerSec.classList.remove('hidden');
                timersList.innerHTML = state.activePasses.map(p => {
                    const elapsed = Math.floor((Date.now() - p.startTime) / 1000);
                    const isOver = elapsed >= OVERTIME;
                    const m = Math.floor(elapsed/60);
                    const s = (elapsed%60).toString().padStart(2,'0');
                    return `
                        <div class="p-5 rounded-2xl border bg-white flex items-center justify-between ${isOver ? 'overtime' : 'border-slate-200'} shadow-sm">
                            <div>
                                <h4 class="font-black text-slate-800">${p.name}</h4>
                                <p class="text-[10px] font-bold ${isOver ? 'text-red-500' : 'text-slate-400'} uppercase">${isOver ? 'EXCEEDED 7 MIN' : 'Current Pass'}</p>
                            </div>
                            <div class="flex items-center gap-5">
                                <span class="font-mono text-2xl font-black ${isOver ? 'text-red-600' : 'text-indigo-600'}">${m}:${s}</span>
                                <button onclick="togglePass('${p.studentId}')" class="bg-slate-900 text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-black">Return</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                timerSec.classList.add('hidden');
            }

            // Student/Log View Toggle
            const filtered = state.students.filter(s => s.period === state.currentPeriod);
            const emptyState = document.getElementById('empty-state');
            document.getElementById('empty-period').innerText = state.currentPeriod;

            if (state.isLogView) {
                document.getElementById('list-view').classList.add('hidden');
                document.getElementById('log-view').classList.remove('hidden');
                emptyState.classList.add('hidden');
                document.getElementById('view-toggle').innerText = "Student List";
                const logs = state.students.flatMap(s => (s.history || []).map(h => ({...h, name: s.name}))).sort((a,b) => b.ts - a.ts);
                document.getElementById('log-list').innerHTML = logs.map(l => `
                    <tr class="text-xs">
                        <td class="px-6 py-4 font-bold">${l.name}</td>
                        <td class="px-6 py-4 text-center font-bold text-slate-400">P${l.period}</td>
                        <td class="px-6 py-4 text-slate-500">${new Date(l.ts).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
                        <td class="px-6 py-4 font-mono font-bold">${Math.floor(l.duration/60)}m ${l.duration%60}s</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 rounded text-[9px] font-black uppercase ${l.overtime ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-600'}">${l.overtime ? 'Deducted' : 'Normal'}</span></td>
                    </tr>
                `).join('') || '<tr><td colspan="5" class="p-10 text-center text-slate-400 italic">No historical logs found</td></tr>';
            } else {
                document.getElementById('list-view').classList.remove('hidden');
                document.getElementById('log-view').classList.add('hidden');
                document.getElementById('view-toggle').innerText = "Master Log";
                emptyState.classList.toggle('hidden', filtered.length > 0 || state.students.length === 0);
                
                studentList.innerHTML = filtered.map(s => {
                    const isOut = state.activePasses.some(p => p.studentId === s.id);
                    const used = s.passesUsed || 0;
                    const danger = used >= LIMIT;
                    return `
                        <tr class="${isOut ? 'bg-indigo-50/50' : ''}">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <button onclick="deleteStudent('${s.id}')" class="text-slate-300 hover:text-red-400"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round"/></svg></button>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="font-bold text-slate-700">${s.name}</span>
                                            <button onclick="openModal('edit', '${s.id}')" class="text-indigo-300 hover:text-indigo-600"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2" stroke-linecap="round"/></svg></button>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-4">
                                    <div class="flex items-center bg-slate-100 rounded-lg overflow-hidden border border-slate-200">
                                        <button onclick="adjustPasses('${s.id}', -1)" class="px-3 py-1 hover:bg-white transition-colors font-bold text-slate-400">-</button>
                                        <span class="px-3 py-1 font-black text-xs ${danger ? 'text-red-600 bg-red-50' : 'text-slate-700'}">${used}</span>
                                        <button onclick="adjustPasses('${s.id}', 1)" class="px-3 py-1 hover:bg-white transition-colors font-bold text-slate-400">+</button>
                                    </div>
                                    <div class="w-24 h-2 bg-slate-100 rounded-full overflow-hidden border border-slate-200 hidden sm:block">
                                        <div class="h-full transition-all duration-500 ${danger ? 'bg-red-500' : 'bg-emerald-500'}" style="width: ${Math.min(100, (used/LIMIT)*100)}%"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="togglePass('${s.id}')" ${isOut ? 'disabled' : ''} class="px-5 py-2 rounded-xl text-[10px] font-black tracking-widest transition-all ${isOut ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-md'}">
                                    ${isOut ? 'CURRENTLY OUT' : 'ISSUE PASS'}
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // Live timer update
        setInterval(() => { if (state.activePasses.length > 0) render(); }, 1000);
        
        // Start app
        init();

    </script>
</body>
</html>
